<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ASA</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;

  background: #05040a;
  color: #f5f4fa;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}


/* =========================================================
   COLORS
========================================================= */

:root {

  --bg: #05040a;

  --panel: #0d0c16;

  --panel2: #12111d;

  --border:
    rgba(255,255,255,.09);

  --text: #f5f4fa;

  --muted: #858394;

  --purple: #9b35ff;

  --purple2: #c53cff;

}


/* =========================================================
   APP
========================================================= */

.app {

  width: 100%;
  height: 100dvh;

  position: relative;

  overflow: hidden;

  background:

    radial-gradient(
      circle at 50% 18%,
      rgba(130,30,190,.17),
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(80,0,150,.12),
      transparent 38%
    ),

    #05040a;
}


/* =========================================================
   HEADER
========================================================= */

.header {

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 100px;

  padding:
    14px
    18px;

  display: flex;

  align-items: center;

  gap: 12px;

  z-index: 20;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.99),
      rgba(5,4,10,.91)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}


.menuButton,
.iconButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(18,17,29,.9);

  border:
    1px solid
    rgba(255,255,255,.10);

  font-size: 25px;

  cursor: pointer;

  transition:
    transform .15s,
    background .15s;
}


.menuButton:active,
.iconButton:active {

  transform: scale(.94);

}


.logo {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8d2fff,
      #c53cff
    );

  box-shadow:
    0 0 30px
    rgba(163,45,255,.32);

  font-size: 31px;

  font-weight: 800;
}


.brand {

  font-size: 29px;

  font-weight: 800;

  letter-spacing: 6px;

  white-space: nowrap;
}


.headerSpacer {

  flex: 1;
}


.headerActions {

  display: flex;

  gap: 7px;
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat {

  position: absolute;

  top: 100px;
  left: 0;
  right: 0;
  bottom: 120px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    45px
    18px
    150px;

  scroll-behavior: smooth;
}


.chat::-webkit-scrollbar {

  width: 4px;

}


.chat::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);

  border-radius: 10px;

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

  width: 100%;

  display: flex;

  margin-bottom: 22px;

  align-items: flex-start;
}


.message.user {

  justify-content: flex-end;

}


.message.assistant {

  justify-content: flex-start;

}


/* =========================================================
   USER MESSAGE
========================================================= */

.user .bubble {

  display: block;

  width: fit-content;

  max-width: 88%;

  padding:
    15px
    19px;

  border-radius: 24px;

  border-bottom-right-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #8439e9,
      #c53bda
    );

  box-shadow:
    0 10px 35px
    rgba(131,48,255,.14);

  font-size: 18px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}


/* =========================================================
   ASA MESSAGE
========================================================= */

/*
   ÖNEMLİ:
   ASA cevabında artık büyük kart yok.
*/

.assistant .bubble {

  display: block;

  width: auto;

  max-width: 90%;

  padding:
    4px
    0;

  background: transparent;

  border: 0;

  box-shadow: none;

  border-radius: 0;

  font-size: 18px;

  line-height: 1.65;

  white-space: normal;

  word-break: break-word;
}


.assistantLabel {

  display: block;

  margin-bottom: 8px;

  color:
    #b43cff;

  font-size: 13px;

  font-weight: 800;

  letter-spacing: 6px;
}


.assistantText {

  color:
    #f1eff7;
}


/* =========================================================
   TYPING
========================================================= */

.typing {

  display: flex;

  align-items: center;

  gap: 6px;

  height: 20px;

  padding-top: 3px;
}


.typing span {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    #b43cff;

  animation:
    typing 1.1s infinite;
}


.typing span:nth-child(2) {

  animation-delay:
    .15s;

}


.typing span:nth-child(3) {

  animation-delay:
    .30s;

}


@keyframes typing {

  0%,
  60%,
  100% {

    opacity: .25;

    transform:
      translateY(0);

  }

  30% {

    opacity: 1;

    transform:
      translateY(-4px);

  }

}


/* =========================================================
   EMPTY SCREEN
========================================================= */

.empty {

  min-height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 30px;
}


.emptyLogo {

  width: 86px;
  height: 86px;

  border-radius: 27px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8e30ff,
      #c33cff
    );

  font-size: 48px;

  font-weight: 800;

  box-shadow:
    0 0 60px
    rgba(159,44,255,.28);

  margin-bottom: 22px;
}


.empty h1 {

  font-size: 27px;

  margin-bottom: 8px;

}


.empty p {

  color:
    var(--muted);

  font-size: 17px;

}


/* =========================================================
   INPUT
========================================================= */

.inputArea {

  position: absolute;

  left: 12px;
  right: 12px;

  bottom: 12px;

  z-index: 25;
}


.inputBox {

  min-height: 78px;

  border-radius: 25px;

  display: flex;

  align-items: center;

  padding: 7px;

  background:
    rgba(15,14,25,.97);

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.4),

    0 0 35px
    rgba(135,35,255,.08);
}


.voiceButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.08);

  font-size: 28px;

  cursor: pointer;
}


.input {

  flex: 1;

  min-width: 0;

  height: 58px;

  background: transparent;

  border: 0;

  outline: 0;

  color: white;

  padding:
    0 11px;

  font-size: 17px;
}


.input::placeholder {

  color:
    #727181;

}


.sendButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );

  font-size: 32px;

  cursor: pointer;

  box-shadow:
    0 0 30px
    rgba(165,45,255,.22);

}


.sendButton:disabled {

  opacity: .45;

}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 50;

  background:
    rgba(0,0,0,.60);

  backdrop-filter:
    blur(8px);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s;
}


.overlay.open {

  opacity: 1;

  pointer-events: auto;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  width:
    min(430px, 88vw);

  z-index: 60;

  transform:
    translateX(-105%);

  transition:
    transform .30s
    cubic-bezier(.22,.8,.25,1);

  padding: 22px;

  display: flex;

  flex-direction: column;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #0e0d19,
      #080710
    );

  border-right:
    1px solid
    rgba(255,255,255,.09);
}


.sidebar.open {

  transform:
    translateX(0);

}


/* =========================================================
   SIDEBAR HEADER
========================================================= */

.sidebarHeader {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 35px;
}


.sidebarLogo {

  width: 58px;
  height: 58px;

  border-radius: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #9130ff,
      #c33cff
    );

  font-size: 31px;

  font-weight: 800;
}


.sidebarBrand {

  flex: 1;

  font-size: 25px;

  font-weight: 800;

  letter-spacing: 7px;
}


.closeButton {

  width: 55px;
  height: 55px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.05);

  font-size: 31px;

  cursor: pointer;
}


/* =========================================================
   SIDEBAR MENU
========================================================= */

.menuSectionTitle {

  color:
    #858394;

  font-size: 12px;

  letter-spacing: 5px;

  font-weight: 800;

  margin-bottom: 12px;
}


.menuItem {

  width: 100%;

  min-height: 62px;

  display: flex;

  align-items: center;

  gap: 17px;

  padding:
    8px
    13px;

  border-radius: 18px;

  background: transparent;

  text-align: left;

  font-size: 18px;

  font-weight: 600;

  cursor: pointer;

  transition:
    background .18s,
    transform .15s;
}


.menuItem:active {

  transform:
    scale(.98);

}


.menuItem.active {

  background:
    rgba(155,53,255,.14);

}


.menuIcon {

  width: 42px;

  text-align: center;

  font-size: 27px;
}


.menuDivider {

  height: 1px;

  background:
    rgba(255,255,255,.07);

  margin:
    20px 0;
}


/* =========================================================
   HISTORY AREA
========================================================= */

.historyHeader {

  display: none;

  align-items: center;

  gap: 10px;

  margin-bottom: 12px;
}


.historyHeader.show {

  display: flex;

}


.backHistory {

  width: 42px;
  height: 42px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.05);

  font-size: 23px;

  cursor: pointer;
}


.historyHeaderTitle {

  font-size: 20px;

  font-weight: 700;
}


.chatList {

  flex: 1;

  overflow-y: auto;

  padding-right: 3px;

  display: none;
}


.chatList.show {

  display: block;

}


.chatList::-webkit-scrollbar {

  width: 3px;

}


.chatList::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);

  border-radius: 10px;

}


.historyGroup {

  margin-bottom: 20px;
}


.historyDate {

  color:
    #747286;

  font-size: 12px;

  letter-spacing: 3px;

  font-weight: 800;

  margin:
    15px 7px 9px;
}


.historyItem {

  position: relative;

  width: 100%;

  padding:
    15px
    52px
    15px
    16px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.06);

  margin-bottom: 8px;

  cursor: pointer;

  transition:
    transform .15s,
    background .15s;
}


.historyItem:active {

  transform:
    scale(.985);

}


.historyItem.current {

  background:
    rgba(155,53,255,.12);

  border-color:
    rgba(155,53,255,.25);
}


.historyTitle {

  font-size: 16px;

  font-weight: 650;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.historyTime {

  color:
    #727181;

  font-size: 11px;

  margin-top: 5px;
}


.historyMore {

  position: absolute;

  right: 9px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 36px;
  height: 36px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.045);

  color:
    #aaa8b6;

  font-size: 17px;

  cursor: pointer;
}


.noHistory {

  color:
    #666578;

  text-align: center;

  padding:
    35px 10px;

  font-size: 15px;
}


/* =========================================================
   SIDEBAR FOOTER
========================================================= */

.sidebarFooter {

  text-align: center;

  color:
    #666578;

  font-size: 13px;

  padding-top: 15px;
}


/* =========================================================
   CONTEXT MENU
========================================================= */

.contextMenu {

  position: fixed;

  z-index: 100;

  width: 210px;

  display: none;

  padding: 7px;

  border-radius: 17px;

  background:
    #151421;

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);
}


.contextMenu.open {

  display: block;

}


.contextItem {

  width: 100%;

  padding:
    13px 14px;

  border-radius: 12px;

  background: transparent;

  text-align: left;

  font-size: 14px;

  cursor: pointer;
}


.contextItem:active {

  background:
    rgba(255,255,255,.06);

}


.contextItem.delete {

  color:
    #ff687c;
}


/* =========================================================
   MODALS
========================================================= */

.modalOverlay {

  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 22px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(10px);
}


.modalOverlay.open {

  display: flex;

}


.modal {

  width:
    min(480px, 100%);

  padding: 25px;

  border-radius: 25px;

  background:
    #12111d;

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.6);
}


.modal h2 {

  font-size: 22px;

  margin-bottom: 18px;
}


.modalText {

  color:
    #898796;

  line-height: 1.5;

  margin-bottom: 5px;
}


.modalInput {

  width: 100%;

  padding: 16px;

  border-radius: 16px;

  background:
    #090811;

  border:
    1px solid
    rgba(255,255,255,.10);

  outline: none;

  color: white;

  font-size: 16px;
}


.modalButtons {

  display: flex;

  gap: 10px;

  margin-top: 18px;
}


.modalButton {

  flex: 1;

  padding: 14px;

  border-radius: 15px;

  background:
    rgba(255,255,255,.06);

  cursor: pointer;
}


.modalButton.primary {

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}


.modalButton.danger {

  background:
    #a92843;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .header {

    height: 100px;

    padding:
      15px
      14px;

    gap: 10px;

  }


  .menuButton,
  .iconButton,
  .logo {

    width: 58px;
    height: 58px;

  }


  .brand {

    font-size: 28px;

    letter-spacing: 6px;

  }


  .chat {

    top: 100px;

    bottom: 110px;

    padding:
      42px
      18px
      145px;

  }


  .user .bubble {

    max-width: 88%;

    font-size: 18px;

    padding:
      14px
      18px;

  }


  .assistant .bubble {

    max-width: 91%;

    font-size: 18px;

  }


  .sidebar {

    width: 88vw;

    padding:
      20px;

  }


  .inputArea {

    bottom: 12px;

  }

}

</style>
</head>


<body>


<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <button
      class="menuButton"
      id="menuButton"
      type="button"
      aria-label="Menü"
    >
      ☰
    </button>


    <div class="logo">
      A
    </div>


    <div class="brand">
      ASA
    </div>


    <div class="headerSpacer"></div>


    <div class="headerActions">

      <button
        class="iconButton"
        id="memoryButton"
        type="button"
        title="Hafızam"
      >
        🧠
      </button>


      <button
        class="iconButton"
        id="settingsButton"
        type="button"
        title="Ayarlar"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <main
    class="chat"
    id="chat"
  ></main>


  <!-- =====================================================
       INPUT
  ====================================================== -->

  <div class="inputArea">

    <div class="inputBox">

      <button
        class="voiceButton"
        id="voiceButton"
        type="button"
      >
        🎙️
      </button>


      <input
        class="input"
        id="messageInput"
        type="text"
        autocomplete="off"
        placeholder="ASA'ya bir şey sor..."
      >


      <button
        class="sendButton"
        id="sendButton"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     OVERLAY
========================================================= -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
  class="sidebar"
  id="sidebar"
>


  <div class="sidebarHeader">

    <div class="sidebarLogo">
      A
    </div>


    <div class="sidebarBrand">
      ASA
    </div>


    <button
      class="closeButton"
      id="closeMenu"
      type="button"
    >
      ×
    </button>

  </div>


  <!-- ANA MENÜ -->

  <div id="mainMenu">


    <div class="menuSectionTitle">
      SOHBET
    </div>


    <button
      class="menuItem"
      id="newChatButton"
      type="button"
    >

      <span class="menuIcon">
        ＋
      </span>

      <span>
        Yeni Sohbet
      </span>

    </button>


    <button
      class="menuItem"
      id="showChatsButton"
      type="button"
    >

      <span class="menuIcon">
        💬
      </span>

      <span>
        Sohbetler
      </span>

    </button>


    <div class="menuDivider"></div>


    <div class="menuSectionTitle">
      ASA
    </div>


    <button
      class="menuItem"
      id="memoryMenuButton"
      type="button"
    >

      <span class="menuIcon">
        🧠
      </span>

      <span>
        Hafızam
      </span>

    </button>


    <button
      class="menuItem"
      id="settingsMenuButton"
      type="button"
    >

      <span class="menuIcon">
        ⚙️
      </span>

      <span>
        Ayarlar
      </span>

    </button>

  </div>


  <!-- GEÇMİŞ SOHBETLER -->

  <div
    class="historyHeader"
    id="historyHeader"
  >

    <button
      class="backHistory"
      id="backHistory"
      type="button"
    >
      ‹
    </button>


    <div class="historyHeaderTitle">
      Sohbetler
    </div>

  </div>


  <div
    class="chatList"
    id="chatList"
  ></div>


  <div class="sidebarFooter">
    ASA v1.2 · Alperen'in kişisel asistanı
  </div>

</aside>


<!-- =========================================================
     CONTEXT MENU
========================================================= -->

<div
  class="contextMenu"
  id="contextMenu"
>

  <button
    class="contextItem"
    id="renameButton"
    type="button"
  >
    ✏️ Başlığı değiştir
  </button>


  <button
    class="contextItem delete"
    id="deleteButton"
    type="button"
  >
    🗑️ Sohbeti sil
  </button>

</div>


<!-- =========================================================
     RENAME MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="renameModal"
>

  <div class="modal">

    <h2>
      Sohbet başlığını değiştir
    </h2>


    <input
      class="modalInput"
      id="renameInput"
      type="text"
      maxlength="80"
      placeholder="Sohbet adı"
    >


    <div class="modalButtons">

      <button
        class="modalButton"
        id="renameCancel"
        type="button"
      >
        İptal
      </button>


      <button
        class="modalButton primary"
        id="renameSave"
        type="button"
      >
        Kaydet
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     DELETE MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="deleteModal"
>

  <div class="modal">

    <h2>
      Sohbet silinsin mi?
    </h2>


    <p
      class="modalText"
      id="deleteText"
    >
      Bu sohbet silinecek.
    </p>


    <div class="modalButtons">

      <button
        class="modalButton"
        id="deleteCancel"
        type="button"
      >
        İptal
      </button>


      <button
        class="modalButton danger"
        id="deleteConfirm"
        type="button"
      >
        Sil
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL = "/api/chat";

const STORAGE_KEY =
  "asa_conversations_v2";

const ACTIVE_KEY =
  "asa_active_conversation_v2";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const menuButton =
  document.getElementById("menuButton");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const closeMenu =
  document.getElementById("closeMenu");

const mainMenu =
  document.getElementById("mainMenu");

const chatList =
  document.getElementById("chatList");

const historyHeader =
  document.getElementById("historyHeader");

const contextMenu =
  document.getElementById("contextMenu");

const renameModal =
  document.getElementById("renameModal");

const renameInput =
  document.getElementById("renameInput");

const deleteModal =
  document.getElementById("deleteModal");


/* =========================================================
   STATE
========================================================= */

let conversationId = null;

let messages = [];

let contextConversationId = null;

let isSending = false;


/* =========================================================
   STORAGE
========================================================= */

function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function createConversationId() {

  return (
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2, 9)
  );

}


function getActiveConversationId() {

  return localStorage.getItem(
    ACTIVE_KEY
  );

}


function setActiveConversationId(id) {

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

}


/* =========================================================
   NEW CONVERSATION
========================================================= */

function createNewConversation() {

  conversationId =
    createConversationId();

  messages = [];

  setActiveConversationId(
    conversationId
  );

  showEmpty();

  input.focus();

}


/* =========================================================
   TITLE
========================================================= */

function generateTitle(text) {

  let title =
    String(text || "")
      .replace(/\s+/g, " ")
      .trim();


  if (!title) {

    return "Yeni Sohbet";

  }


  title =
    title
      .replace(/[?!.]+$/g, "")
      .trim();


  if (title.length > 45) {

    title =
      title
        .slice(0, 45)
        .trim() +
      "…";

  }


  return (
    title.charAt(0).toUpperCase() +
    title.slice(1)
  );

}


/* =========================================================
   SAVE CONVERSATION METADATA
========================================================= */

function ensureConversation(firstMessage = "") {

  let conversations =
    loadConversations();


  let item =
    conversations.find(
      x =>
        x.id ===
        conversationId
    );


  if (!item) {

    item = {

      id:
        conversationId,

      title:
        firstMessage
          ? generateTitle(firstMessage)
          : "Yeni Sohbet",

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };


    conversations.unshift(
      item
    );

  }


  if (
    firstMessage &&
    item.title ===
      "Yeni Sohbet"
  ) {

    item.title =
      generateTitle(
        firstMessage
      );

  }


  item.updatedAt =
    Date.now();


  saveConversations(
    conversations
  );

}


/* =========================================================
   MENU
========================================================= */

function openMenu() {

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

}


function closeSidebar() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

  closeContextMenu();

}


menuButton.addEventListener(
  "click",
  openMenu
);


closeMenu.addEventListener(
  "click",
  closeSidebar
);


overlay.addEventListener(
  "click",
  closeSidebar
);


/* =========================================================
   SHOW MAIN MENU
========================================================= */

function showMainMenu() {

  mainMenu.style.display =
    "block";

  historyHeader.classList.remove(
    "show"
  );

  chatList.classList.remove(
    "show"
  );

}


/* =========================================================
   SHOW CHAT HISTORY
========================================================= */

function showChatHistory() {

  mainMenu.style.display =
    "none";

  historyHeader.classList.add(
    "show"
  );

  chatList.classList.add(
    "show"
  );

  renderChatList();

}


/* =========================================================
   CHAT HISTORY BUTTON
========================================================= */

document
  .getElementById(
    "showChatsButton"
  )
  .addEventListener(
    "click",
    showChatHistory
  );


document
  .getElementById(
    "backHistory"
  )
  .addEventListener(
    "click",
    showMainMenu
  );


/* =========================================================
   RENDER CHAT LIST
========================================================= */

function renderChatList() {

  const conversations =
    loadConversations()
      .sort(
        (a, b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


  chatList.innerHTML = "";


  if (
    conversations.length === 0
  ) {

    chatList.innerHTML = `
      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>
    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );


      const key =
        date.toDateString();


      if (!groups[key]) {

        groups[key] = [];

      }


      groups[key].push(
        item
      );

    }
  );


  Object.entries(groups)
    .forEach(
      ([key, items]) => {

        const group =
          document.createElement(
            "div"
          );

        group.className =
          "historyGroup";


        const dateTitle =
          document.createElement(
            "div"
          );

        dateTitle.className =
          "historyDate";

        dateTitle.textContent =
          getDateLabel(key);


        group.appendChild(
          dateTitle
        );


        items.forEach(
          item => {

            const element =
              document.createElement(
                "div"
              );

            element.className =
              "historyItem";


            if (
              item.id ===
              conversationId
            ) {

              element.classList.add(
                "current"
              );

            }


            element.innerHTML = `

              <div class="historyTitle">
                ${escapeHtml(item.title)}
              </div>

              <div class="historyTime">
                ${formatTime(item.updatedAt)}
              </div>

              <button
                class="historyMore"
                type="button"
                aria-label="Sohbet seçenekleri"
              >
                •••
              </button>

            `;


            element.addEventListener(
              "click",
              () => {

                openConversation(
                  item.id
                );

              }
            );


            const more =
              element.querySelector(
                ".historyMore"
              );


            more.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              element
            );

          }
        );


        chatList.appendChild(
          group
        );

      }
    );

}


/* =========================================================
   DATE LABEL
========================================================= */

function getDateLabel(
  dateString
) {

  const date =
    new Date(
      dateString
    );

  const now =
    new Date();


  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    now.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    )
    .toUpperCase();

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
  timestamp
) {

  if (!timestamp) {

    return "";

  }


  return new Date(
    timestamp
  ).toLocaleTimeString(
    "tr-TR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  text
) {

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(
  id,
  element
) {

  contextConversationId =
    id;


  const rect =
    element.getBoundingClientRect();


  contextMenu.style.left =
    Math.max(
      10,
      rect.left - 175
    ) + "px";


  contextMenu.style.top =
    Math.min(
      window.innerHeight - 120,
      rect.bottom + 5
    ) + "px";


  contextMenu.classList.add(
    "open"
  );

}


function closeContextMenu() {

  contextMenu.classList.remove(
    "open"
  );

  contextConversationId =
    null;

}


document.addEventListener(
  "click",
  event => {

    if (
      !contextMenu.contains(
        event.target
      ) &&
      !event.target.classList.contains(
        "historyMore"
      )
    ) {

      closeContextMenu();

    }

  }
);


/* =========================================================
   RENAME
========================================================= */

document
  .getElementById(
    "renameButton"
  )
  .addEventListener(
    "click",
    () => {

      const conversations =
        loadConversations();


      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );


      if (!item) {

        return;

      }


      renameInput.value =
        item.title;


      renameModal.classList.add(
        "open"
      );


      closeContextMenu();


      setTimeout(
        () => {

          renameInput.focus();

          renameInput.select();

        },
        100
      );

    }
  );


document
  .getElementById(
    "renameCancel"
  )
  .addEventListener(
    "click",
    () => {

      renameModal.classList.remove(
        "open"
      );

    }
  );


document
  .getElementById(
    "renameSave"
  )
  .addEventListener(
    "click",
    () => {

      const title =
        renameInput.value.trim();


      if (!title) {

        return;

      }


      const conversations =
        loadConversations();


      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );


      if (item) {

        item.title =
          title;

        item.updatedAt =
          Date.now();

        saveConversations(
          conversations
        );

      }


      renameModal.classList.remove(
        "open"
      );


      renderChatList();

    }
  );


/* =========================================================
   DELETE
========================================================= */

document
  .getElementById(
    "deleteButton"
  )
  .addEventListener(
    "click",
    () => {

      const conversations =
        loadConversations();


      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );


      if (!item) {

        return;

      }


      document
        .getElementById(
          "deleteText"
        )
        .textContent =
        `"${item.title}" sohbeti silinecek.`;


      deleteModal.classList.add(
        "open"
      );


      closeContextMenu();

    }
  );


document
  .getElementById(
    "deleteCancel"
  )
  .addEventListener(
    "click",
    () => {

      deleteModal.classList.remove(
        "open"
      );

    }
  );


document
  .getElementById(
    "deleteConfirm"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        contextConversationId;


      let conversations =
        loadConversations();


      conversations =
        conversations.filter(
          x =>
            x.id !== id
        );


      saveConversations(
        conversations
      );


      deleteModal.classList.remove(
        "open"
      );


      if (
        id ===
        conversationId
      ) {

        createNewConversation();

      }


      renderChatList();

    }
  );


/* =========================================================
   NEW CHAT
========================================================= */

document
  .getElementById(
    "newChatButton"
  )
  .addEventListener(
    "click",
    () => {

      createNewConversation();

      showMainMenu();

      closeSidebar();

    }
  );


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(
  id
) {

  conversationId =
    id;


  setActiveConversationId(
    id
  );


  closeSidebar();


  chat.innerHTML = "";


  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId:
                id,

              getHistory:
                true

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

      renderMessages();

    } else {

      showEmpty();

    }

  } catch {

    removeTyping();

    showEmpty();

  }

}


/* =========================================================
   LOAD ACTIVE
========================================================= */

async function loadActiveConversation() {

  const saved =
    getActiveConversationId();


  if (!saved) {

    conversationId =
      createConversationId();

    setActiveConversationId(
      conversationId
    );

    showEmpty();

    return;

  }


  const conversations =
    loadConversations();


  const exists =
    conversations.some(
      x =>
        x.id === saved
    );


  if (!exists) {

    conversationId =
      saved;

    showEmpty();

    return;

  }


  await openConversation(
    saved
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (isSending) {

    return;

  }


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  isSending = true;

  sendButton.disabled =
    true;


  input.value = "";


  if (!conversationId) {

    conversationId =
      createConversationId();

    setActiveConversationId(
      conversationId
    );

  }


  ensureConversation(
    text
  );


  messages.push({

    role:
      "user",

    content:
      text

  });


  renderMessages();


  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId:
                conversationId,

              messages: [
                {
                  role:
                    "user",

                  content:
                    text
                }
              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    const answer =
      data.answer ||
      "Şu anda cevap oluşturamadım.";


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    } else {

      messages.push({

        role:
          "assistant",

        content:
          answer

      });

    }


    ensureConversation();


    renderMessages();


  } catch (error) {

    removeTyping();


    messages.push({

      role:
        "assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    renderMessages();


    console.error(
      "ASA ERROR:",
      error
    );

  }


  isSending = false;

  sendButton.disabled =
    false;

  input.focus();

}


/* =========================================================
   SEND EVENTS
========================================================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages() {

  chat.innerHTML = "";


  if (
    !messages.length
  ) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message " +
        (
          message.role ===
          "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        bubble.innerHTML = `

          <span
            class="assistantLabel"
          >
            ASA
          </span>

          <div
            class="assistantText"
          >
            ${formatAnswer(
              message.content
            )}
          </div>

        `;

      } else {

        bubble.textContent =
          message.content;

      }


      row.appendChild(
        bubble
      );


      chat.appendChild(
        row
      );

    }
  );


  scrollToBottom();

}


/* =========================================================
   FORMAT ANSWER
========================================================= */

function formatAnswer(
  text
) {

  let result =
    escapeHtml(
      text || ""
    );


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}


/* =========================================================
   EMPTY
========================================================= */

function showEmpty() {

  chat.innerHTML = `

    <div class="empty">

      <div class="emptyLogo">
        A
      </div>

      <h1>
        Merhaba Alperen 👋
      </h1>

      <p>
        ASA burada. Ne yapmak istersin?
      </p>

    </div>

  `;

}


/* =========================================================
   TYPING
========================================================= */

function addTyping() {

  removeTyping();


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message assistant";


  row.id =
    "typingMessage";


  row.innerHTML = `

    <div class="bubble">

      <span
        class="assistantLabel"
      >
        ASA
      </span>

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

  `;


  chat.appendChild(
    row
  );


  scrollToBottom();

}


function removeTyping() {

  const element =
    document.getElementById(
      "typingMessage"
    );


  if (element) {

    element.remove();

  }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================================================
   MEMORY / SETTINGS
========================================================= */

document
  .getElementById(
    "memoryButton"
  )
  .addEventListener(
    "click",
    () => {

      alert(
        "🧠 Hafıza panelini bir sonraki aşamada bağlayacağız."
      );

    }
  );


document
  .getElementById(
    "settingsButton"
  )
  .addEventListener(
    "click",
    () => {

      alert(
        "⚙️ Ayarlar panelini bir sonraki aşamada geliştireceğiz."
      );

    }
  );


document
  .getElementById(
    "memoryMenuButton"
  )
  .addEventListener(
    "click",
    () => {

      closeSidebar();

      alert(
        "🧠 Hafıza panelini bir sonraki aşamada gerçek hafıza sistemine bağlayacağız."
      );

    }
  );


document
  .getElementById(
    "settingsMenuButton"
  )
  .addEventListener(
    "click",
    () => {

      closeSidebar();

      alert(
        "⚙️ Ayarlar panelini bir sonraki aşamada geliştireceğiz."
      );

    }
  );


/* =========================================================
   VOICE
========================================================= */

document
  .getElementById(
    "voiceButton"
  )
  .addEventListener(
    "click",
    () => {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        alert(
          "Bu tarayıcı sesli girişi desteklemiyor."
        );

        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "tr-TR";

      recognition.continuous =
        false;

      recognition.interimResults =
        false;


      recognition.onresult =
        event => {

          input.value =
            event
              .results[0][0]
              .transcript;

          input.focus();

        };


      recognition.onerror =
        error => {

          console.log(
            "Voice error:",
            error
          );

        };


      recognition.start();

    }
  );


/* =========================================================
   START
========================================================= */

conversationId =
  getActiveConversationId();


if (!conversationId) {

  conversationId =
    createConversationId();

  setActiveConversationId(
    conversationId
  );

}


showMainMenu();

loadActiveConversation();

</script>

</body>
</html>
