<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>ASA</title>

<style>

/* =====================================================
   ASA — FINAL UI
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #05040a;
  --bg2: #080611;
  --panel: rgba(15, 14, 25, .92);
  --panelSolid: #11101a;

  --text: #f7f5fb;
  --muted: #888696;
  --muted2: #666474;

  --purple: #a331ff;
  --purple2: #c33cff;
  --purple3: #7021bd;

  --border: rgba(255,255,255,.095);
  --borderStrong: rgba(255,255,255,.14);

  --radius: 24px;

  --font:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Avenir Next",
    "Segoe UI",
    sans-serif;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: var(--bg);
  color: var(--text);

  font-family: var(--font);

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  overscroll-behavior: none;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}

button,
.menuItem,
.historyItem,
.iconButton,
.circleButton {
  touch-action: manipulation;
}


/* =====================================================
   APP
===================================================== */

.app {
  position: relative;

  width: 100%;
  height: 100dvh;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 55% 8%,
      rgba(142, 34, 220, .18),
      transparent 31%
    ),
    radial-gradient(
      circle at 92% 76%,
      rgba(93, 0, 170, .13),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #05040a,
      #06040b
    );
}


/* =====================================================
   HEADER
===================================================== */

.header {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 112px;

  padding:
    calc(14px + env(safe-area-inset-top))
    22px
    14px;

  display: flex;
  align-items: center;

  gap: 15px;

  z-index: 30;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.98),
      rgba(5,4,10,.88)
    );

  border-bottom:
    1px solid rgba(255,255,255,.075);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}


/* hamburger */

.menuButton {
  width: 58px;
  height: 58px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 19px;

  background: rgba(20,19,30,.74);

  border:
    1px solid var(--border);

  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease;
}

.menuButton span {
  width: 25px;
  height: 18px;

  position: relative;

  display: block;
}

.menuButton span::before,
.menuButton span::after,
.menuButton span {
  background: transparent;
}

.menuButton span i {
  position: absolute;

  left: 0;

  width: 25px;
  height: 2px;

  border-radius: 2px;

  background: #f4f1f8;
}

.menuButton span i:nth-child(1) {
  top: 0;
}

.menuButton span i:nth-child(2) {
  top: 8px;
}

.menuButton span i:nth-child(3) {
  top: 16px;
}

.menuButton:active {
  transform: scale(.94);
}


/* ASA WORDMARK */

.brand {
  position: relative;

  display: flex;
  align-items: center;

  gap: 7px;

  padding-left: 4px;

  user-select: none;
}

.brand span {
  display: inline-block;

  font-family:
    "Avenir Next",
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

  font-size: 32px;

  line-height: 1;

  font-weight: 700;

  letter-spacing: .28em;

  color: #f6f4fa;
}

.brand span:last-child {
  margin-left: -1px;
}


/* header spacer */

.headerSpacer {
  flex: 1;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
  position: absolute;

  top: 112px;
  left: 0;
  right: 0;
  bottom: 104px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    34px
    24px
    155px;

  scroll-behavior: smooth;

  overscroll-behavior: contain;
}

.chat::-webkit-scrollbar {
  width: 3px;
}

.chat::-webkit-scrollbar-thumb {
  background: rgba(176, 55, 255, .32);
  border-radius: 10px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
  min-height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyMark {
  width: 74px;
  height: 74px;

  margin-bottom: 25px;

  border-radius: 24px;

  position: relative;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.38),
      transparent 20%
    ),
    radial-gradient(
      circle at 60% 65%,
      #b833ff,
      #6816a7
    );

  box-shadow:
    0 0 55px rgba(163,48,255,.25);

  overflow: hidden;
}

.emptyMark::after {
  content: "";

  position: absolute;

  inset: 17px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.9),
      rgba(255,255,255,.12) 25%,
      rgba(160,42,255,.1) 55%,
      transparent 70%
    );

  filter: blur(2px);
}

.empty h1 {
  font-size: 28px;

  line-height: 1.2;

  font-weight: 650;

  letter-spacing: -.025em;

  margin-bottom: 10px;
}

.empty p {
  color: var(--muted);

  font-size: 17px;

  line-height: 1.5;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
  width: 100%;

  display: flex;

  margin-bottom: 27px;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}


/* USER */

.user .bubble {
  max-width: min(78%, 680px);

  padding:
    16px
    20px;

  border-radius: 24px 24px 7px 24px;

  background:
    linear-gradient(
      135deg,
      #8d32f1,
      #c23bd6
    );

  color: white;

  font-size: 18px;

  line-height: 1.5;

  box-shadow:
    0 12px 35px rgba(126,37,235,.14);
}


/* ASSISTANT */

.assistant .bubble {
  max-width: min(92%, 820px);

  padding:
    4px
    0;

  background: transparent;

  font-size: 18px;

  line-height: 1.72;

  color: #f4f1f7;
}

.assistantLabel {
  display: block;

  margin-bottom: 13px;

  color: #b13cff;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: .48em;
}

.assistantText strong {
  font-weight: 700;
}

.assistantText a {
  color: #c56cff;
  text-decoration: underline;
}


/* IMAGE MESSAGE */

.messageImage {
  display: block;

  width: min(320px, 70vw);
  max-height: 420px;

  object-fit: cover;

  border-radius: 22px;

  margin-bottom: 8px;

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 14px 45px rgba(0,0,0,.28);
}


/* =====================================================
   TYPING
===================================================== */

.typing {
  display: flex;

  gap: 7px;

  padding-top: 2px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #b93cff;

  animation:
    typing 1.15s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .14s;
}

.typing span:nth-child(3) {
  animation-delay: .28s;
}

@keyframes typing {

  0%,
  60%,
  100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }

}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea {
  position: absolute;

  left: 18px;
  right: 18px;

  bottom:
    calc(13px + env(safe-area-inset-bottom));

  z-index: 40;
}

.inputBox {
  min-height: 72px;

  display: flex;
  align-items: center;

  gap: 6px;

  padding: 7px 8px;

  border-radius: 25px;

  background:
    rgba(16,15,25,.95);

  border:
    1px solid rgba(255,255,255,.11);

  box-shadow:
    0 18px 55px rgba(0,0,0,.38),
    0 0 40px rgba(139,37,255,.07);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}


/* INPUT */

.input {
  flex: 1;

  min-width: 0;

  height: 54px;

  padding:
    0 11px;

  border: 0;
  outline: 0;

  background: transparent;

  color: #f7f4fa;

  font-size: 17px;

  font-weight: 450;

  letter-spacing: -.01em;
}

.input::placeholder {
  color: #777483;
}


/* LEFT + */

.plusButton {
  width: 54px;
  height: 54px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 29px;

  font-weight: 300;

  color: #f0edf5;

  cursor: pointer;
}

.plusButton:active,
.voiceButton:active,
.sendButton:active {
  transform: scale(.94);
}


/* VOICE */

.voiceButton {
  width: 52px;
  height: 52px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 17px;

  background: transparent;

  color: #e8e4ed;

  cursor: pointer;

  transition: .18s;
}

.voiceIcon {
  width: 20px;
  height: 26px;

  border:
    2px solid currentColor;

  border-radius: 12px;

  position: relative;
}

.voiceIcon::before {
  content: "";

  position: absolute;

  left: 50%;

  bottom: -9px;

  width: 13px;
  height: 8px;

  transform: translateX(-50%);

  border-bottom:
    2px solid currentColor;

  border-left:
    2px solid transparent;

  border-right:
    2px solid transparent;

  border-radius: 0 0 10px 10px;
}

.voiceIcon::after {
  content: "";

  position: absolute;

  left: 50%;

  bottom: -14px;

  width: 2px;
  height: 6px;

  transform: translateX(-50%);

  background: currentColor;

  border-radius: 2px;
}


/* SEND */

.sendButton {
  width: 52px;
  height: 52px;

  flex-shrink: 0;

  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;

  color: #b438ff;

  cursor: pointer;

  font-size: 31px;

  font-weight: 300;

  line-height: 1;

  transition: .18s;
}

.sendButton:disabled {
  opacity: .32;
}


/* =====================================================
   ATTACHMENT SHEET
===================================================== */

.sheetOverlay {
  position: fixed;

  inset: 0;

  z-index: 80;

  background: rgba(0,0,0,.58);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);

  opacity: 0;

  pointer-events: none;

  transition: .22s;
}

.sheetOverlay.open {
  opacity: 1;
  pointer-events: auto;
}

.attachmentSheet {
  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 14px;

  padding: 10px;

  border-radius: 26px;

  background:
    rgba(20,19,30,.98);

  border:
    1px solid rgba(255,255,255,.10);

  transform: translateY(25px);

  transition: .25s;

  box-shadow:
    0 30px 100px rgba(0,0,0,.6);
}

.sheetOverlay.open .attachmentSheet {
  transform: translateY(0);
}

.sheetTitle {
  padding:
    13px
    12px
    10px;

  color: #7d7a89;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .25em;
}

.sheetItem {
  width: 100%;

  min-height: 57px;

  padding:
    0
    14px;

  display: flex;
  align-items: center;

  text-align: left;

  background: transparent;

  color: #f5f2f8;

  font-size: 17px;

  border-radius: 16px;

  cursor: pointer;
}

.sheetItem:active {
  background: rgba(255,255,255,.06);
}

.sheetCancel {
  width: 100%;

  height: 53px;

  margin-top: 7px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.06);

  color: #aaa7b5;

  font-size: 16px;

  cursor: pointer;
}


/* =====================================================
   SIDEBAR
===================================================== */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 90;

  background:
    rgba(0,0,0,.58);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.sidebar {
  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  z-index: 100;

  width: min(430px, 88vw);

  padding:
    calc(23px + env(safe-area-inset-top))
    20px
    calc(18px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      180deg,
      #0d0c17,
      #080710
    );

  border-right:
    1px solid rgba(255,255,255,.09);

  transform:
    translateX(-105%);

  transition:
    transform .3s cubic-bezier(.22,.8,.25,1);

  display: flex;
  flex-direction: column;

  box-shadow:
    30px 0 90px rgba(0,0,0,.35);
}

.sidebar.open {
  transform: translateX(0);
}


/* sidebar header */

.sidebarHeader {
  display: flex;
  align-items: center;

  margin-bottom: 42px;
}

.sidebarBrand {
  flex: 1;

  font-family:
    "Avenir Next",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 25px;

  font-weight: 700;

  letter-spacing: .28em;
}

.closeButton {
  width: 54px;
  height: 54px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.07);

  color: #eeeaf2;

  font-size: 30px;

  font-weight: 300;

  cursor: pointer;
}


/* section */

.menuSectionTitle {
  color: #777484;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .35em;

  margin:
    0
    8px
    14px;
}


/* item */

.menuItem {
  width: 100%;

  min-height: 59px;

  display: flex;
  align-items: center;

  gap: 17px;

  padding:
    0
    12px;

  border-radius: 17px;

  background: transparent;

  text-align: left;

  color: #f3f0f6;

  font-size: 17px;

  font-weight: 550;

  cursor: pointer;

  transition: .18s;
}

.menuItem:active {
  background:
    rgba(255,255,255,.06);
}

.menuIcon {
  width: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #aaa6b5;

  font-size: 23px;
}

.menuDivider {
  height: 1px;

  margin:
    20px 8px;

  background:
    rgba(255,255,255,.075);
}


/* =====================================================
   CHAT LIST
===================================================== */

.chatList {
  flex: 1;

  overflow-y: auto;

  padding:
    0
    2px;
}

.chatList::-webkit-scrollbar {
  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {
  background:
    rgba(172,52,255,.3);
}

.historyGroup {
  margin-bottom: 23px;
}

.historyDate {
  color: #666372;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .25em;

  margin:
    10px
    8px;
}

.historyItem {
  position: relative;

  width: 100%;

  min-height: 70px;

  padding:
    13px
    52px
    13px
    15px;

  margin-bottom: 8px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid rgba(255,255,255,.055);

  cursor: pointer;

  transition: .18s;
}

.historyItem.active {
  background:
    linear-gradient(
      135deg,
      rgba(148,44,245,.18),
      rgba(81,21,130,.12)
    );

  border-color:
    rgba(169,51,255,.45);
}

.historyItem:active {
  transform: scale(.985);
}

.historyTitle {
  color: #f2eef6;

  font-size: 16px;

  font-weight: 550;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.historyTime {
  margin-top: 5px;

  color: #706d7c;

  font-size: 11px;
}

.historyMore {
  position: absolute;

  right: 9px;
  top: 50%;

  width: 38px;
  height: 38px;

  transform: translateY(-50%);

  border-radius: 13px;

  background:
    rgba(255,255,255,.045);

  color: #aaa7b4;

  font-size: 15px;

  cursor: pointer;
}

.noHistory {
  padding: 30px 10px;

  text-align: center;

  color: #686574;

  font-size: 14px;
}

.sidebarFooter {
  padding-top: 15px;

  color: #555260;

  text-align: center;

  font-size: 11px;

  letter-spacing: .04em;
}


/* =====================================================
   CONTEXT MENU
===================================================== */

.contextMenu {
  position: fixed;

  z-index: 150;

  width: 205px;

  padding: 7px;

  border-radius: 18px;

  background:
    #161520;

  border:
    1px solid rgba(255,255,255,.1);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {
  width: 100%;

  padding:
    13px
    14px;

  border-radius: 13px;

  background: transparent;

  color: #f2eff5;

  text-align: left;

  font-size: 14px;

  cursor: pointer;
}

.contextItem:active {
  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {
  color: #ff7183;
}


/* =====================================================
   MODALS
===================================================== */

.modalOverlay {
  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 22px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter: blur(11px);
  -webkit-backdrop-filter: blur(11px);
}

.modalOverlay.open {
  display: flex;
}

.modal {
  width: min(470px, 100%);

  padding: 27px;

  border-radius: 27px;

  background:
    #12111d;

  border:
    1px solid rgba(255,255,255,.11);

  box-shadow:
    0 35px 100px rgba(0,0,0,.65);
}

.modal h2 {
  margin-bottom: 19px;

  font-size: 23px;

  line-height: 1.2;

  letter-spacing: -.02em;
}

.modalInput {
  width: 100%;

  height: 57px;

  padding:
    0
    17px;

  border-radius: 17px;

  background:
    #090811;

  border:
    1px solid rgba(255,255,255,.09);

  outline: 0;

  color: #fff;

  font-size: 17px;
}

.modalButtons {
  display: flex;

  gap: 9px;

  margin-top: 18px;
}

.modalButton {
  flex: 1;

  height: 53px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.055);

  color: #f3eff7;

  cursor: pointer;
}

.modalButton.primary {
  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}

.modalButton.danger {
  background:
    #a72b45;
}


/* =====================================================
   VOICE CHAT OVERLAY
===================================================== */

.voiceMode {
  position: fixed;

  inset: 0;

  z-index: 300;

  display: flex;
  flex-direction: column;

  align-items: center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(133,25,205,.18),
      transparent 32%
    ),
    #05040a;

  opacity: 0;

  pointer-events: none;

  transform: scale(.97);

  transition:
    opacity .3s ease,
    transform .3s ease;
}

.voiceMode.open {
  opacity: 1;

  pointer-events: auto;

  transform: scale(1);
}


/* voice top */

.voiceTop {
  width: 100%;

  padding:
    calc(20px + env(safe-area-inset-top))
    22px
    0;

  display: flex;
  align-items: center;

  justify-content: space-between;
}

.voiceTopTitle {
  font-family:
    "Avenir Next",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 17px;

  font-weight: 650;

  letter-spacing: .24em;
}

.voiceClose {
  width: 48px;
  height: 48px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.08);

  color: #f1edf5;

  font-size: 28px;

  cursor: pointer;
}


/* voice center */

.voiceCenter {
  flex: 1;

  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding-bottom: 8vh;
}


/* ASA ORB */

.asaOrb {
  width: 190px;
  height: 190px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      rgba(255,255,255,.8),
      rgba(255,255,255,.1) 9%,
      transparent 20%
    ),
    radial-gradient(
      circle at 52% 52%,
      #d247ff 0%,
      #9c2fe9 30%,
      #57138d 64%,
      #170a27 100%
    );

  box-shadow:
    0 0 45px rgba(170,45,255,.32),
    0 0 120px rgba(128,27,208,.22);

  animation:
    orbIdle 3.6s ease-in-out infinite;
}

.asaOrb::before,
.asaOrb::after {
  content: "";

  position: absolute;

  inset: -22px;

  border-radius: 50%;

  border:
    1px solid rgba(181,66,255,.18);

  animation:
    orbRing 3.4s ease-in-out infinite;
}

.asaOrb::after {
  inset: -42px;

  border-color:
    rgba(164,52,255,.08);

  animation-delay:
    -.8s;
}

.orbCore {
  width: 60px;
  height: 60px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #e5b5ff 17%,
      #b735ff 45%,
      rgba(110,20,170,.15) 75%
    );

  filter:
    blur(.2px);

  box-shadow:
    0 0 35px rgba(224,161,255,.6);

  animation:
    corePulse 1.9s ease-in-out infinite;
}

.voiceMode.listening .asaOrb {
  animation:
    orbListening 1.15s ease-in-out infinite;
}

.voiceMode.speaking .asaOrb {
  animation:
    orbSpeaking .72s ease-in-out infinite;
}

.voiceMode.listening .orbCore,
.voiceMode.speaking .orbCore {
  animation-duration:
    .65s;
}

@keyframes orbIdle {

  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.045);
  }

}

@keyframes orbListening {

  0%, 100% {
    transform: scale(.97);
  }

  50% {
    transform: scale(1.1);
  }

}

@keyframes orbSpeaking {

  0%, 100% {
    transform: scale(.94);
  }

  50% {
    transform: scale(1.13);
  }

}

@keyframes corePulse {

  0%, 100% {
    transform: scale(.85);
    opacity: .82;
  }

  50% {
    transform: scale(1.12);
    opacity: 1;
  }

}

@keyframes orbRing {

  0%, 100% {
    transform: scale(.96);
    opacity: .35;
  }

  50% {
    transform: scale(1.08);
    opacity: .8;
  }

}


/* voice status */

.voiceStatus {
  margin-top: 58px;

  min-height: 27px;

  color: #aaa6b4;

  font-size: 17px;

  font-weight: 500;

  letter-spacing: -.01em;

  text-align: center;
}

.voiceStatus strong {
  color: #f3eef7;
}


/* voice bottom */

.voiceBottom {
  width: 100%;

  padding:
    0
    24px
    calc(30px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: center;
}

.voiceControl {
  width: 60px;
  height: 60px;

  border-radius: 21px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.10);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.voiceControl .voiceIcon {
  transform: scale(.82);
}


/* =====================================================
   HIDDEN FILE INPUTS
===================================================== */

.hiddenInput {
  position: fixed;

  width: 1px;
  height: 1px;

  opacity: 0;

  pointer-events: none;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

  .header {
    height: 100px;

    padding:
      calc(12px + env(safe-area-inset-top))

}


/* =====================================================

@media (prefers-reduced-motion: reduce) {

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/chat";

const STORAGE_KEY =
  "asa_conversations_v2";

const ACTIVE_KEY =
  "asa_active_conversation_v2";


/* =====================================================
   STATE
===================================================== */

let conversationId =
  getActiveConversationId();

let messages = [];

let contextConversationId = null;

let selectedFiles = [];

let isVoiceMode = false;

let isListening = false;

let isSpeaking = false;

let recognition = null;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const menuButton =
  document.getElementById("menuButton");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const closeMenu =
  document.getElementById("closeMenu");

const chatList =
  document.getElementById("chatList");

const contextMenu =
  document.getElementById("contextMenu");

const renameModal =
  document.getElementById("renameModal");

const renameInput =
  document.getElementById("renameInput");

const deleteModal =
  document.getElementById("deleteModal");

const plusButton =
  document.getElementById("plusButton");

const sheetOverlay =
  document.getElementById("sheetOverlay");

const fileInput =
  document.getElementById("fileInput");

const photoInput =
  document.getElementById("photoInput");

const cameraInput =
  document.getElementById("cameraInput");

const voiceButton =
  document.getElementById("voiceButton");

const voiceMode =
  document.getElementById("voiceMode");

const voiceClose =
  document.getElementById("voiceClose");

const voiceControl =
  document.getElementById("voiceControl");

const voiceStatus =
  document.getElementById("voiceStatus");


/* =====================================================
   STORAGE
===================================================== */

function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function createConversationId() {

  const id =
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2, 9);

  setActiveConversationId(id);

  return id;

}


function getActiveConversationId() {

  const saved =
    localStorage.getItem(
      ACTIVE_KEY
    );

  if (saved) {

    return saved;

  }

  return createConversationId();

}


function setActiveConversationId(id) {

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

}


/* =====================================================
   CONVERSATION METADATA
===================================================== */

function generateTitle(text) {

  let title =
    String(text || "")
      .replace(/\s+/g, " ")
      .trim();

  if (!title) {

    return "Yeni Sohbet";

  }

  title =
    title
      .replace(/[?!.]+$/g, "")
      .trim();

  if (title.length > 42) {

    title =
      title.substring(0, 42)
      .trim() + "…";

  }

  return (
    title.charAt(0).toUpperCase() +
    title.slice(1)
  );

}


function ensureConversation(
  firstMessage = ""
) {

  const conversations =
    loadConversations();

  let item =
    conversations.find(
      x =>
        x.id ===
        conversationId
    );

  if (!item) {

    item = {

      id:
        conversationId,

      title:
        firstMessage
          ? generateTitle(firstMessage)
          : "Yeni Sohbet",

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };

    conversations.unshift(item);

  }


  if (
    firstMessage &&
    item.title === "Yeni Sohbet"
  ) {

    item.title =
      generateTitle(firstMessage);

  }


  item.updatedAt =
    Date.now();

  saveConversations(
    conversations
  );

  return item;

}


/* =====================================================
   MENU
===================================================== */

function openMenu() {

  sidebar.classList.add("open");

  overlay.classList.add("open");

  renderChatList();

}


function closeSidebar() {

  sidebar.classList.remove("open");

  overlay.classList.remove("open");

  closeContextMenu();

}


menuButton.addEventListener(
  "click",
  openMenu
);

closeMenu.addEventListener(
  "click",
  closeSidebar
);

overlay.addEventListener(
  "click",
  closeSidebar
);


/* =====================================================
   CHAT LIST
===================================================== */

function renderChatList() {

  const conversations =
    loadConversations()
      .sort(
        (a, b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

  chatList.innerHTML = "";


  if (!conversations.length) {

    chatList.innerHTML = `
      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>
    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );

      const key =
        date.toDateString();

      if (!groups[key]) {

        groups[key] = [];

      }

      groups[key].push(item);

    }
  );


  Object.entries(groups)
    .forEach(
      ([key, items]) => {

        const group =
          document.createElement(
            "div"
          );

        group.className =
          "historyGroup";


        const dateTitle =
          document.createElement(
            "div"
          );

        dateTitle.className =
          "historyDate";

        dateTitle.textContent =
          getDateLabel(key);

        group.appendChild(
          dateTitle
        );


        items.forEach(
          item => {

            const element =
              document.createElement(
                "div"
              );

            element.className =
              "historyItem" +
              (
                item.id ===
                conversationId
                  ? " active"
                  : ""
              );


            const title =
              document.createElement(
                "div"
              );

            title.className =
              "historyTitle";

            title.textContent =
              item.title;


            const time =
              document.createElement(
                "div"
              );

            time.className =
              "historyTime";

            time.textContent =
              formatTime(
                item.updatedAt
              );


            const more =
              document.createElement(
                "button"
              );

            more.className =
              "historyMore";

            more.type =
              "button";

            more.textContent =
              "•••";


            element.appendChild(
              title
            );

            element.appendChild(
              time
            );

            element.appendChild(
              more
            );


            element.addEventListener(
              "click",
              event => {

                if (
                  event.target.closest(
                    ".historyMore"
                  )
                ) {

                  return;

                }

                openConversation(
                  item.id
                );

              }
            );


            more.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              element
            );

          }
        );


        chatList.appendChild(
          group
        );

      }
    );

}


/* =====================================================
   DATE
===================================================== */

function getDateLabel(
  dateString
) {

  const today =
    new Date();

  const date =
    new Date(dateString);

  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    today.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long"
      }
    )
    .toUpperCase();

}


function formatTime(
  timestamp
) {

  if (!timestamp) {

    return "";

  }

  return new Date(
    timestamp
  ).toLocaleTimeString(
    "tr-TR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
  id,
  element
) {

  contextConversationId =
    id;

  const rect =
    element.getBoundingClientRect();


  contextMenu.style.left =
    Math.max(
      10,
      rect.left - 175
    ) + "px";


  contextMenu.style.top =
    Math.min(
      window.innerHeight - 120,
      rect.bottom + 6
    ) + "px";


  contextMenu.classList.add(
    "open"
  );

}


function closeContextMenu() {

  contextMenu.classList.remove(
    "open"
  );

  contextConversationId =
    null;

}


document.addEventListener(
  "click",
  event => {

    if (
      !contextMenu.contains(
        event.target
      ) &&
      !event.target.closest(
        ".historyMore"
      )
    ) {

      closeContextMenu();

    }

  }
);


/* =====================================================
   RENAME
===================================================== */

document
  .getElementById("renameButton")
  .addEventListener(
    "click",
    () => {

      const conversations =
        loadConversations();

      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );

      if (!item) {

        return;

      }


      renameInput.value =
        item.title;

      renameModal.classList.add(
        "open"
      );

      closeContextMenu();


      setTimeout(
        () => {

          renameInput.focus();

          renameInput.select();

        },
        100
      );

    }
  );


document
  .getElementById("renameCancel")
  .addEventListener(
    "click",
    () => {

      renameModal.classList.remove(
        "open"
      );

    }
  );


document
  .getElementById("renameSave")
  .addEventListener(
    "click",
    () => {

      const title =
        renameInput.value.trim();

      if (!title) {

        return;

      }


      const conversations =
        loadConversations();

      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );


      if (item) {

        item.title =
          title;

        item.updatedAt =
          Date.now();

        saveConversations(
          conversations
        );

      }


      renameModal.classList.remove(
        "open"
      );

      renderChatList();

    }
  );


/* =====================================================
   DELETE
===================================================== */

document
  .getElementById("deleteButton")
  .addEventListener(
    "click",
    () => {

      const conversations =
        loadConversations();

      const item =
        conversations.find(
          x =>
            x.id ===
            contextConversationId
        );


      if (!item) {

        return;

      }


      document
        .getElementById(
          "deleteText"
        )
        .textContent =
        `"${item.title}" sohbeti silinecek.`;


      deleteModal.classList.add(
        "open"
      );

      closeContextMenu();

    }

/* =====================================================

===================================================== */

async function openConversation(
  id
) {

  conversationId =
    id;

  setActiveConversationId(
    id
  );

  closeSidebar();

  chat.innerHTML = "";

  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              conversationId: id,
              getHistory: true
            })

        }
      );


    const data =
      await response.json();

    removeTyping();


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

      renderMessages();

    } else {

      showEmpty();

    }


  } catch {

    removeTyping();

    showEmpty();

  }


  renderChatList();

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(
  overrideText = null,
  voiceReply = false
) {

  const text =
    overrideText !== null
      ? overrideText.trim()
      : input.value.trim();


  if (
    !text &&
    selectedFiles.length === 0
  ) {

    return;

  }


  input.value = "";

  sendButton.disabled = true;


  const attachments =
    await prepareAttachments();


  ensureConversation(
    text ||
    (
      attachments[0]?.name ||
      "Dosya"
    )
  );


  const userMessage = {

    role: "user",

    content: text,

    attachments

  };


  messages.push(
    userMessage
  );


  renderMessages();

  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId,

              messages: [
                {
                  role: "user",

                  content:
                    buildApiContent(
                      text,
                      attachments
                    )
                }
              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    const answer =
      data.answer ||
      "Şu anda cevap oluşturamadım.";


    messages.push({

      role: "assistant",

      content: answer

    });


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    }


    selectedFiles = [];

    ensureConversation();

    renderMessages();

    renderChatList();


    if (
      voiceReply
    ) {

      speakText(
        answer
      );

    }


  } catch (error) {

    removeTyping();


    messages.push({

      role: "assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    renderMessages();

    console.error(
      "ASA:",
      error
    );

  }


  sendButton.disabled = false;

  input.focus();

}


/* =====================================================
   API CONTENT
===================================================== */

function buildApiContent(
  text,
  attachments
) {

  if (!attachments.length) {

    return text;

  }


  const names =
    attachments
      .map(
        file =>
          `Dosya: ${file.name}`
      )
      .join("\n");


  return (
    text
      ? `${text}\n\n${names}`
      : names
  );

}

/* =====================================================
   FILE -> DATA URL
===================================================== */

function fileToDataURL(
  file
) {

  return new Promise(
    resolve => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        () => resolve(
          null
        );

      reader.readAsDataURL(
        file
      );

    }
  );

}


async function prepareAttachments() {

  const result = [];


  for (
    const file of selectedFiles
  ) {

    const dataUrl =
      await fileToDataURL(
        file
      );


    result.push({

      name:
        file.name,

      type:
        file.type,

      size:
        file.size,

      dataUrl

    });

  }


  return result;

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message " +
        (
          message.role ===
          "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        bubble.innerHTML = `

          <span class="assistantLabel">
            ASA
          </span>

          <div class="assistantText">
            ${formatAnswer(
              message.content
            )}
          </div>

        `;

      } else {

        if (
          Array.isArray(
            message.attachments
          )
        ) {

          message.attachments
            .forEach(
              attachment => {

                if (
                  attachment.dataUrl &&
                  attachment.type &&
                  attachment.type.startsWith(
                    "image/"
                  )
                ) {

                  const image =
                    document.createElement(
                      "img"
                    );

                  image.className =
                    "messageImage";

                  image.src =
                    attachment.dataUrl;

                  image.alt =
                    attachment.name ||
                    "Görsel";

                  bubble.appendChild(
                    image
                  );

                }

              }
            );

        }


        if (
          message.content
        ) {

          const text =
            document.createElement(
              "div"
            );

          text.textContent =
            message.content;

          bubble.appendChild(
            text
          );

        }

      }


      row.appendChild(
        bubble
      );

      chat.appendChild(
        row
      );

    }
  );


  scrollToBottom();

}


/* =====================================================
   ANSWER FORMAT
===================================================== */

function escapeHtml(
  text
) {

  return String(
    text || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function formatAnswer(
  text
) {

  let result =
    escapeHtml(
      text
    );


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}

/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function getSpeechRecognition() {

  return (
    window.SpeechRecognition ||
    window.webkitSpeechRecognition ||
    null
  );

}


function toggleVoiceListening() {

  if (
    isListening
  ) {

    stopRecognition();

    return;

  }


  startRecognition();

}


function startRecognition() {

  const SpeechRecognition =
    getSpeechRecognition();


  if (!SpeechRecognition) {

    updateVoiceStatus(
      "<strong>Bu tarayıcı sesli girişi desteklemiyor.</strong>"
    );

    return;

  }


  if (
    isSpeaking
  ) {

    speechSynthesis.cancel();

    isSpeaking = false;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "tr-TR";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    () => {

      isListening = true;

      voiceMode.classList.add(
        "listening"
      );

      updateVoiceStatus(
        "Dinliyorum..."
      );

    };


  recognition.onresult =
    event => {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();


      if (!text) {

        return;

      }


      stopRecognition();

      updateVoiceStatus(
        "ASA düşünüyor..."
      );


      sendMessage(
        text,
        true
      );

    };


  recognition.onerror =
    error => {

      console.warn(
        "Voice recognition:",
        error
      );

      isListening = false;

      voiceMode.classList.remove(
        "listening"
      );

      updateVoiceStatus(
        "Tekrar deneyelim"
      );

    };


  recognition.onend =
    () => {

      isListening = false;

      voiceMode.classList.remove(
        "listening"
      );

    };


  try {

    recognition.start();

  } catch {

    isListening = false;

  }

}


function stopRecognition() {

  if (
    recognition
  ) {

    try {

      recognition.stop();

    } catch {}

  }


  recognition =
    null;

  isListening = false;

  voiceMode.classList.remove(
    "listening"
  );

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(
  text
) {

  if (
    !("speechSynthesis" in window)
  ) {

    updateVoiceStatus(
      "ASA cevap verdi."
    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "tr-TR";

  utterance.rate =
    0.96;

  utterance.pitch =
    1.0;

  utterance.volume =
    1;


  const voices =
    speechSynthesis
      .getVoices();


  const turkishVoice =
    voices.find(
      voice =>
        voice.lang
          ?.toLowerCase()
          .startsWith(
            "tr"
          )
    );


  if (
    turkishVoice
  ) {

    utterance.voice =
      turkishVoice;

  }


  utterance.onstart =
    () => {

      isSpeaking = true;

      voiceMode.classList.add(
        "speaking"
      );

      updateVoiceStatus(
        "ASA konuşuyor..."
      );

    };


  utterance.onend =
    () => {

      isSpeaking = false;

      voiceMode.classList.remove(
        "speaking"
      );

      updateVoiceStatus(
        "Dinliyorum..."
      );

    };


  utterance.onerror =
    () => {

      isSpeaking = false;

      voiceMode.classList.remove(
        "speaking"
      );

      updateVoiceStatus(
        "Hazırım"
      );

    };


  speechSynthesis.speak(
    utterance
  );

}

async function loadActiveConversation() {

  const id =
    getActiveConversationId();


  conversationId =
    id;


  const conversations =
    loadConversations();


  const exists =
    conversations.some(
      x =>
        x.id === id
    );

    showEmpty();

    return;

  }


  await openConversation(
    id
  );

}
