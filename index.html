<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>ASA</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #05040a;
  --panel: #0d0c16;
  --panel2: #12111d;
  --text: #f5f5fa;
  --muted: #858394;
  --purple: #a33cff;
  --purple2: #c447ff;
  --border: rgba(255,255,255,.09);
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}

/* =====================================================
   APP
===================================================== */

.app {
  width: 100%;
  height: 100dvh;
  position: relative;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 5%,
      rgba(130,30,200,.18),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 70%,
      rgba(80,0,150,.12),
      transparent 35%
    ),
    #05040a;
}

/* =====================================================
   HEADER
===================================================== */

.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;

  height: 96px;

  padding:
    14px
    14px;

  display: flex;
  align-items: center;
  gap: 10px;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.99),
      rgba(5,4,10,.90)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

  z-index: 30;
}

.headerButton,
.logo {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border-radius: 18px;
}

.headerButton {
  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.08);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;

  cursor: pointer;
}

.headerButton:active {
  transform: scale(.93);
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8f30ff,
      #c43cff
    );

  box-shadow:
    0 0 30px
    rgba(160,50,255,.30);

  font-size: 30px;
  font-weight: 800;
}

.brand {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 6px;
}

.headerSpacer {
  flex: 1;
}

.headerActions {
  display: flex;
  gap: 6px;
}

/* =====================================================
   CHAT
===================================================== */

.chat {
  position: absolute;

  top: 96px;
  left: 0;
  right: 0;
  bottom: 92px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    32px
    18px
    30px;

  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 3px;
}

.chat::-webkit-scrollbar-thumb {
  background:
    rgba(180,60,255,.30);
  border-radius: 10px;
}

/* =====================================================
   MESSAGE
===================================================== */

.message {
  display: flex;
  width: 100%;
  margin-bottom: 22px;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}

/* USER */

.userBubble {
  max-width: 88%;

  padding:
    13px
    17px;

  border-radius: 21px;
  border-bottom-right-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #8736e9,
      #bd3bd6
    );

  box-shadow:
    0 10px 30px
    rgba(130,45,255,.13);

  font-size: 17px;
  line-height: 1.5;

  white-space: pre-wrap;
  word-break: break-word;
}

/* ASSISTANT */

.assistantBubble {
  max-width: 94%;

  background: transparent;

  font-size: 18px;
  line-height: 1.62;

  word-break: break-word;
}

.assistantLabel {
  display: block;

  margin-bottom: 7px;

  color: #b53cff;

  font-size: 12px;
  font-weight: 800;

  letter-spacing: 5px;
}

.assistantText {
  color: #f1eff6;
}

/* =====================================================
   IMAGE MESSAGE
===================================================== */

.messageImage {
  display: block;

  max-width: 260px;
  max-height: 330px;

  border-radius: 18px;

  object-fit: cover;

  margin-bottom: 8px;

  border:
    1px solid
    rgba(255,255,255,.12);
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyLogo {
  width: 86px;
  height: 86px;

  border-radius: 27px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8f30ff,
      #c33cff
    );

  box-shadow:
    0 0 65px
    rgba(160,45,255,.27);

  font-size: 48px;
  font-weight: 800;

  margin-bottom: 22px;
}

.empty h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.empty p {
  color: var(--muted);
  font-size: 16px;
}

/* =====================================================
   INPUT
===================================================== */

.inputArea {
  position: absolute;

  left: 12px;
  right: 12px;

  bottom:
    calc(
      11px +
      env(safe-area-inset-bottom)
    );

  z-index: 35;

  transition:
    bottom .12s ease;
}

.inputBox {
  min-height: 64px;

  display: flex;
  align-items: center;

  padding: 6px;

  border-radius: 23px;

  background:
    rgba(15,14,25,.97);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 14px 45px
    rgba(0,0,0,.42);
}

/* PLUS */

.plusButton {
  width: 48px;
  height: 48px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 16px;

  background: transparent;

  color: #d5d2dc;

  font-size: 29px;
  font-weight: 300;

  cursor: pointer;
}

.plusButton:active {
  transform: scale(.90);
}

/* INPUT */

.input {
  flex: 1;
  min-width: 0;

  height: 48px;

  background: transparent;
  border: 0;
  outline: 0;

  color: white;

  padding:
    0 9px;

  font-size: 17px;
}

.input::placeholder {
  color: #74717f;
}

/* RIGHT */

.inputActions {
  display: flex;
  align-items: center;
  gap: 1px;
}

.voiceButton,
.sendButton {
  width: 43px;
  height: 43px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background: transparent;

  cursor: pointer;
}

.voiceButton {
  color: #d6d3dc;
}

.sendButton {
  color: #b53cff;
}

.voiceButton:active,
.sendButton:active {
  transform: scale(.87);
}

.sendButton:disabled {
  opacity: .25;
}

.voiceButton svg {
  width: 21px;
  height: 21px;
}

.sendButton svg {
  width: 22px;
  height: 22px;
}

/* =====================================================
   ATTACH MENU
===================================================== */

.attachMenu {
  position: absolute;

  left: 4px;
  bottom: 73px;

  width: 180px;

  padding: 7px;

  border-radius: 19px;

  background:
    rgba(20,18,31,.98);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

  opacity: 0;

  transform:
    translateY(8px)
    scale(.96);

  pointer-events: none;

  transition: .18s;

  z-index: 50;
}

.attachMenu.open {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.attachItem {
  width: 100%;

  padding:
    12px;

  display: flex;
  align-items: center;

  gap: 12px;

  border-radius: 13px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 15px;
}

.attachItem:active {
  background:
    rgba(255,255,255,.06);
}

.attachIcon {
  width: 30px;
  text-align: center;
  font-size: 20px;
}

.hiddenFile {
  display: none;
}

/* =====================================================
   IMAGE PREVIEW
===================================================== */

.attachmentPreview {
  position: absolute;

  left: 4px;
  bottom: 73px;

  width: 78px;
  height: 78px;

  border-radius: 17px;

  overflow: hidden;

  display: none;

  background: #11101b;

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.50);

  z-index: 45;
}

.attachmentPreview.show {
  display: block;
}

.attachmentPreview img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.attachmentRemove {
  position: absolute;

  top: 5px;
  right: 5px;

  width: 24px;
  height: 24px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,.70);

  color: white;

  cursor: pointer;
}

/* =====================================================
   TYPING
===================================================== */

.typing {
  display: flex;
  gap: 5px;

  padding-top: 5px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #b43cff;

  animation:
    typing 1.05s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .14s;
}

.typing span:nth-child(3) {
  animation-delay: .28s;
}

@keyframes typing {

  0%,60%,100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* =====================================================
   OVERLAY
===================================================== */

.overlay {
  position: fixed;
  inset: 0;

  z-index: 50;

  background:
    rgba(0,0,0,.60);

  backdrop-filter:
    blur(8px);

  opacity: 0;
  pointer-events: none;

  transition: .22s;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  width:
    min(540px,90vw);

  z-index: 60;

  padding: 22px;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      180deg,
      #0e0d19,
      #080710
    );

  border-right:
    1px solid
    rgba(255,255,255,.09);

  transform:
    translateX(-105%);

  transition:
    transform .30s
    cubic-bezier(.22,.8,.25,1);
}

.sidebar.open {
  transform:
    translateX(0);
}

/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebarHeader {
  display: flex;
  align-items: center;
  gap: 14px;

  flex-shrink: 0;

  margin-bottom: 30px;
}

.sidebarLogo {
  width: 57px;
  height: 57px;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #9130ff,
      #c33cff
    );

  font-size: 30px;
  font-weight: 800;
}

.sidebarBrand {
  flex: 1;

  font-size: 24px;
  font-weight: 800;

  letter-spacing: 7px;
}

.closeButton {
  width: 52px;
  height: 52px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.05);

  font-size: 30px;

  cursor: pointer;
}

/* =====================================================
   SIDEBAR ITEMS
===================================================== */

.menuSectionTitle {
  flex-shrink: 0;

  margin-bottom: 8px;

  color: #817e8f;

  font-size: 11px;
  font-weight: 800;

  letter-spacing: 4px;
}

.menuItem {
  width: 100%;
  min-height: 62px;

  flex-shrink: 0;

  display: flex;
  align-items: center;

  gap: 17px;

  padding:
    8px 13px;

  border-radius: 18px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 18px;
  font-weight: 600;
}

.menuItem:active,
.menuItem.active {
  background:
    rgba(255,255,255,.065);
}

.menuIcon {
  width: 40px;

  text-align: center;

  font-size: 25px;
}

.menuDivider {
  height: 1px;

  flex-shrink: 0;

  background:
    rgba(255,255,255,.07);

  margin:
    17px 0;
}

/* =====================================================
   HISTORY PANEL
===================================================== */

.historyPanel {
  position: absolute;

  top: 106px;
  left: 14px;
  right: 14px;
  bottom: 14px;

  z-index: 80;

  padding: 17px;

  display: flex;
  flex-direction: column;

  border-radius: 24px;

  background:
    rgba(14,13,24,.99);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.55);

  opacity: 0;

  transform:
    translateY(10px)
    scale(.98);

  pointer-events: none;

  transition: .20s;
}

.historyPanel.open {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.historyHeader {
  display: flex;
  align-items: center;

  margin-bottom: 12px;
}

.historyTitle {
  flex: 1;

  font-size: 20px;
  font-weight: 750;
}

.historyClose {
  width: 39px;
  height: 39px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.05);

  font-size: 21px;

  cursor: pointer;
}

.chatList {
  flex: 1;
  min-height: 0;

  overflow-y: auto;

  padding-right: 2px;
}

.chatList::-webkit-scrollbar {
  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {
  background:
    rgba(180,60,255,.30);
}

/* =====================================================
   HISTORY ITEMS
===================================================== */

.historyGroup {
  margin-bottom: 17px;
}

.historyDate {
  margin:
    11px
    6px
    7px;

  color: #747184;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: 3px;
}

.historyItem {
  position: relative;

  width: 100%;

  min-height: 65px;

  margin-bottom: 7px;

  padding:
    12px
    49px
    12px
    14px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.06);

  cursor: pointer;
}

.historyItem.active {
  background:
    rgba(165,55,255,.13);

  border-color:
    rgba(170,55,255,.30);
}

.historyTitleText {
  font-size: 15px;
  font-weight: 650;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.historyTime {
  margin-top: 4px;

  color: #716e7d;

  font-size: 11px;
}

.historyMore {
  position: absolute;

  right: 7px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 36px;
  height: 36px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.045);

  color: #aaa7b5;

  cursor: pointer;
}

.noHistory {
  padding: 35px 10px;

  color: #686577;

  text-align: center;

  font-size: 14px;
}

/* =====================================================
   CONTEXT
===================================================== */

.contextMenu {
  position: fixed;

  z-index: 150;

  width: 205px;

  padding: 7px;

  border-radius: 17px;

  background:
    #151421;

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {
  width: 100%;

  padding:
    12px 14px;

  border-radius: 12px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 14px;
}

.contextItem:active {
  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {
  color: #ff687c;
}

/* =====================================================
   MODAL
===================================================== */

.modalOverlay {
  position: fixed;
  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 22px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(10px);
}

.modalOverlay.open {
  display: flex;
}

.modal {
  width: min(480px,100%);

  padding: 26px;

  border-radius: 26px;

  background:
    #12111d;

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.60);
}

.modal h2 {
  margin-bottom: 18px;

  font-size: 23px;
}

.modalInput {
  width: 100%;

  padding: 16px;

  border-radius: 16px;

  background:
    #090811;

  border:
    1px solid
    rgba(255,255,255,.10);

  color: white;

  outline: 0;

  font-size: 16px;
}

.modalButtons {
  display: flex;
  gap: 9px;

  margin-top: 19px;
}

.modalButton {
  flex: 1;

  padding: 14px;

  border-radius: 15px;

  background:
    rgba(255,255,255,.06);

  cursor: pointer;
}

.modalButton.primary {
  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}

.modalButton.danger {
  background:
    #a92843;
}

/* =====================================================
   DESKTOP
===================================================== */

@media (min-width:601px) {

  .header {
    height: 118px;

    padding:
      20px 22px;

    gap: 15px;
  }

  .headerButton,
  .logo {
    width: 64px;
    height: 64px;
  }

  .brand {
    font-size: 31px;
  }

  .chat {
    top: 118px;
    bottom: 100px;

    padding:
      45px
      25px
      35px;
  }

  .userBubble {
    font-size: 19px;
  }

  .assistantBubble {
    font-size: 20px;
  }

  .inputArea {
    left: 20px;
    right: 20px;
    bottom: 18px;
  }

  .inputBox {
    min-height: 70px;
  }
}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <button
    class="headerButton"
    id="menuButton"
  >
    ☰
  </button>

  <div class="logo">
    A
  </div>

  <div class="brand">
    ASA
  </div>

  <div class="headerSpacer"></div>

  <div class="headerActions">

    <button
      class="headerButton"
      id="memoryButton"
    >
      🧠
    </button>

    <button
      class="headerButton"
      id="settingsButton"
    >
      ⚙️
    </button>

  </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<main
  class="chat"
  id="chat"
></main>


<!-- =====================================================
     INPUT
===================================================== -->

<div
  class="inputArea"
  id="inputArea"
>

  <!-- IMAGE PREVIEW -->

  <div
    class="attachmentPreview"
    id="attachmentPreview"
  >

    <img
      id="attachmentPreviewImage"
      alt="Seçilen görsel"
    >

    <button
      class="attachmentRemove"
      id="attachmentRemove"
      type="button"
    >
      ×
    </button>

  </div>


  <!-- ATTACH MENU -->

  <div
    class="attachMenu"
    id="attachMenu"
  >

    <button
      class="attachItem"
      id="fileButton"
      type="button"
    >

      <span class="attachIcon">
        📎
      </span>

      <span>
        Fotoğraf / Dosya
      </span>

    </button>

    <button
      class="attachItem"
      id="cameraButton"
      type="button"
    >

      <span class="attachIcon">
        📷
      </span>

      <span>
        Kamera
      </span>

    </button>

  </div>


  <div class="inputBox">

    <button
      class="plusButton"
      id="plusButton"
      type="button"
    >
      +
    </button>


    <input
      class="input"
      id="messageInput"
      type="text"
      autocomplete="off"
      placeholder="ASA'ya bir şey sor..."
    >


    <div class="inputActions">

      <button
        class="voiceButton"
        id="voiceButton"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <rect
            x="9"
            y="3"
            width="6"
            height="12"
            rx="3"
          ></rect>

          <path
            d="M5 11a7 7 0 0 0 14 0"
          ></path>

          <path
            d="M12 18v3"
          ></path>

          <path
            d="M8 21h8"
          ></path>

        </svg>

      </button>


      <button
        class="sendButton"
        id="sendButton"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path
            d="M4 12h15"
          ></path>

          <path
            d="m13 5 7 7-7 7"
          ></path>

        </svg>

      </button>

    </div>

  </div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/chat";

const STORAGE_KEY =
  "asa_conversations_luna_v1";

const ACTIVE_KEY =
  "asa_active_luna_v1";


/* =====================================================
   STATE
===================================================== */

let conversationId =
  localStorage.getItem(
    ACTIVE_KEY
  );

let messages = [];

let selectedConversationId =
  null;

let selectedImage = null;

let selectedImageData = null;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const historyPanel =
  document.getElementById(
    "historyPanel"
  );

const chatList =
  document.getElementById(
    "chatList"
  );

const contextMenu =
  document.getElementById(
    "contextMenu"
  );

const attachMenu =
  document.getElementById(
    "attachMenu"
  );

const inputArea =
  document.getElementById(
    "inputArea"
  );

const attachmentPreview =
  document.getElementById(
    "attachmentPreview"
  );

const attachmentPreviewImage =
  document.getElementById(
    "attachmentPreviewImage"
  );


/* =====================================================
   LOCAL STORAGE
===================================================== */

function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(
  conversations
) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      conversations
    )
  );

}


function getConversation(id) {

  return loadConversations()
    .find(
      item =>
        item.id === id
    );

}


function setActive(id) {

  conversationId =
    id;

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

}


/* =====================================================
   CREATE CONVERSATION
===================================================== */

function createId() {

  return (
    "chat-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function createConversation(
  title = "Yeni Sohbet"
) {

  const conversation = {

    id:
      createId(),

    title,

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages: []

  };


  const conversations =
    loadConversations();


  conversations.unshift(
    conversation
  );


  saveConversations(
    conversations
  );


  return conversation;

}


function createNewConversation() {

  const conversation =
    createConversation();


  setActive(
    conversation.id
  );


  messages = [];


  clearAttachment();

  showEmpty();

  renderChatList();

  closeHistory();

  closeSidebar();

  input.focus();

}


/* =====================================================
   TITLE
===================================================== */

function generateTitle(
  text
) {

  let title =
    String(text)
      .replace(/\s+/g," ")
      .trim();


  if (!title) {
    return "Yeni Sohbet";
  }


  title =
    title
      .replace(/[?!.]+$/g,"")
      .trim();


  if (title.length > 42) {

    title =
      title.slice(0,42)
        .trim() +
      "…";

  }


  return (
    title.charAt(0).toUpperCase() +
    title.slice(1)
  );

}


/* =====================================================
   SAVE CURRENT
===================================================== */

function saveCurrentConversation() {

  if (!conversationId) {
    return;
  }


  const conversations =
    loadConversations();


  const item =
    conversations.find(
      x =>
        x.id === conversationId
    );


  if (!item) {
    return;
  }


  item.messages =
    messages;

  item.updatedAt =
    Date.now();


  saveConversations(
    conversations
  );

}


/* =====================================================
   MENU
===================================================== */

function openSidebar() {

    "open"
  );

  overlay.classList.add(
    "open"
  );

}


function closeSidebar() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(

  );

  closeHistory();

  closeContextMenu();

}

  "click",

);

   HISTORY
===================================================== */

function openHistory() {

  historyPanel.classList.add(

  );

      "showChatsButton"
    )

    );

}


function closeHistory() {

    "open"
  );

  document
    .getElementById(
      "showChatsButton"
    )
    .classList.remove(
      "active"
    );

}


document
  .getElementById(
    "showChatsButton"
  )
  .addEventListener(
    "click",
    openHistory
  );


document
  .getElementById(
    "historyClose"
  )
  .addEventListener(
    "click",
    closeHistory
  );


/* =====================================================
   HISTORY LIST
===================================================== */

function renderChatList() {

  const conversations =
    loadConversations()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


  chatList.innerHTML = "";


  if (!conversations.length) {

    chatList.innerHTML = `
      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>
    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );


      const key =
        date.toDateString();


      if (!groups[key]) {
        groups[key] = [];
      }


      groups[key].push(
        item
      );

    }
  );


  Object.entries(groups)
    .forEach(
      ([key,items]) => {

        const group =
          document.createElement(
            "div"
          );

        group.className =
          "historyGroup";


        const date =
          document.createElement(
            "div"
          );

        date.className =
          "historyDate";

        date.textContent =
          dateLabel(key);


        group.appendChild(
          date
        );


        items.forEach(
          item => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "historyItem";


            if (
              item.id ===
              conversationId
            ) {

              row.classList.add(
                "active"
              );

            }


            const title =
              document.createElement(
                "div"
              );


            title.className =
              "historyTitleText";


            title.textContent =
              item.title ||
              "Yeni Sohbet";


            const time =
              document.createElement(
                "div"
              );


            time.className =
              "historyTime";


            time.textContent =
              formatTime(
                item.updatedAt
              );


            const more =
              document.createElement(
                "button"
              );


            more.className =
              "historyMore";

            more.type =
              "button";

            more.textContent =
              "•••";


            row.appendChild(
              title
            );

            row.appendChild(
              time
            );

            row.appendChild(
              more
            );


            row.addEventListener(
              "click",
              () => {

                openConversation(
                  item.id
                );

              }
            );


            more.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              row
            );

          }
        );


        chatList.appendChild(
          group
        );

      }
    );

}


function dateLabel(
  dateString
) {

  const date =
    new Date(dateString);

  const today =
    new Date();

  const yesterday =
    new Date();


  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    today.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long"
      }
    )
    .toUpperCase();

}


function formatTime(
  timestamp
) {

  if (!timestamp) {
    return "";
  }


  return new Date(
    timestamp
  )
    .toLocaleTimeString(
      "tr-TR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
  id
) {

  const local =
    getConversation(id);


  if (!local) {
    return;
  }


  setActive(id);


  messages =
    Array.isArray(
      local.messages
    )
      ? local.messages
      : [];


  closeHistory();

  closeSidebar();

  closeContextMenu();


  renderMessages();


  /*
    Redis'teki gerçek geçmişi çek.
  */

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "getHistory",

              conversationId:
                id

            })
        }
      );


    const data =
      await response.json();


    if (
      response.ok &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;


      saveCurrentConversation();

      renderMessages();

    }

  } catch(error) {

    console.error(
      "Geçmiş alınamadı:",
      error
    );

  }

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImageData
  ) {
    return;
  }


  /*
    Sohbet yoksa oluştur.
  */

  if (!conversationId) {

    const conversation =
      createConversation();

    setActive(
      conversation.id
    );

  }


  let conversation =
    getConversation(
      conversationId
    );


  if (!conversation) {

    conversation =
      createConversation();


    setActive(
      conversation.id
    );

  }


  /*
    İlk mesaj başlığı
  */

  if (
    conversation.title ===
    "Yeni Sohbet"
  ) {

    conversation.title =
      generateTitle(
        text ||
        "Görsel sohbet"
      );

  }


  /*
    UI mesajı
  */

  const userMessage = {
    role: "user",
    content: text || ""
  };


  /*
    Görsel varsa
    API'ye multimodal içerik gönder.
  */

  if (selectedImageData) {

    userMessage.content = [

      {
        type:
          "input_text",

        text:
          text ||
          "Bu görseli incele."
      },

      {
        type:
          "input_image",

        image_url:
          selectedImageData
      }

    ];

  }


  messages.push(
    userMessage
  );


  saveCurrentConversation();

  renderMessages();

  renderChatList();


  /*
    UI temizle
  */

  input.value = "";

  sendButton.disabled =
    true;


  const imageToSend =
    selectedImageData;


  clearAttachment();


  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "chat",

              conversationId,

              messages: [
                userMessage
              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    /*
      API'nin kaydettiği
      gerçek geçmişi kullan.
    */

    if (
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    } else {

      messages.push({

        role:
          "assistant",

        content:
          data.answer || ""

      });

    }


    saveCurrentConversation();

    renderMessages();

    renderChatList();


  } catch(error) {

    removeTyping();


    console.error(
      "ASA:",
      error
    );


    messages.push({

      role:
        "assistant",

      content:
        "Bağlantıda bir sorun oluştu. Birazdan tekrar deneyelim."

    });


    saveCurrentConversation();

    renderMessages();

  }


  sendButton.disabled =
    false;


  input.focus();

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollBottom();

}


function renderMessage(
  message
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message " +
    (
      message.role === "user"
        ? "user"
        : "assistant"
    );


  /*
    USER
  */

  if (
    message.role === "user"
  ) {

    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "userBubble";


    /*
      Multimodal
    */

    if (
      Array.isArray(
        message.content
      )
    ) {

      message.content.forEach(
        part => {

          if (
            part.type ===
            "input_image" &&
            part.image_url
          ) {

            const image =
              document.createElement(
                "img"
              );


            image.className =
              "messageImage";


            image.src =
              part.image_url;


            image.alt =
              "Gönderilen görsel";


            bubble.appendChild(
              image
            );

          }


          if (
            part.type ===
            "input_text"
          ) {

            const text =
              document.createElement(
                "div"
              );


            text.textContent =
              part.text || "";


            bubble.appendChild(
              text
            );

          }

        }
      );

    } else {

      bubble.textContent =
        message.content || "";

    }


    row.appendChild(
      bubble
    );


    chat.appendChild(
      row
    );


    return;

  }


  /*
    ASSISTANT
  */

  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "assistantBubble";


  const label =
    document.createElement(
      "span"
    );


  label.className =
    "assistantLabel";


  label.textContent =
    "ASA";


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "assistantText";


  text.innerHTML =
    formatAnswer(
      message.content || ""
    );


  bubble.appendChild(
    label
  );


  bubble.appendChild(
    text
  );


  row.appendChild(
    bubble
  );


  chat.appendChild(
    row
  );

}


/* =====================================================
   FORMAT
===================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function formatAnswer(
  text
) {

  let result =
    escapeHtml(
      text
    );


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}

    event => {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      readImage(
        file
      );

    }
  );


/* =====================================================
   READ IMAGE
===================================================== */

function readImage(
  file
) {

  if (
    !file.type.startsWith(
      "image/"
    )
  ) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    event => {

      selectedImage =
        file;

      selectedImageData =
        event.target.result;


      attachmentPreviewImage.src =
        selectedImageData;


      attachmentPreview.classList.add(
        "show"
      );


      attachMenu.classList.remove(
        "open"
      );


      input.placeholder =
        "Görsel hakkında bir şey sor...";


      input.focus();

    };


  reader.readAsDataURL(
    file
  );

}

   CLEAR IMAGE
===================================================== */

    "";


  input.placeholder =

}

/* =====================================================
   VOICE
===================================================== */

document
  .getElementById(
    "voiceButton"
  )
  .addEventListener(
    "click",
    () => {

      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!Recognition) {

        alert(
          "Bu tarayıcı sesli girişi desteklemiyor."
        );

        return;

      }


      const recognition =
        new Recognition();


      recognition.lang =
        "tr-TR";


      recognition.continuous =
        false;


      recognition.interimResults =
        false;


      recognition.onresult =
        event => {

          input.value =
            event
              .results[0][0]
              .transcript;

          input.focus();

        };


      recognition.start();

    }
  );

/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
  id,
  element
) {

  selectedConversationId =
    id;


  const rect =
    element.getBoundingClientRect();


  let left =
    rect.left - 175;


  let top =
    rect.bottom + 5;


  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth - 215
      )
    );


  top =
    Math.min(
      top,
      window.innerHeight - 120
    );


  contextMenu.style.left =
    left + "px";


  contextMenu.style.top =
    top + "px";


  contextMenu.classList.add(
    "open"
  );

}


function closeContextMenu() {

  contextMenu.classList.remove(
    "open"
  );

}


document.addEventListener(
  "click",
  event => {

    if (
      !contextMenu.contains(
        event.target
      ) &&
      !event.target.closest(
        ".historyMore"
      )
    ) {

      closeContextMenu();

    }

  }
);

document
  .getElementById(
    "renameSave"
  )
  .addEventListener(
    "click",
    () => {

        document
          .getElementById(
            "renameInput"
          )
          .value
          .trim();


      if (!title) {
        return;
      }


      const conversations =
        loadConversations();


      const item =
        conversations.find(
          x =>
            x.id ===
            selectedConversationId
        );


      if (item) {

        item.title =
          title;

        item.updatedAt =
          Date.now();

        saveConversations(
          conversations
        );

      }


      document
        .getElementById(
          "renameModal"
        )
        .classList.remove(
          "open"
        );


      renderChatList();

    }
  );

===================================================== */

          "open"
        );

    }
  );


document
  .getElementById(
    "deleteConfirm"
  )
  .addEventListener(
    "click",
    async () => {

      const id =
        selectedConversationId;


      if (!id) {
        return;
      }


      /*
        Önce Redis'ten sil.
      */

      try {

        await fetch(
          API_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                action:
                  "deleteConversation",

                conversationId:
                  id

              })

          }
        );

      } catch(error) {

        console.error(
          error
        );

      }


      /*
        Local'den de sil.
      */

      let conversations =
        loadConversations();


      conversations =
        conversations.filter(
          item =>
            item.id !== id
        );


      saveConversations(
        conversations
      );


      if (
        id === conversationId
      ) {

        conversationId =
          null;

        localStorage.removeItem(
          ACTIVE_KEY
        );

        messages = [];

        createNewConversation();

      }


      selectedConversationId =
        null;


      document
        .getElementById(
          "deleteModal"
        )
        .classList.remove(
          "open"
        );


      renderChatList();

    }
  );

/* =====================================================
   KEYBOARD
===================================================== */

function updateKeyboard() {

  if (
    !window.visualViewport
  ) {
    return;
  }


  const viewport =
    window.visualViewport;


  const keyboard =
    Math.max(
      0,
      window.innerHeight -
      viewport.height -
      viewport.offsetTop
    );


  if (
    keyboard > 100
  ) {

    inputArea.style.bottom =
      (
        keyboard + 7
      ) + "px";

  } else {

    inputArea.style.bottom =
      "calc(11px + env(safe-area-inset-bottom))";

  }

}


if (
  window.visualViewport
) {

  window.visualViewport.addEventListener(
    "resize",
    updateKeyboard
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateKeyboard
  );

}


/* =====================================================
   START
===================================================== */

async function start() {

  let active =
    conversationId
      ? getConversation(
          conversationId
        )
      : null;


  /*
    Eski local sohbetler varsa
    ilkini kullan.
  */

  if (!active) {

    const conversations =
      loadConversations();


    if (
      conversations.length
    ) {

      active =
        conversations[0];

      setActive(
        active.id
      );

    }

  }


  /*
    Hiç sohbet yoksa
    boş yeni sohbet.
  */

  if (!active) {

    showEmpty();

    return;

  }


  messages =
    Array.isArray(
      active.messages
    )
      ? active.messages
      : [];


  renderMessages();

}


start();
