<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<title>ASA</title>

<style>
:root {
  --bg: #05060a;
  --panel: #101118;
  --panel2: #151720;
  --border: rgba(255,255,255,.09);
  --text: #f5f5f7;
  --muted: #8d909c;
  --accent: #a331ff;
  --accent2: #c13cff;
  --danger: #ff536d;
  --radius: 22px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 5%,
      rgba(145,35,230,.17),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #05060a,
      #07080d
    );
}

/* HEADER */

.header {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  right: 0;

  height: calc(92px + env(safe-area-inset-top));

  padding:
    calc(12px + env(safe-area-inset-top))
    16px
    10px;

  display: flex;
  align-items: center;
  gap: 14px;

  background:
    rgba(5,6,10,.94);

  border-bottom:
    1px solid var(--border);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.menuButton {
  width: 54px;
  height: 54px;
  flex-shrink: 0;

  border-radius: 17px;

  background: #151720;
  border: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: center;
}

.menuButton:active {
  transform: scale(.95);
}

.menuLines {
  width: 24px;
  height: 18px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.menuLines span {
  width: 24px;
  height: 2px;
  border-radius: 2px;
  background: #eeeef2;
}

.brand {
  display: flex;
  align-items: center;
}

.brandText {
  font-size: 29px;
  font-weight: 700;
  letter-spacing: .25em;
}

/* CHAT */

.chat {
  position: absolute;

  top: calc(92px + env(safe-area-inset-top));
  bottom: calc(88px + env(safe-area-inset-bottom));

  left: 0;
  right: 0;

  overflow-y: auto;

  padding:
    28px 18px
    150px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 3px;
}

.chat::-webkit-scrollbar-thumb {
  background: rgba(193,60,255,.3);
}

.empty {
  min-height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 30px;
}

.emptyOrb {
  width: 72px;
  height: 72px;

  margin-bottom: 24px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 27%,
      white,
      transparent 10%
    ),
    radial-gradient(
      circle at 52% 52%,
      #d047ff,
      #721db5 60%,
      #190925
    );

  box-shadow:
    0 0 65px rgba(163,48,255,.3);
}

.empty h1 {
  font-size: 27px;
  margin-bottom: 9px;
}

.empty p {
  color: var(--muted);
  font-size: 16px;
}

/* MESSAGE */

.message {
  display: flex;
  width: 100%;
  margin-bottom: 24px;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}

.user .bubble {
  max-width: 88%;

  padding: 14px 17px;

  border-radius:
    22px 22px 7px 22px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color: white;

  font-size: 17px;
  line-height: 1.5;

  box-shadow:
    0 12px 35px rgba(110,20,220,.15);
}

.assistant .bubble {
  max-width: 95%;

  color: #f1f1f5;

  font-size: 17px;
  line-height: 1.7;
}

.assistantLabel {
  display: block;

  margin-bottom: 8px;

  color: var(--accent2);

  font-size: 11px;
  font-weight: 800;
  letter-spacing: .4em;
}

.assistantText strong {
  font-weight: 750;
}

.assistantText a {
  color: var(--accent2);
}

/* IMAGES */

.messageImage {
  width: min(300px, 72vw);
  max-height: 380px;

  object-fit: cover;

  display: block;

  margin-bottom: 8px;

  border-radius: 18px;

  border: 1px solid var(--border);
}

/* TYPING */

.typing {
  display: flex;
  gap: 6px;
  padding-top: 3px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--accent2);

  animation: typing 1s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {
  0%,100% {
    opacity: .25;
    transform: translateY(0);
  }

  50% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* INPUT */

.inputArea {
  position: absolute;

  z-index: 30;

  left: 12px;
  right: 12px;

  bottom:
    calc(9px + env(safe-area-inset-bottom));
}

.inputBox {
  min-height: 67px;

  display: flex;
  align-items: center;

  gap: 3px;

  padding: 6px;

  border-radius: 23px;

  background:
    rgba(16,17,24,.96);

  border:
    1px solid rgba(255,255,255,.11);

  box-shadow:
    0 20px 60px rgba(0,0,0,.4);

  backdrop-filter: blur(20px);
}

.input {
  flex: 1;
  min-width: 0;

  height: 50px;

  border: 0;
  outline: 0;

  background: transparent;

  color: white;

  font-size: 16px;

  padding: 0 6px;
}

.input::placeholder {
  color: #777a86;
}

.actionButton {
  width: 50px;
  height: 50px;

  flex-shrink: 0;

  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
}

.plusButton {
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.07);

  font-size: 28px;
  font-weight: 300;
}

.voiceButton {
  font-size: 22px;
}

.sendButton {
  color: var(--accent2);
  font-size: 29px;
}

.sendButton:disabled {
  opacity: .3;
}

/* MICROPHONE ICON */

.micIcon {
  width: 18px;
  height: 24px;

  border: 2px solid currentColor;
  border-radius: 10px;

  position: relative;
}

.micIcon::before {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  width: 12px;
  height: 8px;

  transform: translateX(-50%);

  border:
    0 2px 2px 2px solid currentColor;

  border-radius: 0 0 10px 10px;
}

.micIcon::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -14px;

  width: 2px;
  height: 6px;

  transform: translateX(-50%);

  background: currentColor;
}

/* PREVIEW */

.selectedPreview {
  position: absolute;

  left: 0;
  right: 0;

  bottom: 76px;

  display: flex;
  gap: 8px;

  padding: 8px;

  overflow-x: auto;

  border-radius: 17px;

  background: rgba(15,16,23,.98);

  border: 1px solid var(--border);
}

.previewItem {
  position: relative;
  flex-shrink: 0;
}

.previewItem img {
  width: 58px;
  height: 58px;

  object-fit: cover;

  border-radius: 13px;
}

.previewRemove {
  position: absolute;

  top: -5px;
  right: -5px;

  width: 21px;
  height: 21px;

  border-radius: 50%;

  background: #171821;
  border: 1px solid var(--border);

  font-size: 14px;
}

/* SIDEBAR OVERLAY */

.overlay {
  position: fixed;
  inset: 0;

  z-index: 90;

  background: rgba(0,0,0,.62);

  backdrop-filter: blur(7px);

  opacity: 0;
  pointer-events: none;

  transition: .2s;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* SIDEBAR */

.sidebar {
  position: fixed;

  z-index: 100;

  top: 0;
  left: 0;
  bottom: 0;

  width: min(390px,88vw);

  padding:
    calc(20px + env(safe-area-inset-top))
    16px
    calc(16px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      180deg,
      #0d0e15,
      #08090e
    );

  border-right: 1px solid var(--border);

  transform: translateX(-105%);

  transition:
    transform .28s
    cubic-bezier(.22,.8,.25,1);

  display: flex;
  flex-direction: column;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebarHeader {
  display: flex;
  align-items: center;

  margin-bottom: 35px;
}

.sidebarBrand {
  flex: 1;

  font-size: 26px;
  font-weight: 700;

  letter-spacing: .25em;
}

.closeButton {
  width: 50px;
  height: 50px;

  border-radius: 16px;

  background: rgba(255,255,255,.045);

  font-size: 28px;
}

.sectionTitle {
  color: #727581;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: .3em;

  margin:
    0 8px 10px;
}

.menuItem {
  width: 100%;
  min-height: 55px;

  display: flex;
  align-items: center;

  gap: 15px;

  padding: 0 12px;

  border-radius: 16px;

  background: transparent;

  text-align: left;

  font-size: 16px;
}

.menuItem:active {
  background: rgba(255,255,255,.06);
}

.menuIcon {
  width: 25px;
  text-align: center;

  color: #aaaeba;

  font-size: 21px;
}

.divider {
  height: 1px;

  margin: 17px 8px;

  background: var(--border);
}

.chatList {
  flex: 1;

  overflow-y: auto;

  padding-top: 10px;
}

.historyGroup {
  margin-bottom: 20px;
}

.historyDate {
  margin:
    0 8px 9px;

  color: #656875;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: .22em;
}

.historyItem {
  position: relative;

  width: 100%;

  min-height: 65px;

  margin-bottom: 7px;

  padding:
    11px 48px 11px 13px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid rgba(255,255,255,.05);
}

.historyItem.active {
  background:
    rgba(150,45,245,.13);

  border-color:
    rgba(170,55,255,.38);
}

.historyTitle {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  font-size: 15px;
}

.historyTime {
  margin-top: 4px;

  color: #6e717d;

  font-size: 10px;
}

.historyMore {
  position: absolute;

  top: 50%;
  right: 8px;

  transform: translateY(-50%);

  width: 35px;
  height: 35px;

  border-radius: 12px;

  background: rgba(255,255,255,.045);

  color: #a4a7b2;

  font-size: 13px;
}

.sidebarFooter {
  padding-top: 13px;

  color: #555862;

  text-align: center;

  font-size: 10px;
}

/* CONTEXT */

.contextMenu {
  position: fixed;

  z-index: 200;

  width: 200px;

  padding: 6px;

  border-radius: 17px;

  background: #171820;

  border: 1px solid var(--border);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {
  width: 100%;

  padding: 13px;

  border-radius: 12px;

  background: transparent;

  text-align: left;

  font-size: 14px;
}

.contextItem:active {
  background: rgba(255,255,255,.06);
}

.contextItem.delete {
  color: var(--danger);
}

/* MODAL */

.modalOverlay {
  position: fixed;
  inset: 0;

  z-index: 300;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0,0,0,.7);

  backdrop-filter: blur(10px);
}

.modalOverlay.open {
  display: flex;
}

.modal {
  width: min(450px,100%);

  padding: 24px;

  border-radius: 24px;

  background: #12131b;

  border: 1px solid var(--border);

  box-shadow:
    0 30px 100px rgba(0,0,0,.65);
}

.modal h2 {
  margin-bottom: 17px;

  font-size: 22px;
}

.modalText {
  color: var(--muted);
  line-height: 1.5;
}

.modalInput {
  width: 100%;
  height: 54px;

  margin-top: 10px;

  padding: 0 15px;

  border-radius: 15px;

  border: 1px solid var(--border);

  outline: none;

  background: #080910;

  color: white;

  font-size: 16px;
}

.modalButtons {
  display: flex;
  gap: 8px;

  margin-top: 18px;
}

.modalButton {
  flex: 1;

  height: 50px;

  border-radius: 15px;

  background: rgba(255,255,255,.06);
}

.modalButton.primary {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.modalButton.danger {
  background: #a52b43;
}

/* SETTINGS */

.settingsList {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.settingOption {
  width: 100%;
  min-height: 57px;

  padding: 0 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-radius: 15px;

  background: rgba(255,255,255,.035);

  border: 1px solid rgba(255,255,255,.06);

  text-align: left;
}

.settingOption.active {
  background: rgba(150,45,245,.13);
  border-color: rgba(170,55,255,.45);
}

.settingDescription {
  display: block;

  margin-top: 3px;

  color: #777a86;

  font-size: 11px;
}

.check {
  color: var(--accent2);
}

/* VOICE */

.voiceMode {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: flex;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(140,25,220,.2),
      transparent 33%
    ),
    #05060a;

  opacity: 0;
  pointer-events: none;

  transform: scale(.97);

  transition: .3s;
}

.voiceMode.open {
  opacity: 1;
  pointer-events: auto;

  transform: scale(1);
}

.voiceTop {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    calc(18px + env(safe-area-inset-top))
    20px
    0;
}

.voiceTitle {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .28em;
}

.voiceClose {
  width: 48px;
  height: 48px;

  border-radius: 15px;

  background: rgba(255,255,255,.05);

  font-size: 28px;
}

.voiceCenter {
  flex: 1;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding-bottom: 8vh;
}

.orb {
  width: 175px;
  height: 175px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 32% 27%,
      rgba(255,255,255,.85),
      transparent 10%
    ),
    radial-gradient(
      circle at 52% 52%,
      #d247ff,
      #8e27d2 40%,
      #280b42
    );

  box-shadow:
    0 0 50px rgba(170,45,255,.35),
    0 0 120px rgba(128,27,208,.2);

  animation:
    orbIdle 3.5s ease-in-out infinite;
}

.orbCore {
  width: 55px;
  height: 55px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      white,
      #d68cff 25%,
      #a72fff
    );

  box-shadow:
    0 0 35px rgba(224,161,255,.65);

  animation:
    corePulse 1.8s ease-in-out infinite;
}

.voiceMode.listening .orb {
  animation:
    orbListening 1.1s ease-in-out infinite;
}

.voiceMode.speaking .orb {
  animation:
    orbSpeaking .7s ease-in-out infinite;
}

@keyframes orbIdle {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.04);
  }
}

@keyframes orbListening {
  0%,100% {
    transform: scale(.96);
  }

  50% {
    transform: scale(1.1);
  }
}

@keyframes orbSpeaking {
  0%,100% {
    transform: scale(.94);
  }

  50% {
    transform: scale(1.12);
  }
}

@keyframes corePulse {
  0%,100% {
    transform: scale(.85);
  }

  50% {
    transform: scale(1.12);
  }
}

.voiceStatus {
  margin-top: 52px;

  min-height: 26px;

  color: #aeb0bb;

  font-size: 16px;

  text-align: center;
}

.voiceBottom {
  padding:
    0
    20px
    calc(28px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: center;
}

.voiceControl {
  width: 62px;
  height: 62px;

  border-radius: 21px;

  background: rgba(255,255,255,.06);

  border: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: center;
}

/* HIDDEN INPUTS */

.hidden {
  position: fixed;

  width: 1px;
  height: 1px;

  opacity: 0;
  pointer-events: none;
}

@media (max-width: 600px) {

  .orb {
    width: 155px;
    height: 155px;
  }

  .chat {
    padding-left: 15px;
    padding-right: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button
      class="menuButton"
      id="menuButton"
      type="button"
      aria-label="Menü"
    >
      <span class="menuLines">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <div class="brand">
      <span class="brandText">ASA</span>
    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  ></main>


  <!-- INPUT -->

  <div class="inputArea">

    <div
      class="inputBox"
      id="inputBox"
    >

      <button
        class="actionButton plusButton"
        id="plusButton"
        type="button"
      >
        +
      </button>

      <input
        class="input"
        id="messageInput"
        type="text"
        autocomplete="off"
        enterkeyhint="send"
        placeholder="ASA'ya bir şey sor..."
      >

      <button
        class="actionButton voiceButton"
        id="voiceButton"
        type="button"
        aria-label="Sesli sohbet"
      >
        <span class="micIcon"></span>
      </button>

      <button
        class="actionButton sendButton"
        id="sendButton"
        type="button"
      >
        →
      </button>

    </div>

  </div>

</div>


<!-- FILE PICKERS -->

<input
  class="hidden"
  id="photoInput"
  type="file"
  accept="image/*"
  multiple
>

<input
  class="hidden"
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>

<input
  class="hidden"
  id="fileInput"
  type="file"
  multiple
>


<!-- ATTACHMENT SHEET -->

<div
  class="modalOverlay"
  id="attachmentModal"
>

  <div class="modal">

    <h2>Eklemek istediğin şey</h2>

    <div class="settingsList">

      <button
        class="settingOption"
        id="photosButton"
        type="button"
      >
        <span>Fotoğraflar</span>
        <span>›</span>
      </button>

      <button
        class="settingOption"
        id="cameraButton"
        type="button"
      >
        <span>Kamera</span>
        <span>›</span>
      </button>

      <button
        class="settingOption"
        id="filesButton"
        type="button"
      >
        <span>Dosyalar</span>
        <span>›</span>
      </button>

    </div>

    <div class="modalButtons">

      <button
        class="modalButton"
        id="attachmentCancel"
        type="button"
      >
        Vazgeç
      </button>

    </div>

  </div>

</div>


<!-- SIDEBAR OVERLAY -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- SIDEBAR -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebarHeader">

    <div class="sidebarBrand">
      ASA
    </div>

    <button
      class="closeButton"
      id="closeMenu"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="sectionTitle">
    SOHBET
  </div>


  <button
    class="menuItem"
    id="newChatButton"
    type="button"
  >
    <span class="menuIcon">+</span>
    <span>Yeni Sohbet</span>
  </button>


  <button
    class="menuItem"
    id="showChatsButton"
    type="button"
  >
    <span class="menuIcon">≡</span>
    <span>Sohbetler</span>
  </button>


  <div class="divider"></div>


  <div class="sectionTitle">
    ASA
  </div>


  <button
    class="menuItem"
    id="memoryButton"
    type="button"
  >

<script>
/* =========================================================
   ASA — NEW FRONTEND
========================================================= */

const API_URL = "/api/chat";
const REALTIME_URL = "/api/realtime";

const STORAGE_KEY = "asa_conversations_v4";
const ACTIVE_KEY = "asa_active_v4";
const SETTINGS_KEY = "asa_settings_v4";


/* =========================================================
   STATE
========================================================= */

let conversationId =
  localStorage.getItem(ACTIVE_KEY) ||
  createId();

let contextConversationId = null;

  pc: null,
  dc: null,
  stream: null,
  connected: false,
  starting: false
};


let settings = {
  voice:
    localStorage.getItem("asa_voice_v4") ||
    "marin",

  theme:

/* =========================================================
   ID
========================================================= */

function createId() {

  const id =
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,9);

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

  return id;
}


/* =========================================================
   SETTINGS
========================================================= */

const THEMES = {

  purple: {
    name: "Siyah · Mor",
    accent: "#a331ff",
    accent2: "#c13cff"
  },

  red: {
    name: "Siyah · Kırmızı",
    accent: "#ff315d",
    accent2: "#ff5578"
  },

  blue: {
    name: "Siyah · Mavi",
    accent: "#287cff",
    accent2: "#4e9aff"
  },

  green: {
    name: "Siyah · Yeşil",
    accent: "#19c985",
    accent2: "#39e8a0"
  },

  night: {
    name: "Gece",
    accent: "#7f8cff",
    accent2: "#9ca5ff"
  }

};


const VOICES = [

  ["marin","Marin","Doğal ve dengeli"],
  ["cedar","Cedar","Sakin ve güçlü"],
  ["coral","Coral","Sıcak ve samimi"],
  ["sage","Sage","Yumuşak ve sakin"],
  ["ash","Ash","Net ve doğal"],
  ["verse","Verse","Canlı ve enerjik"]

];


function saveSettings() {

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

  localStorage.setItem(
    "asa_voice_v4",
    settings.voice
  );

  localStorage.setItem(
    "asa_theme_v4",
    settings.theme
  );
}


function applyTheme() {

  const theme =
    THEMES[settings.theme] ||
    THEMES.purple;

  document.documentElement
    .style
    .setProperty(
      "--accent",
      theme.accent
    );

  document.documentElement
    .style
    .setProperty(
      "--accent2",
      theme.accent2
    );

  saveSettings();
}


applyTheme();


/* =========================================================
   STORAGE
========================================================= */

function getConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }
}


function saveConversations(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function ensureConversation(title = "") {

  const conversations =
    getConversations();

  let item =
    conversations.find(
      x =>
        x.id ===
        conversationId
    );


  if (!item) {

    item = {

      id:
        conversationId,

      title:
        title ||
        "Yeni Sohbet",

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };

    conversations.unshift(
      item
    );

  }


  if (
    title &&
    item.title ===
      "Yeni Sohbet"
  ) {

    item.title =
      makeTitle(title);

  }


  item.updatedAt =
    Date.now();


  saveConversations(
    conversations
  );

}


function makeTitle(text) {

  let title =
    String(text || "")
      .replace(/\s+/g," ")
      .trim();


  if (!title) {
    return "Yeni Sohbet";
  }


  if (title.length > 45) {

    title =
      title
        .slice(0,45)
        .trim() + "…";

  }


  return (
    title.charAt(0)
      .toUpperCase() +
    title.slice(1)
  );

}


/* =========================================================
   MENU
========================================================= */

$("menuButton")
  .addEventListener(
    "click",
    () => {

      renderChatList();

function closeSidebar() {

}

overlay

/* =========================================================
   CHAT LIST
========================================================= */

function renderChatList() {

  const conversations =
    getConversations()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


  chatList.innerHTML = "";


  if (!conversations.length) {

    chatList.innerHTML = `
      <div style="
        color:#666a76;
        text-align:center;
        padding:30px 10px;
        font-size:14px;
      ">
        Henüz sohbet yok.
      </div>
    `;

    return;

  }


  conversations.forEach(
    item => {

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "historyItem" +
        (
          item.id ===
          conversationId
            ? " active"
            : ""
        );


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "historyTitle";

      title.textContent =
        item.title;


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "historyTime";

      time.textContent =
        formatTime(
          item.updatedAt
        );


      const more =
        document.createElement(
          "button"
        );

      more.className =
        "historyMore";

      more.type =
        "button";

      more.textContent =
        "•••";


      el.append(
        title,
        time,
        more
      );


      el.addEventListener(
        "click",
        event => {

          if (
            event.target.closest(
              ".historyMore"
            )
          ) {
            return;
          }

          openConversation(
            item.id
          );

        }
      );


      more.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          showContext(
            item.id,
            more
          );

        }
      );


      chatList.appendChild(
        el
      );

    }
  );

}


function formatTime(timestamp) {

  if (!timestamp) {
    return "";
  }

  return new Date(
    timestamp
  ).toLocaleTimeString(
    "tr-TR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   NEW CHAT
========================================================= */

$("newChatButton")
  .addEventListener(
    "click",
    createNewConversation
  );


function createNewConversation() {

  conversationId =
    createId();

  messages = [];

  selectedFiles = [];

  removePreview();

  input.value = "";

  showEmpty();

  renderChatList();

  closeSidebar();

  input.focus();

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openConversation(id) {

  conversationId =
    id;

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

  closeSidebar();

  chat.innerHTML = "";

  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              conversationId:id,
              getHistory:true
            })
        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      response.ok &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        normalizeHistory(
          data.history
        );

      renderMessages();

    } else {

      showEmpty();

    }

  } catch {

    removeTyping();

    showEmpty();

  }

}


/* =========================================================
   HISTORY
========================================================= */

function normalizeHistory(history) {

  if (!Array.isArray(history)) {
    return [];
  }


  return history
    .filter(
      m =>
        m &&
        (
          m.role === "user" ||
          m.role === "assistant"
        )
    )
    .map(
      m => {

        let content =
          m.content;


        if (
          typeof content !==
          "string"
        ) {

          try {

            content =
              JSON.stringify(
                content
              );

          } catch {

            content =
              String(content);

          }

        }


        return {

          role:m.role,

          content:
            content || "",

          attachments:
            Array.isArray(
              m.attachments
            )
              ? m.attachments
              : []

        };

      }
    );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedFiles.length
  ) {
    return;
  }


  input.value = "";

  sendButton.disabled =
    true;


  const attachments =
    await prepareFiles();


  const title =
    text ||
    attachments[0]?.name ||
    "Görsel";


  ensureConversation(
    title
  );


  messages.push({

    role:"user",

    content:text,

    attachments

  });


  renderMessages();

  addTyping();


  try {

    /*
      Şimdilik mevcut /api/chat
      yapına uyumlu şekilde
      metin gönderiyoruz.
    */

    const apiText =
      buildApiText(
        text,
        attachments
      );


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId,

              messages:[
                {
                  role:"user",
                  content:apiText
                }
              ]

            })
        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      data.success === false
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    let answer =
      data.answer ||
      data.output ||
      "Şu anda cevap oluşturamadım.";


    answer =
      objectToText(
        answer
      );


    messages.push({

      role:"assistant",

      content:answer

    });


    if (
      Array.isArray(
        data.history
      )
    ) {

      const history =
        normalizeHistory(
          data.history
        );


      const localImages =
        messages.filter(
          m =>
            m.role === "user" &&
            m.attachments?.length
        );


      messages =
        history;


      localImages.forEach(
        local => {

          const match =
            messages.find(
              m =>
                m.role === "user" &&
                m.content ===
                  local.content
            );


          if (match) {

            match.attachments =
              local.attachments;

          }

        }
      );

    }


    selectedFiles = [];

    removePreview();

    ensureConversation();

    renderMessages();

    renderChatList();

  } catch(error) {

    removeTyping();


    messages.push({

      role:"assistant",

      content:
        "Bağlantıda bir sorun oluştu. Birazdan tekrar deneyelim."

    });


    renderMessages();


    console.error(
      "ASA CHAT:",
      error
    );

  }


  sendButton.disabled =
    false;

  input.focus();

}


/* =========================================================
   API TEXT
========================================================= */

function buildApiText(
  text,
  attachments
) {

  const parts = [];


  if (text) {
    parts.push(text);
  }


  attachments.forEach(
    file => {

      parts.push(
        `Eklenen dosya: ${file.name}`
      );

    }
  );


  return parts.join(
    "\n\n"
  );

}


/* =========================================================
   OBJECT TEXT
========================================================= */

function objectToText(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  if (
    typeof value ===
    "string"
  ) {
    return value;
  }


  if (
    typeof value ===
      "number" ||
    typeof value ===
      "boolean"
  ) {

    return String(value);

  }


  if (
    typeof value ===
    "object"
  ) {

    if (
      typeof value.text ===
      "string"
    ) {

      return value.text;

    }


    if (
      typeof value.content ===
      "string"
    ) {

      return value.content;

    }


    try {

      return JSON.stringify(
        value,
        null,
        2
      );

    } catch {

      return "[Veri]";

    }

  }


  return String(value);

}


/* =========================================================
   ATTACHMENTS

function addFiles(files) {

  if (!files.length) {
    return;
  }


  selectedFiles.push(
    ...files
  );


  renderPreview();

  input.focus();

}


function renderPreview() {

  removePreview();


  if (!selectedFiles.length) {
    return;
  }


  const preview =
    document.createElement(
      "div"
    );

  preview.id =
    "selectedPreview";

  preview.className =
    "selectedPreview";


  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "previewItem";


      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          URL.createObjectURL(
            file
          );

        item.appendChild(
          img
        );

      } else {

        item.innerHTML = `
          <div style="
            width:58px;
            height:58px;
            border-radius:13px;
            background:#20212a;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
            padding:5px;
            text-align:center;
          ">
            ${escapeHtml(
              file.name
            )}
          </div>
        `;

      }


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "previewRemove";

      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderPreview();

        }
      );


      item.appendChild(
        remove
      );

      preview.appendChild(
        item
      );

    }
  );


  $("inputBox")
    .appendChild(
      preview
    );

}


function removePreview() {

  const old =
    $("selectedPreview");

  if (old) {
    old.remove();
  }

}


function fileToDataURL(file) {

  return new Promise(
    resolve => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          resolve(null);


      reader.readAsDataURL(
        file
      );

    }
  );

}


async function prepareFiles() {

  const result = [];


  for (
    const file of
    selectedFiles
  ) {

    result.push({

      name:
        file.name,

      type:
        file.type,

      size:
        file.size,

      dataUrl:
        await fileToDataURL(
          file
        )

    });

  }


  return result;

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "message " +
        (
          message.role ===
          "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        bubble.innerHTML = `
          <span class="assistantLabel">
            ASA
          </span>

          <div class="assistantText">
            ${formatAnswer(
              objectToText(
                message.content
              )
            )}
          </div>
        `;

      } else {

        if (
          Array.isArray(
            message.attachments
          )
        ) {

          message.attachments.forEach(
            attachment => {

              if (
                attachment?.dataUrl &&
                attachment.type?.startsWith(
                  "image/"
                )
              ) {

                const img =
                  document.createElement(
                    "img"
                  );

                img.className =
                  "messageImage";

                img.src =
                  attachment.dataUrl;

                img.alt =
                  attachment.name ||
                  "Görsel";

                bubble.appendChild(
                  img
                );

              }

            }
          );

        }


        if (
          message.content
        ) {

          const text =
            document.createElement(
              "div"
            );

          text.textContent =
            objectToText(
              message.content
            );

          bubble.appendChild(
            text
          );

        }

      }


      row.appendChild(
        bubble
      );

      chat.appendChild(
        row
      );

    }
  );


  scrollBottom();

}

function escapeHtml(text) {

  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatAnswer(text) {

  let result =
    escapeHtml(text);


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}

/* =========================================================
   REALTIME
========================================================= */

async function startRealtime() {

  if (
    realtime.starting ||
    realtime.connected
  ) {
    return;
  }


  realtime.starting =
    true;


  try {

    setVoiceStatus(
      "Mikrofon hazırlanıyor..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Bu tarayıcı mikrofon erişimini desteklemiyor."
      );

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    realtime.stream =
      stream;


    const pc =
      new RTCPeerConnection();


    realtime.pc =
      pc;


    pc.ontrack =
      event => {

        const stream =
          event.streams?.[0];


        if (!stream) {
          return;
        }


        remoteAudio.srcObject =
          stream;


        remoteAudio
          .play()
          .catch(
            () => {}
          );

      };


    pc.onconnectionstatechange =
      () => {

        const state =
          pc.connectionState;


        if (
          state ===
          "connected"
        ) {

          realtime.connected =
            true;

          realtime.starting =
            false;

          setVoiceStatus(
            "Dinliyorum..."
          );

        }


        if (
          state === "failed" ||
          state === "disconnected" ||
          state === "closed"
        ) {

          realtime.connected =
            false;

          setVoiceStatus(
            "Ses bağlantısı kesildi."
          );

        }

      };


    stream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            stream
          );

        }
      );


    const dc =
      pc.createDataChannel(
        "oai-events"
      );


    realtime.dc =
      dc;


    dc.onopen =
      () => {

        realtime.connected =
          true;

        realtime.starting =
          false;

        setVoiceStatus(
          "Dinliyorum..."
        );

      };


    dc.onmessage =
      event => {

        handleRealtimeEvent(
          event.data
        );

      };


    dc.onerror =
      error => {

        console.error(
          "ASA realtime data channel:",
          error
        );

        setVoiceStatus(
          "Ses bağlantısında hata oluştu."
        );

      };


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    setVoiceStatus(
      "ASA'ya bağlanıyorum..."
    );


    /*
      Backend sadece kısa ömürlü
      client secret üretir.

      OPENAI_API_KEY hiçbir zaman
      tarayıcıya gönderilmez.
    */

    const tokenResponse =
      await fetch(
        REALTIME_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              voice:
                settings.voice
            })
        }
      );


    const tokenData =
      await tokenResponse.json();


    if (
      !tokenResponse.ok
    ) {

      throw new Error(
        tokenData.error ||
        "Realtime anahtarı alınamadı."
      );

    }


    const clientSecret =
      tokenData.clientSecret ||
      tokenData.client_secret?.value ||
      tokenData.value;


    if (!clientSecret) {

      throw new Error(
        "Backend client secret döndürmedi."
      );

    }


    /*
      WebRTC SDP bağlantısı.
    */

    const sdpResponse =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {
          method:"POST",

          headers:{
            Authorization:
              `Bearer ${clientSecret}`,

            "Content-Type":
              "application/sdp"
          },

          body:
            offer.sdp
        }
      );


    if (!sdpResponse.ok) {

      const errorText =
        await sdpResponse.text();

      throw new Error(
        errorText ||
        "Realtime SDP bağlantısı kurulamadı."
      );

    }


    const answer =
      await sdpResponse.text();


    await pc.setRemoteDescription({

      type:"answer",

      sdp:answer

    });


  } catch(error) {

    console.error(
      "ASA REALTIME:",
      error
    );


    await stopRealtime();


    setVoiceStatus(
      "Sesli bağlantı kurulamadı."
    );

  }

}


/* =========================================================
   REALTIME EVENTS
========================================================= */

function handleRealtimeEvent(raw) {

  let event;


  try {

    event =
      JSON.parse(raw);

  } catch {

    return;

  }


  switch(
    event.type
  ) {


    case
      "input_audio_buffer.speech_started":

      $("voiceMode")
        .classList.add(
          "listening"
        );

      $("voiceMode")
        .classList.remove(
          "speaking"
        );

      setVoiceStatus(
        "Dinliyorum..."
      );

      break;


    case
      "input_audio_buffer.speech_stopped":

      $("voiceMode")
        .classList.remove(
          "listening"
        );

      setVoiceStatus(
        "ASA düşünüyor..."
      );

      break;


    case
      "response.created":

      $("voiceMode")
        .classList.remove(
          "listening"
        );

      $("voiceMode")
        .classList.add(
          "speaking"
        );

      setVoiceStatus(
        "ASA konuşuyor..."
      );

      break;


    case
      "response.audio.delta":

      $("voiceMode")
        .classList.add(
          "speaking"
        );

      break;


    case
      "response.audio.done":

      $("voiceMode")
        .classList.remove(
          "speaking"
        );

      setVoiceStatus(
        "Dinliyorum..."
      );

      break;


    case
      "response.done":

      $("voiceMode")
        .classList.remove(
          "speaking"
        );

      setVoiceStatus(
        "Dinliyorum..."
      );

      break;


    case "error":

      console.error(
        "OpenAI Realtime:",
        event
      );

      setVoiceStatus(
        "ASA'nın ses bağlantısında bir hata oluştu."
      );

      break;

  }

}


function setVoiceStatus(text) {

  voiceStatus.textContent =
    text;

}


/* =========================================================
   STOP REALTIME
========================================================= */

async function stopRealtime() {

  realtime.connected =
    false;

  realtime.starting =
    false;


  if (realtime.dc) {

    try {
      realtime.dc.close();
    } catch {}

  }


  if (realtime.pc) {

    try {
      realtime.pc.close();
    } catch {}

  }


  if (realtime.stream) {

    realtime.stream
      .getTracks()
      .forEach(
        track => {

          try {
            track.stop();
          } catch {}

        }
      );

  }


  realtime.dc =
    null;

  realtime.pc =
    null;

  realtime.stream =
    null;


  $("voiceMode")
    .classList.remove(
      "listening",
      "speaking"
    );


  try {

    remoteAudio.pause();

    remoteAudio.srcObject =
      null;

  } catch {}

}
