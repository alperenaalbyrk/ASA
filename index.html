<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ASA</title>

<style>

/* =====================================================
   TEMEL
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #05040a;
  --panel: #0d0c16;
  --panel2: #12111d;
  --border: rgba(255,255,255,.10);

  --text: #f5f5fa;
  --muted: #8c8b9b;

  --purple: #9b35ff;
  --purple2: #c13cff;
}

html,
body {
  width: 100%;
  height: 100%;

  background: var(--bg);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}


/* =====================================================
   ANA UYGULAMA
===================================================== */

.app {
  width: 100%;
  height: 100dvh;

  position: relative;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(117,22,180,.20),
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(80,0,150,.13),
      transparent 35%
    ),

    #05040a;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  height: 130px;

  padding: 30px 22px 18px;

  display: flex;
  align-items: center;

  gap: 18px;

  border-bottom:
    1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.98),
      rgba(5,4,10,.86)
    );

  position: relative;
  z-index: 20;
}

.menuButton,
.iconButton {
  width: 70px;
  height: 70px;

  flex-shrink: 0;

  border-radius: 22px;

  background:
    rgba(18,17,29,.88);

  border:
    1px solid rgba(255,255,255,.10);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 31px;

  cursor: pointer;

  transition: transform .2s;
}

.menuButton:active,
.iconButton:active {
  transform: scale(.94);
}

.logo {
  width: 70px;
  height: 70px;

  flex-shrink: 0;

  border-radius: 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8d2fff,
      #c53cff
    );

  box-shadow:
    0 0 30px rgba(163,45,255,.35);

  font-size: 38px;
  font-weight: 800;
}

.brand {
  font-size: 37px;
  font-weight: 800;

  letter-spacing: 7px;
}

.headerSpacer {
  flex: 1;
}

.headerActions {
  display: flex;
  gap: 12px;
}


/* =====================================================
   CHAT ALANI
===================================================== */

.chat {
  position: absolute;

  top: 130px;
  left: 0;
  right: 0;
  bottom: 125px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    55px 25px 160px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 4px;
}

.chat::-webkit-scrollbar-thumb {
  background:
    rgba(180,60,255,.35);

  border-radius: 10px;
}


/* =====================================================
   MESAJ
===================================================== */

.message {
  width: 100%;

  margin-bottom: 18px;

  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}


/* =====================================================
   KONUŞMA BALONU
===================================================== */

.bubble {
  max-width: 86%;

  padding:
    17px 21px;

  border-radius: 23px;

  font-size: 19px;
  line-height: 1.55;

  word-break: break-word;

  overflow-wrap: anywhere;

  white-space: pre-wrap;
}


/* KULLANICI */

.user .bubble {
  background:
    linear-gradient(
      135deg,
      #8439e9,
      #c53bda
    );

  border-bottom-right-radius: 7px;

  box-shadow:
    0 12px 35px
    rgba(131,48,255,.15);
}


/* ASA */

.assistant .bubble {
  width: fit-content;

  max-width: min(86%, 720px);

  background:
    linear-gradient(
      145deg,
      rgba(17,16,27,.97),
      rgba(11,10,18,.97)
    );

  border:
    1px solid rgba(255,255,255,.09);

  border-bottom-left-radius: 7px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.25);
}


/* ASA YAZISI */

.assistantLabel {
  display: block;

  color: #b13cff;

  font-size: 13px;
  font-weight: 800;

  letter-spacing: 6px;

  margin-bottom: 7px;
}


/* =====================================================
   BOŞ EKRAN
===================================================== */

.empty {
  min-height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyLogo {
  width: 95px;
  height: 95px;

  border-radius: 29px;

  background:
    linear-gradient(
      135deg,
      #8e30ff,
      #c33cff
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 52px;
  font-weight: 800;

  box-shadow:
    0 0 70px
    rgba(159,44,255,.30);

  margin-bottom: 25px;
}

.empty h1 {
  font-size: 29px;
  margin-bottom: 10px;
}

.empty p {
  color: var(--muted);
  font-size: 18px;
}


/* =====================================================
   ALT GİRİŞ
===================================================== */

.inputArea {
  position: absolute;

  left: 20px;
  right: 20px;
  bottom: 25px;

  z-index: 15;
}

.inputBox {
  min-height: 92px;

  border-radius: 30px;

  background:
    rgba(15,14,25,.96);

  border:
    1px solid rgba(255,255,255,.11);

  display: flex;
  align-items: center;

  padding: 10px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.35),

    0 0 35px
    rgba(135,35,255,.08);
}

.voiceButton {
  width: 70px;
  height: 70px;

  flex-shrink: 0;

  border-radius: 22px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  font-size: 31px;

  cursor: pointer;
}

.input {
  flex: 1;

  min-width: 0;

  background: transparent;

  border: 0;
  outline: 0;

  color: white;

  padding: 0 18px;

  font-size: 20px;
}

.input::placeholder {
  color: #727181;
}

.sendButton {
  width: 70px;
  height: 70px;

  flex-shrink: 0;

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );

  font-size: 35px;

  cursor: pointer;

  box-shadow:
    0 0 30px
    rgba(165,45,255,.25);

  transition: transform .15s;
}

.sendButton:active {
  transform: scale(.93);
}

.sendButton:disabled {
  opacity: .45;
}


/* =====================================================
   SIDEBAR
===================================================== */

.overlay {
  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.58);

  backdrop-filter: blur(7px);

  z-index: 50;

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.overlay.open {
  opacity: 1;

  pointer-events: auto;
}

.sidebar {
  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  width: min(560px, 88vw);

  background:
    linear-gradient(
      180deg,
      #0e0d19,
      #080710
    );

  border-right:
    1px solid rgba(255,255,255,.09);

  z-index: 60;

  transform:
    translateX(-105%);

  transition:
    transform .3s
    cubic-bezier(.22,.8,.25,1);

  padding: 30px;

  display: flex;
  flex-direction: column;
}

.sidebar.open {
  transform:
    translateX(0);
}

.sidebarHeader {
  display: flex;
  align-items: center;

  gap: 15px;

  margin-bottom: 45px;
}

.sidebarLogo {
  width: 68px;
  height: 68px;

  border-radius: 21px;

  background:
    linear-gradient(
      135deg,
      #9130ff,
      #c33cff
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 37px;
  font-weight: 800;
}

.sidebarBrand {
  font-size: 25px;

  font-weight: 800;

  letter-spacing: 7px;

  flex: 1;
}

.closeButton {
  width: 62px;
  height: 62px;

  border-radius: 20px;

  background:
    rgba(255,255,255,.05);

  font-size: 32px;

  cursor: pointer;
}

.menuSectionTitle {
  font-size: 13px;

  letter-spacing: 5px;

  font-weight: 800;

  color: #858394;

  margin-bottom: 18px;
}

.menuItem {
  width: 100%;

  min-height: 70px;

  display: flex;
  align-items: center;

  gap: 20px;

  padding: 10px 15px;

  border-radius: 20px;

  background: transparent;

  cursor: pointer;

  text-align: left;

  font-size: 20px;

  font-weight: 600;

  transition: .2s;
}

.menuItem:active {
  background:
    rgba(255,255,255,.06);
}

.menuIcon {
  width: 45px;

  text-align: center;

  font-size: 29px;
}

.menuDivider {
  height: 1px;

  background:
    rgba(255,255,255,.07);

  margin: 28px 0;
}


/* =====================================================
   SOHBET LİSTESİ
===================================================== */

.chatList {
  flex: 1;

  overflow-y: auto;

  padding-right: 5px;

  min-height: 0;
}

.chatList::-webkit-scrollbar {
  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {
  background:
    rgba(180,60,255,.35);
}

.historyGroup {
  margin-bottom: 25px;
}

.historyDate {
  color: #747286;

  font-size: 13px;

  letter-spacing: 3px;

  font-weight: 800;

  margin: 20px 8px 10px;
}

.historyItem {
  position: relative;

  width: 100%;

  padding:
    16px 50px 16px 18px;

  border-radius: 19px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid rgba(255,255,255,.06);

  margin-bottom: 9px;

  cursor: pointer;

  transition: .2s;
}

.historyItem:active {
  transform: scale(.985);
}

.historyTitle {
  font-size: 17px;

  font-weight: 650;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.historyTime {
  color: #727181;

  font-size: 12px;

  margin-top: 5px;
}

.historyMore {
  position: absolute;

  right: 10px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 38px;
  height: 38px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.045);

  color: #aaa8b6;

  font-size: 18px;

  cursor: pointer;
}

.noHistory {
  color: #666578;

  text-align: center;

  padding: 30px 10px;

  font-size: 15px;
}


/* =====================================================
   CONTEXT MENU
===================================================== */

.contextMenu {
  position: fixed;

  z-index: 100;

  width: 210px;

  background: #151421;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius: 18px;

  padding: 8px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.5);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {
  width: 100%;

  padding: 13px 15px;

  border-radius: 13px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 15px;
}

.contextItem:active {
  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {
  color: #ff687c;
}


/* =====================================================
   MODALLAR
===================================================== */

.modalOverlay {
  position: fixed;

  inset: 0;

  z-index: 200;

  background:
    rgba(0,0,0,.72);

  backdrop-filter: blur(10px);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.modalOverlay.open {
  display: flex;
}

.modal {
  width: min(500px,100%);

  background: #12111d;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius: 28px;

  padding: 28px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.6);
}

.modal h2 {
  font-size: 24px;

  margin-bottom: 20px;
}

.modalInput {
  width: 100%;

  padding: 17px;

  border-radius: 17px;

  background: #090811;

  border:
    1px solid rgba(255,255,255,.10);

  outline: none;

  color: white;

  font-size: 17px;
}

.modalButtons {
  display: flex;

  gap: 10px;

  margin-top: 20px;
}

.modalButton {
  flex: 1;

  padding: 15px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.06);

  cursor: pointer;
}

.modalButton.primary {
  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}

.modalButton.danger {
  background: #a92843;
}


/* =====================================================
   ASA YAZIYOR
===================================================== */

.typing {
  display: flex;

  align-items: center;

  gap: 5px;

  height: 20px;
}

.typing span {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #b43cff;

  animation:
    typing 1.1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .30s;
}

@keyframes typing {

  0%,
  60%,
  100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }

}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width:600px) {

  .header {
    height: 100px;

    padding:
      15px 14px;

    gap: 11px;
  }

  .menuButton,
  .iconButton,
  .logo {
    width: 58px;
    height: 58px;

    border-radius: 18px;
  }

  .menuButton,
  .iconButton {
    font-size: 25px;
  }

  .logo {
    font-size: 31px;
  }

  .brand {
    font-size: 28px;

    letter-spacing: 6px;
  }

  .headerActions {
    gap: 7px;
  }


  .chat {
    top: 100px;

    bottom: 120px;

    padding:
      45px 18px 150px;
  }


  .bubble {
    max-width: 90%;

    padding:
      15px 18px;

    font-size: 18px;

    border-radius: 21px;
  }

  .assistant .bubble {
    max-width: 90%;

    border-bottom-left-radius: 7px;
  }


  .inputArea {
    left: 12px;
    right: 12px;
    bottom: 12px;
  }

  .inputBox {
    min-height: 78px;

    border-radius: 25px;

    padding: 7px;
  }

  .voiceButton,
  .sendButton {
    width: 58px;
    height: 58px;

    border-radius: 18px;
  }

  .input {
    font-size: 17px;

    padding:
      0 10px;
  }


  .sidebar {
    width: 88vw;

    padding: 22px;
  }

  .sidebarLogo {
    width: 58px;
    height: 58px;
  }

  .closeButton {
    width: 55px;
    height: 55px;
  }

}

</style>
</head>


<body>


<div class="app">


  <!-- HEADER -->

  <header class="header">

    <button
      class="menuButton"
      id="menuButton"
      aria-label="Menü"
    >
      ☰
    </button>


    <div class="logo">
      A
    </div>


    <div class="brand">
      ASA
    </div>


    <div class="headerSpacer"></div>


    <div class="headerActions">

      <button
        class="iconButton"
        id="memoryButton"
      >
        🧠
      </button>


      <button
        class="iconButton"
        id="settingsButton"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  ></main>


  <!-- INPUT -->

  <div class="inputArea">

    <div class="inputBox">

      <button
        class="voiceButton"
        id="voiceButton"
        type="button"
      >
        🎙️
      </button>


      <input
        class="input"
        id="messageInput"
        type="text"
        autocomplete="off"
        placeholder="ASA'ya bir şey sor..."
      >


      <button
        class="sendButton"
        id="sendButton"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- SIDEBAR -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebarHeader">

    <div class="sidebarLogo">
      A
    </div>


    <div class="sidebarBrand">
      ASA
    </div>


    <button
      class="closeButton"
      id="closeMenu"
    >
      ×
    </button>

  </div>


  <div class="menuSectionTitle">
    SOHBET
  </div>


  <button
    class="menuItem"
    id="newChatButton"
  >

    <span class="menuIcon">
      ＋
    </span>

    <span>
      Yeni Sohbet
    </span>

  </button>


  <button
    class="menuItem"
    id="showChatsButton"
  >

    <span class="menuIcon">
      💬
    </span>

    <span>
      Sohbetler
    </span>

  </button>


  <div class="menuDivider"></div>


  <div class="menuSectionTitle">
    ASA
  </div>


  <button
    class="menuItem"
    id="memoryMenuButton"
  >

    <span class="menuIcon">
      🧠
    </span>

    <span>
      Hafızam
    </span>

  </button>


  <button
    class="menuItem"
    id="settingsMenuButton"
  >

    <span class="menuIcon">
      ⚙️
    </span>

    <span>
      Ayarlar
    </span>

  </button>


  <div class="menuDivider"></div>


  <!-- GEÇMİŞ SOHBETLER -->

  <div
    class="chatList"
    id="chatList"
  ></div>


</aside>


<!-- CONTEXT MENU -->

<div
  class="contextMenu"
  id="contextMenu"
>

  <button
    class="contextItem"
    id="renameButton"
  >
    ✏️ Başlığı değiştir
  </button>


  <button
    class="contextItem delete"
    id="deleteButton"
  >
    🗑️ Sohbeti sil
  </button>

</div>


<!-- RENAME -->

<div
  class="modalOverlay"
  id="renameModal"
>

  <div class="modal">

    <h2>
      Sohbet başlığını değiştir
    </h2>


    <input
      class="modalInput"
      id="renameInput"
      type="text"
      maxlength="80"
      placeholder="Sohbet adı"
    >


    <div class="modalButtons">

      <button
        class="modalButton"
        id="renameCancel"
      >
        İptal
      </button>


      <button
        class="modalButton primary"
        id="renameSave"
      >
        Kaydet
      </button>

    </div>

  </div>

</div>


<!-- DELETE -->

<div
  class="modalOverlay"
  id="deleteModal"
>

  <div class="modal">

    <h2>
      Sohbet silinsin mi?
    </h2>


    <p
      id="deleteText"
      style="
        color:#898796;
        line-height:1.5;
      "
    >
      Bu sohbet silinecek.
    </p>


    <div class="modalButtons">

      <button
        class="modalButton"
        id="deleteCancel"
      >
        İptal
      </button>


      <button
        class="modalButton danger"
        id="deleteConfirm"
      >
        Sil
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL = "/api/chat";


/* =====================================================
   LOCAL STORAGE
===================================================== */

const STORAGE_KEY =
  "asa_conversations_v2";

const ACTIVE_KEY =
  "asa_active_conversation_v2";


function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function createConversationId() {

  const id =
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,9);

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

  return id;

}


function getActiveConversationId() {

  let id =
    localStorage.getItem(
      ACTIVE_KEY
    );

  if (!id) {

    id =
      createConversationId();

  }

  return id;

}


/* =====================================================
   STATE
===================================================== */

let conversationId =
  getActiveConversationId();

let messages = [];

let contextConversationId =
  null;


/* =====================================================
   ELEMENTLER
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const chatList =
  document.getElementById(
    "chatList"
  );

const contextMenu =
  document.getElementById(
    "contextMenu"
  );

const renameModal =
  document.getElementById(
    "renameModal"
  );

const renameInput =
  document.getElementById(
    "renameInput"
  );

const deleteModal =
  document.getElementById(
    "deleteModal"
  );


/* =====================================================
   MENÜ
===================================================== */

function openMenu() {

/* =====================================================
   BAŞLIK
===================================================== */

function generateTitle(text) {

  let title =
    String(text)
      .replace(/\s+/g," ")
      .trim();

  if (!title) {

    return "Yeni Sohbet";

  }

  title =
    title
      .replace(/[?!.]+$/g,"")
      .trim();

  if (title.length > 38) {

    title =
      title.substring(0,38)
      .trim() +
      "…";

  }

  return (
    title.charAt(0).toUpperCase() +
    title.slice(1)
  );

}


/* =====================================================
   SOHBET METADATA
===================================================== */

function ensureConversation(
  firstMessage = ""
) {

  let conversations =
    loadConversations();

  let item =
    conversations.find(
      x =>
        x.id ===
        conversationId
    );


  if (!item) {

    item = {

      id:
        conversationId,

      title:
        firstMessage
          ? generateTitle(
              firstMessage
            )
          : "Yeni Sohbet",

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };

    conversations.unshift(
      item
    );

  }


  if (
    firstMessage &&
    item.title === "Yeni Sohbet"
  ) {

    item.title =
      generateTitle(
        firstMessage
      );

  }


  item.updatedAt =
    Date.now();


  saveConversations(
    conversations
  );

  return item;

}


/* =====================================================
   SOHBET LİSTESİ
===================================================== */

function renderChatList() {

  const conversations =
    loadConversations()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


  chatList.innerHTML = "";


  if (!conversations.length) {

    chatList.innerHTML = `

      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>

    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );

      const key =
        date.toDateString();


      if (!groups[key]) {

        groups[key] = [];

      }


      groups[key].push(
        item
      );

    }
  );


  Object.entries(groups)
    .forEach(
      ([key,items]) => {

        const group =
          document.createElement(
            "div"
          );

        group.className =
          "historyGroup";


        const dateTitle =
          document.createElement(
            "div"
          );

        dateTitle.className =
          "historyDate";

        dateTitle.textContent =
          getDateLabel(key);


        group.appendChild(
          dateTitle
        );


        items.forEach(
          item => {

            const element =
              document.createElement(
                "div"
              );

            element.className =
              "historyItem";


            element.innerHTML = `

              <div
                class="historyTitle"
              >
                ${escapeHtml(
                  item.title
                )}
              </div>

              <div
                class="historyTime"
              >
                ${formatTime(
                  item.updatedAt
                )}
              </div>

              <button
                class="historyMore"
                type="button"
              >
                •••
              </button>

            `;


            element.addEventListener(
              "click",
              () => {

                openConversation(
                  item.id
                );

              }
            );


            const more =
              element.querySelector(
                ".historyMore"
              );


            more.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              element
            );

          }
        );


        chatList.appendChild(
          group
        );

      }
    );

}


/* =====================================================
   TARİH
===================================================== */

function getDateLabel(
  dateString
) {

  const today =
    new Date();

  const date =
    new Date(dateString);

  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    today.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long"
      }
    )
    .toUpperCase();

}


function formatTime(
  timestamp
) {

  if (!timestamp) {

    return "";

  }

  return new Date(
    timestamp
  )
    .toLocaleTimeString(
      "tr-TR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

/* =====================================================
   SOHBET AÇ
===================================================== */

async function openConversation(
  id
) {

  conversationId =
    id;


  localStorage.setItem(
    ACTIVE_KEY,
    id
  );


  closeSidebar();


  chat.innerHTML = "";


  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId:
                id,

              getHistory:
                true

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

      renderMessages();

    } else {

      showEmpty();

    }

  } catch {

    removeTyping();

    showEmpty();

  }

}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  input.value = "";

  sendButton.disabled =
    true;


  ensureConversation(
    text
  );


  messages.push({

    role: "user",

    content: text

  });


  renderMessages();


  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId:

                conversationId,

              messages: [

                {
                  role:
                    "user",

                  content:
                    text
                }

              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    const answer =
      data.answer ||
      "Şu anda cevap oluşturamadım.";


    messages.push({

      role:
        "assistant",

      content:
        answer

    });


    if (
      data.history &&
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    }


    ensureConversation();


    renderMessages();


    renderChatList();


  } catch(error) {

    removeTyping();


    messages.push({

      role:
        "assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    renderMessages();


    console.error(
      error
    );

  }


  sendButton.disabled =
    false;


  input.focus();

}


/* =====================================================
   GÖNDERME
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   MESAJLARI GÖSTER
===================================================== */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message " +

        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        bubble.innerHTML = `

          <span
            class="assistantLabel"
          >
            ASA
          </span>

          ${formatAnswer(
            message.content
          )}

        `;

      } else {

        bubble.textContent =
          message.content;

      }


      row.appendChild(
        bubble
      );


      chat.appendChild(
        row
      );

    }
  );


  scrollToBottom();

}


/* =====================================================
   CEVAP FORMAT
===================================================== */

function formatAnswer(
  text
) {

  let result =
    escapeHtml(text);


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}

  row.id =

  row.innerHTML = `

        ASA

      <div class="typing">

        <span></span>

}


function removeTyping() {

        );

        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "tr-TR";


      recognition.continuous =

      recognition.interimResults =
        false;

        };


      recognition.start();

    }
  );

async function loadActiveConversation() {

  const id =
    getActiveConversationId();


  conversationId =
    id;


  const conversations =
    loadConversations();


  const exists =
    conversations.some(
      x =>
        x.id === id
    );

    showEmpty();

    return;

  }


  await openConversation(
    id
  );

}
