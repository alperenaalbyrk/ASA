<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ASA</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #05040a;
  --panel: #0d0c16;
  --panel2: #12111d;
  --border: rgba(255,255,255,.10);
  --text: #f5f5fa;
  --muted: #858394;
  --purple: #9b35ff;
  --purple2: #c13cff;
}

html,
body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
}


/* =====================================================
   APP
===================================================== */

.app {
  width: 100%;
  height: 100dvh;

  position: relative;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(117,22,180,.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(80,0,150,.13),
      transparent 35%
    ),
    #05040a;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  height: 100px;

  padding: 15px 14px;

  display: flex;
  align-items: center;

  gap: 11px;

  border-bottom:
    1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.98),
      rgba(5,4,10,.88)
    );

  position: relative;
  z-index: 20;
}

.menuButton,
.iconButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(18,17,29,.90);

  border:
    1px solid rgba(255,255,255,.10);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  cursor: pointer;

  transition: .2s;
}

.menuButton:active,
.iconButton:active {
  transform: scale(.94);
}

.logo {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8d2fff,
      #c53cff
    );

  box-shadow:
    0 0 30px rgba(163,45,255,.35);

  font-size: 31px;
  font-weight: 800;
}

.brand {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 6px;
}

.headerSpacer {
  flex: 1;
}

.headerActions {
  display: flex;
  gap: 7px;
}


/* =====================================================
   CHAT
===================================================== */

.chat {

  position: absolute;

  top: 100px;
  left: 0;
  right: 0;
  bottom: 120px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    55px
    18px
    150px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 4px;
}

.chat::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);

  border-radius: 10px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

  width: 100%;

  margin-bottom: 25px;

  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}


/* USER */

.user .bubble {

  max-width: 90%;

  padding:
    18px
    20px;

  border-radius: 23px;

  border-bottom-right-radius: 7px;

  font-size: 18px;

  line-height: 1.55;

  word-break: break-word;

  white-space: pre-wrap;

  background:
    linear-gradient(
      135deg,
      #8439e9,
      #c53bda
    );

  box-shadow:
    0 12px 35px
    rgba(131,48,255,.15);
}


/* ASSISTANT */

.assistant .bubble {

  max-width: 92%;

  padding:
    4px
    5px;

  background: transparent;

  border: 0;

  font-size: 18px;

  line-height: 1.7;

  word-break: break-word;

  white-space: normal;
}

.assistantLabel {

  display: block;

  color:
    #b13cff;

  font-size: 14px;

  font-weight: 800;

  letter-spacing: 6px;

  margin-bottom: 13px;
}

.assistantText {
  color: #f3f2f8;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyLogo {

  width: 90px;
  height: 90px;

  border-radius: 28px;

  background:
    linear-gradient(
      135deg,
      #8e30ff,
      #c33cff
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 50px;

  font-weight: 800;

  box-shadow:
    0 0 70px
    rgba(159,44,255,.30);

  margin-bottom: 25px;
}

.empty h1 {

  font-size: 28px;

  margin-bottom: 10px;
}

.empty p {

  color: var(--muted);

  font-size: 17px;
}


/* =====================================================
   INPUT
===================================================== */

.inputArea {

  position: absolute;

  left: 12px;
  right: 12px;

  bottom: 12px;

  z-index: 15;
}

.inputBox {

  min-height: 78px;

  border-radius: 25px;

  background:
    rgba(15,14,25,.96);

  border:
    1px solid
    rgba(255,255,255,.11);

  display: flex;

  align-items: center;

  padding: 7px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.35),

    0 0 35px
    rgba(135,35,255,.08);
}

.voiceButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.08);

  font-size: 28px;

  cursor: pointer;
}

.input {

  flex: 1;

  min-width: 0;

  background: transparent;

  border: 0;

  outline: 0;

  color: white;

  padding:
    0 10px;

  font-size: 17px;
}

.input::placeholder {
  color: #727181;
}

.sendButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );

  font-size: 31px;

  cursor: pointer;

  box-shadow:
    0 0 30px
    rgba(165,45,255,.25);
}

.sendButton:disabled {
  opacity: .45;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.58);

  backdrop-filter:
    blur(7px);

  z-index: 50;

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

.overlay.open {

  opacity: 1;

  pointer-events: auto;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  width:
    min(560px,88vw);

  background:
    linear-gradient(
      180deg,
      #0e0d19,
      #080710
    );

  border-right:
    1px solid
    rgba(255,255,255,.09);

  z-index: 60;

  transform:
    translateX(-105%);

  transition:
    transform
    .3s
    cubic-bezier(.22,.8,.25,1);

  padding: 22px;

  display: flex;

  flex-direction: column;
}

.sidebar.open {
  transform:
    translateX(0);
}

.sidebarHeader {

  display: flex;

  align-items: center;

  gap: 15px;

  margin-bottom: 35px;
}

.sidebarLogo {

  width: 58px;
  height: 58px;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9130ff,
      #c33cff
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 31px;

  font-weight: 800;
}

.sidebarBrand {

  font-size: 25px;

  font-weight: 800;

  letter-spacing: 7px;

  flex: 1;
}

.closeButton {

  width: 55px;
  height: 55px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.05);

  font-size: 32px;

  cursor: pointer;
}

.menuSectionTitle {

  font-size: 13px;

  letter-spacing: 5px;

  font-weight: 800;

  color: #858394;

  margin-bottom: 14px;
}

.menuItem {

  width: 100%;

  min-height: 65px;

  display: flex;

  align-items: center;

  gap: 20px;

  padding: 10px 15px;

  border-radius: 20px;

  background: transparent;

  cursor: pointer;

  text-align: left;

  font-size: 20px;

  font-weight: 600;

  transition: .2s;
}

.menuItem:hover,
.menuItem:active {

  background:
    rgba(255,255,255,.06);
}

.menuIcon {

  width: 45px;

  text-align: center;

  font-size: 29px;
}

.menuDivider {

  height: 1px;

  background:
    rgba(255,255,255,.07);

  margin: 20px 0;
}


/* =====================================================
   CHAT LIST
===================================================== */

.chatList {

  flex: 1;

  overflow-y: auto;

  padding-right: 5px;

  margin-top: 2px;
}

.chatList::-webkit-scrollbar {
  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);
}

.historyGroup {
  margin-bottom: 20px;
}

.historyDate {

  color: #747286;

  font-size: 12px;

  letter-spacing: 3px;

  font-weight: 800;

  margin:
    15px 8px 9px;
}

.historyItem {

  position: relative;

  width: 100%;

  padding:
    15px
    48px
    15px
    18px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.06);

  margin-bottom: 8px;

  cursor: pointer;

  transition: .2s;
}

.historyItem:hover {

  background:
    rgba(255,255,255,.055);
}

.historyItem.active {

  background:
    linear-gradient(
      135deg,
      rgba(155,53,255,.20),
      rgba(193,60,255,.10)
    );

  border-color:
    rgba(180,60,255,.30);
}

.historyTitle {

  font-size: 17px;

  font-weight: 650;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.historyTime {

  color: #727181;

  font-size: 12px;

  margin-top: 5px;
}

.historyMore {

  position: absolute;

  right: 8px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 38px;
  height: 38px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.045);

  color: #aaa8b6;

  font-size: 18px;

  cursor: pointer;
}

.noHistory {

  color: #666578;

  text-align: center;

  padding: 30px 10px;

  font-size: 15px;
}


/* =====================================================
   CONTEXT MENU
===================================================== */

.contextMenu {

  position: fixed;

  z-index: 100;

  width: 210px;

  background:
    #151421;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 18px;

  padding: 8px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {

  width: 100%;

  padding: 13px 15px;

  border-radius: 13px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 15px;
}

.contextItem:active {

  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {
  color: #ff687c;
}


/* =====================================================
   MODAL
===================================================== */

.modalOverlay {

  position: fixed;

  inset: 0;

  z-index: 200;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(10px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 25px;
}

.modalOverlay.open {
  display: flex;
}

.modal {

  width:
    min(500px,100%);

  background:
    #12111d;

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius: 28px;

  padding: 28px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.6);
}

.modal h2 {

  font-size: 24px;

  margin-bottom: 20px;
}

.modalInput {

  width: 100%;

  padding: 17px;

  border-radius: 17px;

  background:
    #090811;

  border:
    1px solid
    rgba(255,255,255,.10);

  outline: none;

  color: white;

  font-size: 17px;
}

.modalButtons {

  display: flex;

  gap: 10px;

  margin-top: 20px;
}

.modalButton {

  flex: 1;

  padding: 15px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.06);

  cursor: pointer;
}

.modalButton.primary {

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}

.modalButton.danger {
  background: #a92843;
}


/* =====================================================
   TYPING
===================================================== */

.typing {

  display: flex;

  gap: 6px;

  padding: 8px 2px;
}

.typing span {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    #b43cff;

  animation:
    typing 1.1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .30s;
}

@keyframes typing {

  0%,60%,100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width:601px) {

  .header {

    height: 130px;

    padding:
      30px 22px 18px;

    gap: 18px;
  }

  .menuButton,
  .iconButton,
  .logo {

    width: 70px;
    height: 70px;

    border-radius: 22px;
  }

  .logo {
    font-size: 38px;
  }

  .menuButton,
  .iconButton {
    font-size: 31px;
  }

  .brand {

    font-size: 37px;

    letter-spacing: 7px;
  }

  .chat {

    top: 130px;

    bottom: 125px;

    padding:
      70px
      25px
      160px;
  }

  .user .bubble {

    font-size: 21px;

    padding:
      23px
      27px;
  }

  .assistant .bubble {

    font-size: 21px;
  }

  .inputArea {

    left: 20px;
    right: 20px;

    bottom: 25px;
  }

  .inputBox {

    min-height: 92px;

    border-radius: 30px;

    padding: 10px;
  }

  .voiceButton,
  .sendButton {

    width: 70px;
    height: 70px;

    border-radius: 22px;
  }

  .input {

    font-size: 20px;
  }
}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <button
    class="menuButton"
    id="menuButton"
  >
    ☰
  </button>

  <div class="logo">
    A
  </div>

  <div class="brand">
    ASA
  </div>

  <div class="headerSpacer"></div>

  <div class="headerActions">

    <button
      class="iconButton"
      id="memoryButton"
    >
      🧠
    </button>

    <button
      class="iconButton"
      id="settingsButton"
    >
      ⚙️
    </button>

  </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<main
  class="chat"
  id="chat"
></main>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="inputArea">

  <div class="inputBox">

    <button
      class="voiceButton"
      id="voiceButton"
    >
      🎙️
    </button>

    <input
      class="input"
      id="messageInput"
      type="text"
      autocomplete="off"
      placeholder="ASA'ya bir şey sor..."
    >

    <button
      class="sendButton"
      id="sendButton"
    >
      ➤
    </button>

  </div>

</div>

</div>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebarHeader">

    <div class="sidebarLogo">
      A
    </div>

    <div class="sidebarBrand">
      ASA
    </div>

    <button
      class="closeButton"
      id="closeMenu"
    >
      ×
    </button>

  </div>


  <div class="menuSectionTitle">
    SOHBET
  </div>


  <button
    class="menuItem"
    id="newChatButton"
  >

    <span class="menuIcon">
      ＋
    </span>

    <span>
      Yeni Sohbet
    </span>

  </button>


  <button
    class="menuItem"
    id="showChatsButton"
  >

    <span class="menuIcon">
      💬
    </span>

    <span>
      Sohbetler
    </span>

  </button>


  <div class="menuDivider"></div>


  <div class="menuSectionTitle">
    ASA
  </div>


  <button
    class="menuItem"
    id="memoryMenuButton"
  >

    <span class="menuIcon">
      🧠
    </span>

    <span>
      Hafızam
    </span>

  </button>


  <button
    class="menuItem"
    id="settingsMenuButton"
  >

    <span class="menuIcon">
      ⚙️
    </span>

    <span>
      Ayarlar
    </span>

  </button>


  <div class="menuDivider"></div>


  <div
    class="chatList"
    id="chatList"
  ></div>

</aside>


<!-- =====================================================
     CONTEXT MENU
===================================================== -->

<div
  class="contextMenu"
  id="contextMenu"
>

  <button
    class="contextItem"
    id="renameButton"
  >
    ✏️ Başlığı değiştir
  </button>

  <button
    class="contextItem delete"
    id="deleteButton"
  >
    🗑️ Sohbeti sil
  </button>

</div>


<!-- =====================================================
     RENAME MODAL
===================================================== -->

<div
  class="modalOverlay"
  id="renameModal"
>

  <div class="modal">

    <h2>
      Sohbet başlığını değiştir
    </h2>

    <input
      class="modalInput"
      id="renameInput"
      type="text"
      maxlength="80"
      placeholder="Sohbet adı"
    >

    <div class="modalButtons">

      <button
        class="modalButton"
        id="renameCancel"
      >
        İptal
      </button>

      <button
        class="modalButton primary"
        id="renameSave"
      >
        Kaydet
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     DELETE MODAL
===================================================== -->

<div
  class="modalOverlay"
  id="deleteModal"
>

  <div class="modal">

    <h2>
      Sohbet silinsin mi?
    </h2>

    <p
      id="deleteText"
      style="
        color:#898796;
        line-height:1.5;
      "
    >
      Bu sohbet silinecek.
    </p>

    <div class="modalButtons">

      <button
        class="modalButton"
        id="deleteCancel"
      >
        İptal
      </button>

      <button
        class="modalButton danger"
        id="deleteConfirm"
      >
        Sil
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/chat";

const STORAGE_KEY =
  "asa_conversations_v2";

const ACTIVE_KEY =
  "asa_active_conversation_v2";


/* =====================================================
   STORAGE
===================================================== */

function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function getActiveId() {

  return localStorage.getItem(
    ACTIVE_KEY
  );

}


function setActiveId(id) {

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

}


function createId() {

  return (
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}


/* =====================================================
   STATE
===================================================== */

let conversationId =
  getActiveId();

let messages = [];

let selectedConversationId =
  null;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const contextMenu =
  document.getElementById(
    "contextMenu"
  );

const renameModal =
  document.getElementById(
    "renameModal"
  );

const renameInput =
  document.getElementById(
    "renameInput"
  );

const deleteModal =
  document.getElementById(
    "deleteModal"
  );


/* =====================================================
   CONVERSATION OBJECT
===================================================== */

function createConversation(
  firstMessage = ""
) {

  const id =
    createId();

  const conversation = {

    id,

    title:
      firstMessage
        ? generateTitle(firstMessage)
        : "Yeni Sohbet",

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages: []

  };

  const conversations =
    loadConversations();

  conversations.unshift(
    conversation
  );

  saveConversations(
    conversations
  );

  return conversation;

}


/* =====================================================
   GET CURRENT CONVERSATION
===================================================== */

function getConversation(id) {

  return loadConversations()
    .find(
      item =>
        item.id === id
    );

}


/* =====================================================
   SAVE CURRENT MESSAGES
===================================================== */

function saveCurrentMessages() {

  if (!conversationId) {
    return;
  }

  const conversations =
    loadConversations();

  const item =
    conversations.find(
      x =>
        x.id === conversationId
    );

  if (!item) {
    return;
  }

  item.messages =
    messages;

  item.updatedAt =
    Date.now();

  saveConversations(
    conversations
  );

}


/* =====================================================
   TITLE
===================================================== */

function generateTitle(text) {

  let title =
    String(text)
      .replace(/\s+/g," ")
      .trim();

  if (!title) {
    return "Yeni Sohbet";
  }

  title =
    title
      .replace(/[?!.]+$/g,"")
      .trim();

  if (title.length > 42) {

    title =
      title
        .slice(0,42)
        .trim() +
      "…";

  }

  return (
    title.charAt(0)
      .toUpperCase() +
    title.slice(1)
  );

}

/* =====================================================
   RENDER CHAT LIST
===================================================== */

function renderChatList() {

  const conversations =
    loadConversations()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

  chatList.innerHTML = "";

  if (!conversations.length) {

    chatList.innerHTML = `
      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>
    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );

      const key =
        date.toDateString();

      if (!groups[key]) {
        groups[key] = [];
      }

      groups[key].push(item);

    }
  );


  Object.entries(groups)
    .forEach(
      ([key,items]) => {

        const group =
          document.createElement(
            "div"
          );

        group.className =
          "historyGroup";


        const dateTitle =
          document.createElement(
            "div"
          );

        dateTitle.className =
          "historyDate";

        dateTitle.textContent =
          getDateLabel(key);

        group.appendChild(
          dateTitle
        );


        items.forEach(
          item => {

            const element =
              document.createElement(
                "div"
              );

            element.className =
              "historyItem";


            if (
              item.id ===
              conversationId
            ) {

              element.classList.add(
                "active"
              );

            }


            const title =
              document.createElement(
                "div"
              );

            title.className =
              "historyTitle";

            title.textContent =
              item.title ||
              "Yeni Sohbet";


            const time =
              document.createElement(
                "div"
              );

            time.className =
              "historyTime";

            time.textContent =
              formatTime(
                item.updatedAt
              );


            const more =
              document.createElement(
                "button"
              );

            more.className =
              "historyMore";

            more.type =
              "button";

            more.textContent =
              "•••";


            element.appendChild(
              title
            );

            element.appendChild(
              time
            );

            element.appendChild(
              more
            );


            /* SOHBETE TIKLA */

            element.addEventListener(
              "click",
              () => {

                openConversation(
                  item.id
                );

              }
            );


            /* ÜÇ NOKTA */

            more.addEventListener(
              "click",
              event => {

                event.preventDefault();

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              element
            );

          }
        );


        chatList.appendChild(
          group
        );

      }
    );

}


/* =====================================================
   DATE
===================================================== */

function getDateLabel(dateString) {

  const today =
    new Date();

  const date =
    new Date(dateString);

  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    today.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long"
      }
    )
    .toUpperCase();

}


function formatTime(timestamp) {

  if (!timestamp) {
    return "";
  }

  return new Date(timestamp)
    .toLocaleTimeString(
      "tr-TR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}

function showContextMenu(
  id,
  element
) {

  selectedConversationId =

  let left =
    rect.left - 175;

  let top =
    rect.bottom + 5;


  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth - 220
      )
    );


  top =
    Math.min(
      top,
      window.innerHeight - 120
    );


  contextMenu.style.left =
    left + "px";

  contextMenu.style.top =
    top + "px";


  contextMenu.classList.add(
    "open"
  );

}

  contextMenu.classList.remove(

/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(id) {

  const item =
    getConversation(id);


  if (!item) {
    return;
  }


  conversationId =
    id;

  setActiveId(id);


  selectedConversationId =
    null;


  closeContextMenu();


  /*
    Önce LOCAL mesajları göster.
    Böylece sohbet anında değişir.
  */

  messages =
    Array.isArray(item.messages)
      ? item.messages
      : [];


  renderMessages();

  renderChatList();

  closeMenu();


  /*
    Sonra API'den geçmişi güncelle.
  */

  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId: id,

              getHistory: true

            })

          }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;


      const conversations =
        loadConversations();


      const current =
        conversations.find(
          x =>
            x.id === id
        );


      if (current) {

        current.messages =
          messages;

        saveConversations(
          conversations
        );

      }


      /*
        Kullanıcı başka sohbete
        geçtiyse eski cevabı ekrana
        yazma.
      */

      if (
        conversationId === id
      ) {

        renderMessages();

      }

    }

  } catch {

    /*
      API geçmişi gelmezse
      LOCAL mesajlar zaten ekranda.
    */

  }

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  /*
    Eğer aktif sohbet yoksa
    otomatik oluştur.
  */

  if (!conversationId) {

    createNewConversation();

  }


  let item =
    getConversation(
      conversationId
    );


  if (!item) {

    const newConversation =
      createConversation(text);

    conversationId =
      newConversation.id;

    setActiveId(
      conversationId
    );

    item =
      newConversation;

  }


  /*
    İlk mesajda otomatik başlık.
  */

  if (
    item.title ===
    "Yeni Sohbet"
  ) {

    item.title =
      generateTitle(text);

  }


  input.value = "";

  sendButton.disabled =
    true;


  messages.push({

    role: "user",

    content: text

  });


  saveCurrentMessages();

  renderMessages();

  renderChatList();

  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId,

              messages: [
                {
                  role: "user",
                  content: text
                }
              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    const answer =
      data.answer ||
      "Şu anda cevap oluşturamadım.";


    messages.push({

      role: "assistant",

      content: answer

    });


    if (
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    }


    saveCurrentMessages();

    renderMessages();

    renderChatList();


  } catch(error) {

    removeTyping();


    messages.push({

      role: "assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    saveCurrentMessages();

    renderMessages();

    console.error(error);

  }


  sendButton.disabled =
    false;

  input.focus();

}

/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        const label =
          document.createElement(
            "span"
          );

        label.className =
          "assistantLabel";

        label.textContent =
          "ASA";


        const text =
          document.createElement(
            "div"
          );

        text.className =
          "assistantText";

        text.innerHTML =
          formatAnswer(
            message.content
          );


        bubble.appendChild(
          label
        );

        bubble.appendChild(
          text
        );

      } else {

        bubble.textContent =
          message.content;

      }


      row.appendChild(
        bubble
      );

      chat.appendChild(
        row
      );

    }
  );


  scrollToBottom();

}


/* =====================================================
   FORMAT ANSWER
===================================================== */

function formatAnswer(text) {

  let result =
    escapeHtml(
      String(text || "")
    );


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

      recognition.interimResults =
        false;

        () => {

          console.log(
            "Sesli giriş hatası."
          );

        };


      recognition.start();

    }
  );


/* =====================================================
   START
===================================================== */

function startApp() {

  /*
    Eski v1 verisini silmiyoruz.
    Yeni sistem kendi v2 alanını kullanıyor.
  */

  if (!conversationId) {

    const conversations =
      loadConversations();


    if (
      conversations.length
    ) {

      conversationId =
        conversations[0].id;

      setActiveId(
        conversationId
      );

    } else {

      createNewConversation();

      return;

    }

  }


  const item =
    getConversation(
      conversationId
    );


  if (!item) {

    createNewConversation();

    return;

  }


  messages =
    Array.isArray(item.messages)
      ? item.messages
      : [];


  renderMessages();

  renderChatList();

}


startApp();
