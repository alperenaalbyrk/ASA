<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #07090f;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ÜST BAR */

.header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #202532;
    background: #0a0d14;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9b5cff, #ff4fd8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    box-shadow: 0 0 20px rgba(155,92,255,.35);
}

.logo-text {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
}

.status {
    font-size: 12px;
    color: #66ff99;
}

/* SOHBET */

.chat {
    flex: 1;
    padding: 25px 18px 120px;
    overflow-y: auto;
}

.welcome {
    text-align: center;
    margin-top: 80px;
    margin-bottom: 40px;
}

.welcome h1 {
    font-size: 42px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #9b5cff, #ff4fd8);
    -webkit-background-clip: text;
    color: transparent;
}

.welcome p {
    color: #858b9b;
    font-size: 15px;
}

.message {
    display: flex;
    margin: 18px 0;
}

.message.asa {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 82%;
    padding: 14px 17px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 15px;
}

.asa .bubble {
    background: #111622;
    border: 1px solid #252c3b;
    border-bottom-left-radius: 5px;
}

.user .bubble {
    background: linear-gradient(135deg, #7146d9, #a448bd);
    border-bottom-right-radius: 5px;
}

/* ALT KISIM */

.input-area {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    padding: 15px;
    background: rgba(7,9,15,.94);
    border-top: 1px solid #202532;
    backdrop-filter: blur(15px);
}

.input-box {
    display: flex;
    gap: 10px;
    background: #111622;
    border: 1px solid #2b3242;
    border-radius: 17px;
    padding: 7px;
}

#messageInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 12px;
}

#messageInput::placeholder {
    color: #666d7d;
}

#sendButton {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #8b4dff, #d94fd5);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#sendButton:active {
    transform: scale(.94);
}

.info {
    text-align: center;
    color: #555c6b;
    font-size: 10px;
    margin-top: 8px;
}

/* MASAÜSTÜ */

@media (min-width: 701px) {
    body {
        background:
        radial-gradient(circle at top, #171027 0%, #07090f 45%);
    }

    .app {
        border-left: 1px solid #202532;
        border-right: 1px solid #202532;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            <div class="logo-circle">A</div>
            <div class="logo-text">ASA</div>
        </div>

        <div class="status">
            ● Çevrimiçi
        </div>

    </header>


    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <h1>ASA</h1>
            <p>Alperen'in kişisel yapay zekâ asistanı</p>
        </div>

    </main>


    <div class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                placeholder="ASA'ya bir şey sor..."
                autocomplete="off"
            >

            <button id="sendButton">➤</button>

        </div>

        <div class="info">
            ASA v0.1 • Kişisel Asistan
        </div>

    </div>

</div>


<script>

const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function addMessage(text, type) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // Geçici "düşünüyor" mesajı
    addMessage("ASA düşünüyor...", "asa");

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        // Son "ASA düşünüyor..." mesajını kaldır
        const messages = chat.querySelectorAll(".message");
        if (messages.length > 0) {
            messages[messages.length - 1].remove();
        }

        if (!response.ok) {
            throw new Error(data.error || "API bağlantısı başarısız.");
        }

        addMessage(data.answer, "asa");

    } catch (error) {
        const messages = chat.querySelectorAll(".message");
        if (messages.length > 0) {
            messages[messages.length - 1].remove();
        }

        addMessage(
            "Üzgünüm Alperen, şu anda yapay zekâ bağlantısında bir sorun oluştu. " +
            error.message,
            "asa"
        );
    }
}


button.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
