<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ASA — Kişisel Asistan</title>

<style>

:root {
    --bg: #05050b;
    --panel: rgba(15, 15, 27, 0.92);
    --panel2: rgba(20, 19, 35, 0.96);
    --border: rgba(255,255,255,.09);

    --purple: #a83cff;
    --purple2: #d348ff;
    --purple3: #792cff;

    --text: #f7f7fb;
    --muted: #9697a9;

    --user1: #7438e8;
    --user2: #c044d9;

    --danger: #ff4d67;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: 0;
    outline: 0;
    cursor: pointer;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(155, 48, 255, .18),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(101, 42, 255, .10),
            transparent 40%
        );

    pointer-events: none;
}

/* --------------------------------------------------
   APP
-------------------------------------------------- */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    position: relative;
    z-index: 1;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.header {
    height: 82px;
    min-height: 82px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid var(--border);

    background: rgba(5,5,11,.82);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    position: relative;
    z-index: 20;
}

.menu-btn,
.header-btn {
    width: 52px;
    height: 52px;

    border-radius: 17px;

    background: rgba(255,255,255,.035);

    border: 1px solid var(--border);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    transition: .2s;
}

.menu-btn:active,
.header-btn:active {
    transform: scale(.94);
}

.brand {
    display: flex;
    align-items: center;

    margin-left: 15px;

    gap: 14px;

    flex: 1;
}

.logo {
    width: 54px;
    height: 54px;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;
    font-weight: 900;

    color: white;

    background:
        linear-gradient(
            135deg,
            #a52cff,
            #e14bff
        );

    box-shadow:
        0 0 30px rgba(174,50,255,.35);
}

.brand-name {
    font-size: 31px;
    font-weight: 900;

    letter-spacing: 5px;
}

.header-actions {
    display: flex;
    gap: 9px;
}

/* --------------------------------------------------
   CHAT AREA
-------------------------------------------------- */

.chat-area {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 20px 15px 150px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}

.chat-area::-webkit-scrollbar {
    width: 4px;
}

.chat-area::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.14);
    border-radius: 10px;
}

/* --------------------------------------------------
   WELCOME
-------------------------------------------------- */

.welcome {
    padding: 8px 0 22px;
}

.welcome-title {
    font-size: 25px;
    font-weight: 800;

    margin-bottom: 6px;
}

.welcome-subtitle {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
}

/* --------------------------------------------------
   QUICK ACTIONS
-------------------------------------------------- */

.quick-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 22px;
}

.quick-card {
    min-height: 145px;

    padding: 20px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(23,22,40,.95),
            rgba(10,10,19,.95)
        );

    border: 1px solid var(--border);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 12px 40px rgba(0,0,0,.16);

    text-align: left;

    color: white;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.quick-card:active {
    transform: scale(.97);
}

.quick-card:hover {
    border-color: rgba(177,62,255,.35);

    box-shadow:
        0 0 30px rgba(144,44,255,.10);
}

.quick-icon {
    font-size: 31px;
    margin-bottom: 17px;
}

.quick-title {
    font-size: 19px;
    font-weight: 800;

    margin-bottom: 5px;
}

.quick-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
}

/* --------------------------------------------------
   MESSAGE
-------------------------------------------------- */

.message-row {
    width: 100%;

    display: flex;

    margin: 13px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message {
    max-width: 88%;

    padding: 16px 18px;

    border-radius: 23px;

    font-size: 16px;
    line-height: 1.62;

    overflow-wrap: anywhere;
    word-break: break-word;

    position: relative;
}

.message.user {
    color: white;

    background:
        linear-gradient(
            135deg,
            var(--user1),
            var(--user2)
        );

    border-bottom-right-radius: 7px;

    box-shadow:
        0 8px 28px rgba(132,47,255,.18);
}

.message.assistant {
    color: #f5f5f9;

    background:
        linear-gradient(
            145deg,
            rgba(19,19,32,.97),
            rgba(12,12,23,.97)
        );

    border: 1px solid rgba(255,255,255,.08);

    border-bottom-left-radius: 7px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.18);
}

.message-label {
    color: #b54aff;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 9px;
}

.message p {
    margin-bottom: 10px;
}

.message p:last-child {
    margin-bottom: 0;
}

.message ul {
    margin: 8px 0 8px 20px;
}

.message li {
    margin: 5px 0;
}

.message a {
    color: #c46cff;
    text-decoration: none;
}

.message a:hover {
    text-decoration: underline;
}

.message strong {
    font-weight: 800;
}

/* --------------------------------------------------
   THINKING
-------------------------------------------------- */

.thinking {
    display: flex;
    align-items: center;
    gap: 9px;

    color: var(--muted);

    font-size: 14px;

    margin: 10px 5px;
}

.thinking-dots {
    display: flex;
    gap: 4px;
}

.thinking-dots span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--purple);

    animation: pulse 1s infinite;
}

.thinking-dots span:nth-child(2) {
    animation-delay: .15s;
}

.thinking-dots span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes pulse {
    0%,100% {
        opacity: .25;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* --------------------------------------------------
   INPUT AREA
-------------------------------------------------- */

.input-area {
    position: absolute;

    left: 12px;
    right: 12px;
    bottom: 12px;

    z-index: 30;
}

.input-shell {
    display: flex;
    align-items: center;

    min-height: 72px;

    padding: 8px;

    border-radius: 25px;

    background:
        rgba(15,15,27,.94);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 15px 60px rgba(0,0,0,.45),
        0 0 40px rgba(131,38,255,.07);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
}

.voice-btn,
.send-btn {
    width: 54px;
    height: 54px;

    flex: 0 0 54px;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    color: white;

    transition: .2s;
}

.voice-btn {
    background: rgba(255,255,255,.045);
    border: 1px solid var(--border);
}

.voice-btn.listening {
    background: rgba(255,65,90,.15);
    border-color: rgba(255,65,90,.5);
}

.send-btn {
    background:
        linear-gradient(
            135deg,
            #9131ff,
            #c841ff
        );

    box-shadow:
        0 0 25px rgba(174,53,255,.25);
}

.voice-btn:active,
.send-btn:active {
    transform: scale(.92);
}

#messageInput {
    flex: 1;

    min-width: 0;

    height: 54px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    padding: 14px 12px;

    font-size: 16px;

    line-height: 26px;
}

#messageInput::placeholder {
    color: #747587;
}

/* --------------------------------------------------
   SIDE MENU
-------------------------------------------------- */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    opacity: 0;
    visibility: hidden;

    transition: .25s;

    z-index: 80;
}

.menu-overlay.open {
    opacity: 1;
    visibility: visible;
}

.side-menu {
    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    width: min(330px, 86vw);

    background:
        linear-gradient(
            180deg,
            #11101c,
            #080810
        );

    border-right: 1px solid var(--border);

    transform: translateX(-105%);

    transition: transform .28s ease;

    z-index: 90;

    padding: 25px 18px;

    box-shadow:
        20px 0 60px rgba(0,0,0,.35);
}

.side-menu.open {
    transform: translateX(0);
}

.menu-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 30px;
}

.menu-brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.menu-logo {
    width: 44px;
    height: 44px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 900;
    font-size: 22px;

    background:
        linear-gradient(
            135deg,
            #9d32ff,
            #df4dff
        );
}

.menu-title {
    font-weight: 900;
    letter-spacing: 3px;
}

.close-menu {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    background: rgba(255,255,255,.05);

    color: white;

    font-size: 22px;
}

.menu-section-title {
    color: #77788b;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;

    margin:
        20px 8px 9px;
}

.menu-item {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 13px;

    padding: 15px 13px;

    border-radius: 17px;

    color: #eee;

    background: transparent;

    text-align: left;

    margin-bottom: 5px;
}

.menu-item:hover,
.menu-item:active {
    background: rgba(166,55,255,.10);
}

.menu-item-icon {
    width: 34px;

    font-size: 21px;

    text-align: center;
}

.menu-item-text {
    font-size: 15px;
    font-weight: 650;
}

.menu-footer {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 25px;

    color: #5d5e70;

    font-size: 12px;

    text-align: center;
}

/* --------------------------------------------------
   MODAL
-------------------------------------------------- */

.modal-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.62);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;
    visibility: hidden;

    transition: .2s;

    z-index: 100;
}

.modal-overlay.open {
    opacity: 1;
    visibility: visible;
}

.modal {
    width: 100%;
    max-width: 430px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 23px;

    border-radius: 27px;

    background:
        linear-gradient(
            145deg,
            #171624,
            #0b0b13
        );

    border: 1px solid var(--border);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-title {
    font-size: 20px;
    font-weight: 850;
}

.modal-close {
    width: 40px;
    height: 40px;

    border-radius: 13px;

    background: rgba(255,255,255,.05);

    color: white;

    font-size: 20px;
}

.modal-text {
    color: #b0b1c0;

    line-height: 1.6;

    font-size: 14px;
}

.setting {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 0;

    border-bottom: 1px solid var(--border);
}

.setting:last-child {
    border-bottom: 0;
}

.setting-name {
    font-size: 15px;
    font-weight: 700;
}

.setting-desc {
    color: #7f8090;

    font-size: 12px;

    margin-top: 4px;
}

.danger-btn {
    margin-top: 18px;

    width: 100%;

    padding: 14px;

    border-radius: 15px;

    background: rgba(255,70,90,.10);

    border: 1px solid rgba(255,70,90,.25);

    color: #ff7183;

    font-weight: 700;
}

/* --------------------------------------------------
   CHAT LIST
-------------------------------------------------- */

.chat-list-item {
    padding: 15px;

    border-radius: 16px;

    background: rgba(255,255,255,.035);

    border: 1px solid var(--border);

    margin-bottom: 9px;

    cursor: pointer;
}

.chat-list-title {
    font-weight: 750;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-list-date {
    color: #747587;

    font-size: 11px;

    margin-top: 5px;
}

/* --------------------------------------------------
   TOAST
-------------------------------------------------- */

.toast {
    position: fixed;

    left: 50%;
    bottom: 100px;

    transform:
        translate(-50%, 20px);

    padding: 12px 17px;

    border-radius: 15px;

    background: rgba(20,20,31,.96);

    border: 1px solid var(--border);

    color: white;

    font-size: 13px;

    opacity: 0;
    visibility: hidden;

    transition: .25s;

    z-index: 200;

    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    visibility: visible;

    transform:
        translate(-50%, 0);
}

/* --------------------------------------------------
   MOBILE
-------------------------------------------------- */

@media (max-width: 600px) {

    .header {
        height: 76px;
        min-height: 76px;

        padding: 0 10px;
    }

    .menu-btn,
    .header-btn {
        width: 48px;
        height: 48px;

        border-radius: 16px;
    }

    .brand {
        margin-left: 10px;
        gap: 10px;
    }

    .logo {
        width: 48px;
        height: 48px;

        border-radius: 16px;
    }

    .brand-name {
        font-size: 27px;
        letter-spacing: 4px;
    }

    .header-actions {
        gap: 6px;
    }

    .quick-grid {
        gap: 9px;
    }

    .quick-card {
        min-height: 125px;

        padding: 16px;

        border-radius: 21px;
    }

    .quick-icon {
        font-size: 26px;
        margin-bottom: 11px;
    }

    .quick-title {
        font-size: 17px;
    }

    .quick-desc {
        font-size: 12px;
    }

    .message {
        max-width: 92%;

        font-size: 15.5px;

        padding: 14px 16px;
    }

    .input-area {
        left: 9px;
        right: 9px;
        bottom: 8px;
    }

    .input-shell {
        min-height: 68px;
        border-radius: 23px;
    }

    .voice-btn,
    .send-btn {
        width: 50px;
        height: 50px;

        flex-basis: 50px;

        border-radius: 17px;
    }

    #messageInput {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="menu-btn"
            id="menuButton"
            aria-label="Menü">
            ☰
        </button>

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div class="brand-name">
                ASA
            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                id="memoryButton"
                aria-label="Hafıza">
                🧠
            </button>

            <button
                class="header-btn"
                id="settingsButton"
                aria-label="Ayarlar">
                ⚙️
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main
        class="chat-area"
        id="chatArea">

        <section
            class="welcome"
            id="welcome">

            <div class="welcome-title">
                Hoş geldin Alperen.
            </div>

            <div class="welcome-subtitle">
                ASA burada. Ne yapmak istiyorsun?
            </div>

        </section>


        <!-- QUICK ACTIONS -->

        <section
            class="quick-grid"
            id="quickGrid">

            <button
                class="quick-card"
                data-prompt="Hafızanda benim hakkımda neler biliyorsun?">

                <div class="quick-icon">
                    🧠
                </div>

                <div class="quick-title">
                    Hafızam
                </div>

                <div class="quick-desc">
                    Benim hakkımda bildiklerin
                </div>

            </button>


            <button
                class="quick-card"
                data-prompt="Bana bugün için yaratıcı bir fikir üret.">

                <div class="quick-icon">
                    💡
                </div>

                <div class="quick-title">
                    Fikir üret
                </div>

                <div class="quick-desc">
                    Yeni bir şey düşünelim
                </div>

            </button>


            <button
                class="quick-card"
                data-prompt="Biraz sohbet edelim.">

                <div class="quick-icon">
                    💬
                </div>

                <div class="quick-title">
                    Sohbet
                </div>

                <div class="quick-desc">
                    Biraz konuşalım
                </div>

            </button>


            <button
                class="quick-card"
                data-prompt="Bana bugün oynayabileceğim güzel bir oyun öner.">

                <div class="quick-icon">
                    🎮
                </div>

                <div class="quick-title">
                    Oyun
                </div>

                <div class="quick-desc">
                    Oyun dünyasına geç
                </div>

            </button>

        </section>


        <div id="messages"></div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-shell">

            <button
                class="voice-btn"
                id="voiceButton"
                aria-label="Sesli giriş">
                🎙️
            </button>

            <textarea
                id="messageInput"
                rows="1"
                autocomplete="off"
                placeholder="ASA'ya bir şey sor..."></textarea>

            <button
                class="send-btn"
                id="sendButton"
                aria-label="Gönder">
                ➤
            </button>

        </div>

    </div>

</div>


<!-- SIDE MENU -->

<div
    class="menu-overlay"
    id="menuOverlay">
</div>

<aside
    class="side-menu"
    id="sideMenu">

    <div class="menu-top">

        <div class="menu-brand">

            <div class="menu-logo">
                A
            </div>

            <div class="menu-title">
                ASA
            </div>

        </div>

        <button
            class="close-menu"
            id="closeMenu">
            ×
        </button>

    </div>


    <div class="menu-section-title">
        SOHBET
    </div>


    <button
        class="menu-item"
        id="newChatButton">

        <div class="menu-item-icon">
            ＋
        </div>

        <div class="menu-item-text">
            Yeni Sohbet
        </div>

    </button>


    <button
        class="menu-item"
        id="chatsButton">

        <div class="menu-item-icon">
            💬
        </div>

        <div class="menu-item-text">
            Sohbetler
        </div>

    </button>


    <div class="menu-section-title">
        ASA
    </div>


    <button
        class="menu-item"
        id="menuMemoryButton">

        <div class="menu-item-icon">
            🧠
        </div>

        <div class="menu-item-text">
            Hafızam
        </div>

    </button>


    <button
        class="menu-item"
        id="menuSettingsButton">

        <div class="menu-item-icon">
            ⚙️
        </div>

        <div class="menu-item-text">
            Ayarlar
        </div>

    </button>


    <div class="menu-footer">
        ASA v1.0 • Alperen'in kişisel asistanı
    </div>

</aside>


<!-- MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay">

    <div
        class="modal"
        id="modal">

        <div class="modal-header">

            <div
                class="modal-title"
                id="modalTitle">
                ASA
            </div>

            <button
                class="modal-close"
                id="modalClose">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* ==================================================
   ASA FRONTEND
================================================== */

const API_URL = "/api/chat";

const STORAGE_CURRENT =
    "asa_current_conversation";

const STORAGE_CHATS =
    "asa_chat_list";


/* --------------------------------------------------
   ELEMENTLER
-------------------------------------------------- */

const chatArea =
    document.getElementById("chatArea");

const messagesElement =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const welcome =
    document.getElementById("welcome");

const quickGrid =
    document.getElementById("quickGrid");

const menuButton =
    document.getElementById("menuButton");

const closeMenu =
    document.getElementById("closeMenu");

const menuOverlay =

const sideMenu =
    document.getElementById("sideMenu");

const memoryButton =
    document.getElementById("memoryButton");

const settingsButton =
    document.getElementById("settingsButton");

const newChatButton =
    document.getElementById("newChatButton");

const chatsButton =
    document.getElementById("chatsButton");

const menuMemoryButton =
    document.getElementById("menuMemoryButton");

const menuSettingsButton =
    document.getElementById("menuSettingsButton");

const modalOverlay =
    document.getElementById("modalOverlay");

const modalClose =
    document.getElementById("modalClose");

const modalTitle =
    document.getElementById("modalTitle");

const modalContent =
    document.getElementById("modalContent");

const toast =
    document.getElementById("toast");


/* --------------------------------------------------
   STATE
-------------------------------------------------- */

let conversationId =
    localStorage.getItem(STORAGE_CURRENT);

let messages = [];

let isSending = false;


/* --------------------------------------------------
   ID OLUŞTUR
-------------------------------------------------- */

function createConversationId() {

    return (
        "chat-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2, 9)
    );

}


/* --------------------------------------------------
   CURRENT CHAT
-------------------------------------------------- */

function ensureConversation() {

    if (!conversationId) {

        conversationId =
            createConversationId();

        localStorage.setItem(
            STORAGE_CURRENT,
            conversationId
        );

    }

}


/* --------------------------------------------------
   CHAT LİSTESİ
-------------------------------------------------- */

function getChatList() {

    try {

        const list =
            JSON.parse(
                localStorage.getItem(STORAGE_CHATS) || "[]"
            );

        return Array.isArray(list)
            ? list
            : [];

    } catch {

        return [];

    }

}


function saveChatList(list) {

    localStorage.setItem(
        STORAGE_CHATS,
        JSON.stringify(list.slice(0, 30))
    );

}


function registerChat(title) {

    const list = getChatList();

    const existing =
        list.find(
            item =>
                item.id === conversationId
        );

    if (existing) {

        if (
            title &&
            title.trim() &&
            existing.title === "Yeni Sohbet"
        ) {
            existing.title =
                title.trim().slice(0, 60);
        }

        existing.updatedAt =
            Date.now();

    } else {

        list.unshift({
            id: conversationId,
            title:
                title?.trim()
                    ? title.trim().slice(0, 60)
                    : "Yeni Sohbet",
            updatedAt: Date.now()
        });

    }

    saveChatList(list);

}


/* --------------------------------------------------
   TOAST
-------------------------------------------------- */

let toastTimer;

function showToast(text) {

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2300);

}


/* --------------------------------------------------
   MENU
-------------------------------------------------- */

function openMenu() {

    menuOverlay.classList.add("open");

}

    sideMenu.classList.remove("open");

    menuOverlay.classList.remove("open");

}

/* --------------------------------------------------
   MODAL
-------------------------------------------------- */

function openModal(title, html) {

    modalContent.innerHTML = html;

}


function closeModal() {

    modalOverlay.classList.remove("open");

}


modalClose.addEventListener(

);

modalOverlay.addEventListener(
    "click",
    event => {

        if (event.target === modalOverlay) {
            closeModal();
        }

    }
);


/* --------------------------------------------------
   HTML ESCAPE
-------------------------------------------------- */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* --------------------------------------------------
   MARKDOWN BENZERİ GÖRÜNÜM
-------------------------------------------------- */

function formatAnswer(text) {

    let safe =
        escapeHtml(text || "");

    /*
      URL'leri tıklanabilir yap.
    */

    safe =
        safe.replace(
            /(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        );

    /*
      Kalın yazılar.
    */

    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    /*
      Satırları paragraf haline getir.
    */

    const lines =
        safe.split(/\n+/);

    let html = "";

    let inList = false;

    for (const rawLine of lines) {

        const line =
            rawLine.trim();

        if (!line) continue;


        if (
            line.startsWith("- ") ||
            line.startsWith("• ")
        ) {

            if (!inList) {

                html += "<ul>";
                inList = true;

            }

            html +=
                "<li>" +
                line.slice(2) +
                "</li>";

            continue;

        }


        if (inList) {

            html += "</ul>";
            inList = false;

        }


        html +=
            "<p>" +
            line +
            "</p>";

    }


    if (inList) {
        html += "</ul>";
    }


    return html;

}


/* --------------------------------------------------
   MESAJ EKLE
-------------------------------------------------- */

function addMessage(
    role,
    content,
    save = false
) {

    const row =
        document.createElement("div");

    row.className =
        "message-row " + role;


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " + role;


    if (role === "assistant") {

        bubble.innerHTML =
            '<div class="message-label">ASA</div>' +
            formatAnswer(content);

    } else {

        bubble.innerHTML =
            formatAnswer(content);

    }


    row.appendChild(bubble);

    messagesElement.appendChild(row);


    if (save) {

        messages.push({
            role,
            content
        });

    }

}


/* --------------------------------------------------
   GEÇMİŞİ RENDER
-------------------------------------------------- */

function renderHistory(history) {

    messagesElement.innerHTML = "";

    messages = [];


    if (
        !Array.isArray(history) ||
        history.length === 0
    ) {

        welcome.style.display = "";
        quickGrid.style.display = "";

        return;

    }


    welcome.style.display = "none";
    quickGrid.style.display = "none";


    for (const message of history) {

        if (
            !message ||
            !message.role ||
            !message.content
        ) {
            continue;
        }

        addMessage(
            message.role,
            message.content,
            true
        );

    }


    scrollToBottom();

}


/* --------------------------------------------------
   SCROLL
-------------------------------------------------- */

function scrollToBottom() {

    requestAnimationFrame(() => {

        chatArea.scrollTop =
            chatArea.scrollHeight;

    });

}


/* --------------------------------------------------
   THINKING
-------------------------------------------------- */

function showThinking() {

    removeThinking();

    const row =
        document.createElement("div");

    row.className =
        "message-row assistant";

    row.id =
        "thinkingRow";


    row.innerHTML = `
        <div class="message assistant">
            <div class="message-label">ASA</div>
            <div class="thinking">
                <div class="thinking-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span>Düşünüyor...</span>
            </div>
        </div>
    `;

    messagesElement.appendChild(row);

    scrollToBottom();

}


function removeThinking() {

    const element =
        document.getElementById(
            "thinkingRow"
        );

    if (element) {
        element.remove();
    }

}


/* --------------------------------------------------
   MESAJ GÖNDER
-------------------------------------------------- */

async function sendMessage(text = null) {

    if (isSending) return;


    const value =
        (
            text !== null
                ? text
                : messageInput.value
        )
        .trim();


    if (!value) return;


    ensureConversation();


    isSending = true;

    sendButton.style.opacity = ".55";


    /*
      Kullanıcı mesajını hemen göster.
    */

    welcome.style.display = "none";
    quickGrid.style.display = "none";


    addMessage(
        "user",
        value,
        true
    );


    /*
      İlk mesajı sohbet listesine kaydet.
    */

    if (messages.length === 1) {

        registerChat(value);

    } else {

        registerChat();

    }


    messageInput.value = "";

    autoResize();

    scrollToBottom();

    showThinking();


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        conversationId,

                        /*
                          Backend zaten Redis'ten
                          geçmişi alıyor.
                        */

                        messages: [
                            {
                                role: "user",
                                content: value
                            }
                        ]

                    })
                }
            );


        const data =
            await response.json();


        removeThinking();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "ASA API cevap vermedi."
            );

        }


        if (
            data.conversationId &&
            data.conversationId !== conversationId
        ) {

            conversationId =
                data.conversationId;

            localStorage.setItem(
                STORAGE_CURRENT,
                conversationId
            );

        }


        /*
          Backend'den gelen gerçek geçmişi
          tekrar state'e al.
        */

        if (
            Array.isArray(data.history)
        ) {

            messages =
                data.history;

        }


        /*
          Sadece cevabı ekrana ekle.

          Kullanıcı mesajı zaten ekranda.
        */

        if (data.answer) {

            addMessage(
                "assistant",
                data.answer,
                false
            );

        } else {

            addMessage(
                "assistant",
                "Şu anda cevap oluşturamadım.",
                false
            );

        }


        scrollToBottom();


    } catch (error) {

        removeThinking();


        addMessage(
            "assistant",
            "Bir bağlantı sorunu oluştu: " +
            error.message,
            false
        );


        showToast(
            "ASA bağlantısında sorun oluştu."
        );

    } finally {

        isSending = false;

        sendButton.style.opacity = "1";

    }

}


/* --------------------------------------------------
   SEND EVENTS
-------------------------------------------------- */

sendButton.addEventListener(
    "click",
    () => sendMessage()
);


messageInput.addEventListener(
    "keydown",
    event => {

        /*
          Enter gönderir.
          Shift + Enter yeni satır.
        */

        if (
            event.key === "Enter" &&
            !event.shiftKey

            event.preventDefault();

            sendMessage();

    }
);

-------------------------------------------------- */

}

-------------------------------------------------- */

document

/* --------------------------------------------------
   YENİ SOHBET
-------------------------------------------------- */

async function startNewChat() {

    if (isSending) {

        showToast(
            "Önce mevcut cevabın bitmesini bekle."
        );

        return;

    }


    /*
      Eski sohbet silinmiyor.

      Sadece yeni conversation ID oluşturuyoruz.
    */

    conversationId =
        createConversationId();


    localStorage.setItem(
        STORAGE_CURRENT,
        conversationId
    );


    messages = [];


    messagesElement.innerHTML = "";

    welcome.style.display = "";

    quickGrid.style.display = "";


    closeSideMenu();

    showToast(
        "Yeni sohbet hazır."
    );

}


newChatButton.addEventListener(
    "click",
    startNewChat
);


/* --------------------------------------------------
   SOHBETLER
-------------------------------------------------- */

async function showChats() {

    closeSideMenu();


    const list =
        getChatList();


    if (list.length === 0) {

        openModal(
            "Sohbetler",
            `
            <div class="modal-text">
                Henüz kayıtlı bir sohbet yok.
            </div>
            `
        );

        return;

    }


    let html = "";


    for (const chat of list) {

        const date =
            chat.updatedAt
                ? new Date(chat.updatedAt)
                    .toLocaleString("tr-TR")
                : "";


        html += `
            <div
                class="chat-list-item"
                data-chat-id="${escapeHtml(chat.id)}">

                <div class="chat-list-title">
                    ${escapeHtml(chat.title || "Sohbet")}
                </div>

                <div class="chat-list-date">
                    ${escapeHtml(date)}
                </div>

            </div>
        `;

    }


    openModal(
        "Sohbetler",
        html
    );


    document
        .querySelectorAll(".chat-list-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    const id =
                        item.dataset.chatId;

                    loadConversation(id);

                    closeModal();

                }
            );

        });

}


chatsButton.addEventListener(
    "click",
    showChats
);


/* --------------------------------------------------
   KONUŞMA YÜKLE
-------------------------------------------------- */

async function loadConversation(id) {

    conversationId = id;


    localStorage.setItem(
        STORAGE_CURRENT,
        conversationId
    );


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        conversationId,

                        getHistory: true,

                        messages: []

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "Geçmiş yüklenemedi."
            );

        }


        renderHistory(
            data.history || []
        );


        showToast(
            "Sohbet yüklendi."
        );


    } catch (error) {

        showToast(
            "Sohbet yüklenemedi."
        );

        console.error(error);

    }

}


/* --------------------------------------------------
   SAYFA AÇILINCA GEÇMİŞ
-------------------------------------------------- */

async function loadCurrentConversation() {

    ensureConversation();


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        conversationId,

                        getHistory: true,

                        messages: []

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "Geçmiş alınamadı."
            );

        }


        renderHistory(
            data.history || []
        );


    } catch (error) {

        console.error(
            "ASA geçmiş yükleme hatası:",
            error
        );

    }

}

/* --------------------------------------------------
   SESLİ GİRİŞ
-------------------------------------------------- */

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            voiceButton.classList.add(
                "listening"
            );

            showToast(
                "Dinliyorum..."
            );

        };


    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0].transcript;

            messageInput.value =
                transcript;

            autoResize();

        };


    recognition.onend =
        () => {

            voiceButton.classList.remove(
                "listening"
            );

        };


    recognition.onerror =
        () => {

            voiceButton.classList.remove(
                "listening"
            );

            showToast(
                "Sesli giriş kullanılamadı."
            );

        };


    voiceButton.addEventListener(
        "click",
        () => {

            try {

                recognition.start();

            } catch {

                recognition.stop();

            }

        }
    );

} else {

    voiceButton.addEventListener(
        "click",
        () => {

            showToast(
                "Bu tarayıcı sesli girişi desteklemiyor."
            );

        }
    );

}


/* --------------------------------------------------
   İLK AÇILIŞ
-------------------------------------------------- */

loadCurrentConversation();

   SAYFA GERİ GELDİĞİNDE
-------------------------------------------------- */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState === "visible"
        ) {

            /*
              Sayfa tekrar görünür olduğunda
              mevcut sohbeti Redis'ten kontrol et.

              Ancak kullanıcı mesaj yazıyorsa
              müdahale etme.
            */

            if (
                !isSending &&
                !messageInput.value.trim()
            ) {

                loadCurrentConversation();

            }

        }

    }
);
