<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>ASA</title>

<style>

/* =========================================================
   ASA — FINAL UI
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #05040a;
  --bg2: #080611;
  --panel: rgba(15,14,25,.94);
  --panel-solid: #11101a;

  --text: #f7f5fb;
  --muted: #8b8797;
  --muted2: #666272;

  --accent: #a331ff;
  --accent2: #c13cff;
  --accent3: #7021bd;

  --border: rgba(255,255,255,.095);
  --border-strong: rgba(255,255,255,.14);

  --radius: 24px;

  --font:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Avenir Next",
    "Segoe UI",
    sans-serif;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: var(--bg);
  color: var(--text);

  font-family: var(--font);

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  overscroll-behavior: none;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
  cursor: pointer;
}

button,
.historyItem,
.menuItem,
.iconButton {
  touch-action: manipulation;
}


/* =========================================================
   APP
========================================================= */

.app {
  position: relative;

  width: 100%;
  height: 100dvh;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 55% 8%,
      rgba(142,34,220,.18),
      transparent 31%
    ),
    radial-gradient(
      circle at 92% 76%,
      rgba(93,0,170,.13),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #05040a,
      #06040b
    );
}


/* =========================================================
   HEADER
========================================================= */

.header {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 108px;

  padding:
    calc(14px + env(safe-area-inset-top))
    22px
    12px;

  display: flex;
  align-items: center;

  gap: 17px;

  z-index: 30;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.99),
      rgba(5,4,10,.88)
    );

  border-bottom:
    1px solid rgba(255,255,255,.065);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}


/* =========================================================
   MENU BUTTON
========================================================= */

.menuButton {
  width: 58px;
  height: 58px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 19px;

  background:
    rgba(20,19,30,.74);

  border:
    1px solid var(--border);

  transition:
    transform .18s ease,
    background .18s ease;
}

.menuButton:active {
  transform: scale(.94);
}

.menuLines {
  width: 25px;
  height: 18px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.menuLines span {
  display: block;

  width: 25px;
  height: 2px;

  border-radius: 2px;

  background: #f4f1f8;
}


/* =========================================================
   ASA WORDMARK
========================================================= */

.brand {
  display: flex;
  align-items: center;

  user-select: none;
}

.brandText {
  font-family:
    "Avenir Next",
    "SF Pro Display",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 31px;
  line-height: 1;

  font-weight: 650;

  letter-spacing: .31em;

  color: #f7f4fa;

  transform: translateY(-1px);
}


/* =========================================================
   CHAT
========================================================= */

.chat {
  position: absolute;

  top: 108px;
  left: 0;
  right: 0;
  bottom: 101px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    34px
    24px
    150px;

  scroll-behavior: smooth;

  overscroll-behavior: contain;
}

.chat::-webkit-scrollbar {
  width: 3px;
}

.chat::-webkit-scrollbar-thumb {
  background:
    rgba(176,55,255,.30);

  border-radius: 10px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
  min-height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyOrb {
  width: 74px;
  height: 74px;

  margin-bottom: 25px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      rgba(255,255,255,.85),
      transparent 10%
    ),
    radial-gradient(
      circle at 52% 52%,
      #c33cff,
      #711db6 58%,
      #1d092d
    );

  box-shadow:
    0 0 55px rgba(163,48,255,.28);
}

.empty h1 {
  font-size: 28px;

  line-height: 1.2;

  font-weight: 650;

  letter-spacing: -.025em;

  margin-bottom: 10px;
}

.empty p {
  color: var(--muted);

  font-size: 17px;

  line-height: 1.5;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
  width: 100%;

  display: flex;

  margin-bottom: 27px;
}

.message.user {
  justify-content: flex-end;
}

.message.assistant {
  justify-content: flex-start;
}


/* USER */

.user .bubble {
  max-width: min(78%, 680px);

  padding:
    16px
    20px;

  border-radius:
    24px
    24px
    7px
    24px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color: #fff;

  font-size: 18px;

  line-height: 1.5;

  box-shadow:
    0 12px 35px
    rgba(126,37,235,.14);
}


/* ASSISTANT */

.assistant .bubble {
  max-width: min(92%, 820px);

  padding:
    4px
    0;

  background: transparent;

  font-size: 18px;

  line-height: 1.72;

  color: #f4f1f7;
}

.assistantLabel {
  display: block;

  margin-bottom: 13px;

  color: var(--accent2);

  font-size: 12px;

  font-weight: 700;

  letter-spacing: .48em;
}

.assistantText strong {
  font-weight: 700;
}

.assistantText a {
  color: var(--accent2);

  text-decoration: underline;
}


/* =========================================================
   IMAGE
========================================================= */

.messageImage {
  display: block;

  width: min(320px, 70vw);
  max-height: 420px;

  object-fit: cover;

  border-radius: 22px;

  margin-bottom: 9px;

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 14px 45px rgba(0,0,0,.28);
}


/* =========================================================
   TYPING
========================================================= */

.typing {
  display: flex;

  gap: 7px;

  padding-top: 2px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--accent2);

  animation:
    typing 1.15s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .14s;
}

.typing span:nth-child(3) {
  animation-delay: .28s;
}

@keyframes typing {

  0%,
  60%,
  100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }

}


/* =========================================================
   INPUT AREA
========================================================= */

.inputArea {
  position: absolute;

  left: 18px;
  right: 18px;

  bottom:
    calc(13px + env(safe-area-inset-bottom));

  z-index: 40;
}

.inputBox {
  min-height: 72px;

  display: flex;
  align-items: center;

  gap: 5px;

  padding: 7px 8px;

  border-radius: 25px;

  background:
    rgba(16,15,25,.95);

  border:
    1px solid rgba(255,255,255,.11);

  box-shadow:
    0 18px 55px rgba(0,0,0,.38),
    0 0 40px rgba(139,37,255,.07);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}


/* INPUT */

.input {
  flex: 1;

  min-width: 0;

  height: 54px;

  padding:
    0 11px;

  border: 0;
  outline: 0;

  background: transparent;

  color: #f7f4fa;

  font-size: 17px;

  font-weight: 450;

  letter-spacing: -.01em;
}

.input::placeholder {
  color: #777483;
}


/* =========================================================
   PLUS
========================================================= */

.plusButton {
  width: 54px;
  height: 54px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 29px;

  font-weight: 300;

  color: #f0edf5;

  transition: transform .18s ease;
}

.plusButton:active {
  transform: scale(.94);
}


/* =========================================================
   VOICE BUTTON
========================================================= */

.voiceButton {
  width: 52px;
  height: 52px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 17px;

  background: transparent;

  color: #e8e4ed;

  transition:
    transform .18s ease,
    color .18s ease;
}

.voiceButton:active {
  transform: scale(.94);
}

.voiceIcon {
  width: 20px;
  height: 26px;

  border:
    2px solid currentColor;

  border-radius: 12px;

  position: relative;
}

.voiceIcon::before {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -9px;

  width: 13px;
  height: 8px;

  transform: translateX(-50%);

  border-bottom:
    2px solid currentColor;

  border-left:
    2px solid transparent;

  border-right:
    2px solid transparent;

  border-radius:
    0 0 10px 10px;
}

.voiceIcon::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -14px;

  width: 2px;
  height: 6px;

  transform: translateX(-50%);

  background:
    currentColor;

  border-radius: 2px;
}


/* =========================================================
   SEND
========================================================= */

.sendButton {
  width: 52px;
  height: 52px;

  flex-shrink: 0;

  border-radius: 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;

  color: var(--accent2);

  font-size: 31px;

  font-weight: 300;

  line-height: 1;

  transition:
    transform .18s ease,
    opacity .18s ease;
}

.sendButton:active {
  transform: scale(.94);
}

.sendButton:disabled {
  opacity: .32;
}


/* =========================================================
   ATTACHMENT SHEET
========================================================= */

.sheetOverlay {
  position: fixed;

  inset: 0;

  z-index: 80;

  background:
    rgba(0,0,0,.60);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;

  pointer-events: none;

  transition: opacity .22s ease;
}

.sheetOverlay.open {
  opacity: 1;
  pointer-events: auto;
}

.attachmentSheet {
  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 14px;

  padding: 10px;

  border-radius: 27px;

  background:
    rgba(20,19,30,.98);

  border:
    1px solid rgba(255,255,255,.10);

  transform:
    translateY(25px);

  transition:
    transform .25s
    cubic-bezier(.22,.8,.25,1);

  box-shadow:
    0 30px 100px rgba(0,0,0,.60);
}

.sheetOverlay.open
.attachmentSheet {
  transform:
    translateY(0);
}

.sheetTitle {
  padding:
    13px
    12px
    10px;

  color: #777483;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .25em;
}

.sheetItem {
  width: 100%;

  min-height: 57px;

  padding:
    0 14px;

  display: flex;
  align-items: center;

  text-align: left;

  background: transparent;

  color: #f5f2f8;

  font-size: 17px;

  border-radius: 16px;
}

.sheetItem:active {
  background:
    rgba(255,255,255,.06);
}

.sheetCancel {
  width: 100%;

  height: 53px;

  margin-top: 7px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.06);

  color: #aaa7b5;

  font-size: 16px;
}


/* =========================================================
   MAIN OVERLAY
========================================================= */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 90;

  background:
    rgba(0,0,0,.58);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;

  pointer-events: none;

  transition: opacity .25s ease;
}

.overlay.open {
  opacity: 1;

  pointer-events: auto;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  z-index: 100;

  width: min(430px, 88vw);

  padding:
    calc(23px + env(safe-area-inset-top))
    20px
    calc(18px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      180deg,
      #0d0c17,
      #080710
    );

  border-right:
    1px solid rgba(255,255,255,.09);

  transform:
    translateX(-105%);

  transition:
    transform .3s
    cubic-bezier(.22,.8,.25,1);

  display: flex;
  flex-direction: column;

  box-shadow:
    30px 0 90px rgba(0,0,0,.35);
}

.sidebar.open {
  transform:
    translateX(0);
}


/* =========================================================
   SIDEBAR HEADER
========================================================= */

.sidebarHeader {
  display: flex;
  align-items: center;

  margin-bottom: 42px;
}

.sidebarBrand {
  flex: 1;

  font-family:
    "Avenir Next",
    "SF Pro Display",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 26px;

  font-weight: 650;

  letter-spacing: .30em;
}

.closeButton {
  width: 54px;
  height: 54px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.07);

  color: #eeeaf2;

  font-size: 30px;

  font-weight: 300;
}


/* =========================================================
   SIDEBAR SECTIONS
========================================================= */

.menuSectionTitle {
  color: #777484;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .35em;

  margin:
    0 8px 14px;
}

.menuItem {
  width: 100%;

  min-height: 59px;

  display: flex;
  align-items: center;

  gap: 17px;

  padding:
    0 12px;

  border-radius: 17px;

  background: transparent;

  text-align: left;

  color: #f3f0f6;

  font-size: 17px;

  font-weight: 550;

  transition:
    background .18s ease,
    transform .18s ease;
}

.menuItem:active {
  background:
    rgba(255,255,255,.06);

  transform: scale(.985);
}

.menuIcon {
  width: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #aaa6b5;

  font-size: 22px;

  font-weight: 300;
}

.menuDivider {
  height: 1px;

  margin:
    20px 8px;

  background:
    rgba(255,255,255,.075);
}


/* =========================================================
   CHAT LIST
========================================================= */

.chatList {
  flex: 1;

  overflow-y: auto;

  padding:
    0 2px;
}

.chatList::-webkit-scrollbar {
  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {
  background:
    rgba(172,52,255,.30);
}

.historyGroup {
  margin-bottom: 23px;
}

.historyDate {
  color: #666372;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .25em;

  margin:
    10px 8px;
}

.historyItem {
  position: relative;

  width: 100%;

  min-height: 70px;

  padding:
    13px
    52px
    13px
    15px;

  margin-bottom: 8px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid rgba(255,255,255,.055);

  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
}

.historyItem.active {
  background:
    linear-gradient(
      135deg,
      rgba(148,44,245,.18),
      rgba(81,21,130,.12)
    );

  border-color:
    rgba(169,51,255,.45);
}

.historyItem:active {
  transform:
    scale(.985);
}

.historyTitle {
  color: #f2eef6;

  font-size: 16px;

  font-weight: 550;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.historyTime {
  margin-top: 5px;

  color: #706d7c;

  font-size: 11px;
}

.historyMore {
  position: absolute;

  right: 9px;
  top: 50%;

  width: 38px;
  height: 38px;

  transform:
    translateY(-50%);

  border-radius: 13px;

  background:
    rgba(255,255,255,.045);

  color: #aaa7b4;

  font-size: 15px;
}

.noHistory {
  padding:
    30px 10px;

  text-align: center;

  color: #686574;

  font-size: 14px;
}

.sidebarFooter {
  padding-top: 15px;

  color: #555260;

  text-align: center;

  font-size: 11px;

  letter-spacing: .04em;
}


/* =========================================================
   CONTEXT MENU
========================================================= */

.contextMenu {
  position: fixed;

  z-index: 150;

  width: 205px;

  padding: 7px;

  border-radius: 18px;

  background:
    #161520;

  border:
    1px solid rgba(255,255,255,.10);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55);

  display: none;
}

.contextMenu.open {
  display: block;
}

.contextItem {
  width: 100%;

  padding:
    13px 14px;

  border-radius: 13px;

  background: transparent;

  color: #f2eff5;

  text-align: left;

  font-size: 14px;
}

.contextItem:active {
  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {
  color: #ff7183;
}


/* =========================================================
   MODALS
========================================================= */

.modalOverlay {
  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 22px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter: blur(11px);
  -webkit-backdrop-filter: blur(11px);
}

.modalOverlay.open {
  display: flex;
}

.modal {
  width: min(470px,100%);

  padding: 27px;

  border-radius: 27px;

  background:
    #12111d;

  border:
    1px solid rgba(255,255,255,.11);

  box-shadow:
    0 35px 100px rgba(0,0,0,.65);
}

.modal h2 {
  margin-bottom: 19px;

  font-size: 23px;

  line-height: 1.2;

  letter-spacing: -.02em;
}

.modalText {
  color: #898796;

  line-height: 1.55;

  margin-bottom: 5px;
}

.modalInput {
  width: 100%;

  height: 57px;

  padding:
    0 17px;

  border-radius: 17px;

  background:
    #090811;

  border:
    1px solid rgba(255,255,255,.09);

  outline: 0;

  color: #fff;

  font-size: 17px;
}

.modalButtons {
  display: flex;

  gap: 9px;

  margin-top: 18px;
}

.modalButton {
  flex: 1;

  height: 53px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.055);

  color: #f3eff7;
}

.modalButton.primary {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.modalButton.danger {
  background:
    #a72b45;
}


/* =========================================================
   SETTINGS
========================================================= */

.settingsList {
  display: flex;
  flex-direction: column;

  gap: 9px;
}

.settingOption {
  width: 100%;

  min-height: 59px;

  padding:
    0 15px;

  display: flex;
  align-items: center;

  justify-content: space-between;

  border-radius: 17px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.06);

  color: #f3eff7;

  text-align: left;

  font-size: 16px;
}

.settingOption.active {
  border-color:
    rgba(169,51,255,.55);

  background:
    rgba(148,44,245,.13);
}

.settingCheck {
  color: var(--accent2);

  font-size: 18px;
}


/* =========================================================
   VOICE MODE
========================================================= */

.voiceMode {
  position: fixed;

  inset: 0;

  z-index: 300;

  display: flex;
  flex-direction: column;

  align-items: center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(133,25,205,.18),
      transparent 32%
    ),
    #05040a;

  opacity: 0;

  pointer-events: none;

  transform:
    scale(.97);

  transition:
    opacity .3s ease,
    transform .3s ease;
}

.voiceMode.open {
  opacity: 1;

  pointer-events: auto;

  transform:
    scale(1);
}


/* =========================================================
   VOICE TOP
========================================================= */

.voiceTop {
  width: 100%;

  padding:
    calc(20px + env(safe-area-inset-top))
    22px
    0;

  display: flex;
  align-items: center;

  justify-content: space-between;
}

.voiceTopTitle {
  font-family:
    "Avenir Next",
    "SF Pro Display",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 17px;

  font-weight: 650;

  letter-spacing: .28em;
}

.voiceClose {
  width: 48px;
  height: 48px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.08);

  color: #f1edf5;

  font-size: 28px;
}


/* =========================================================
   VOICE CENTER
========================================================= */

.voiceCenter {
  flex: 1;

  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding-bottom: 8vh;
}


/* =========================================================
   ASA ORB
========================================================= */

.asaOrb {
  width: 190px;
  height: 190px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      rgba(255,255,255,.8),
      rgba(255,255,255,.1) 9%,
      transparent 20%
    ),
    radial-gradient(
      circle at 52% 52%,
      #d247ff 0%,
      #9c2fe9 30%,
      #57138d 64%,
      #170a27 100%
    );

  box-shadow:
    0 0 45px rgba(170,45,255,.32),
    0 0 120px rgba(128,27,208,.22);

  animation:
    orbIdle 3.6s ease-in-out infinite;
}

.asaOrb::before,
.asaOrb::after {
  content: "";

  position: absolute;

  inset: -22px;

  border-radius: 50%;

  border:
    1px solid rgba(181,66,255,.18);

  animation:
    orbRing 3.4s ease-in-out infinite;
}

.asaOrb::after {
  inset: -42px;

  border-color:
    rgba(164,52,255,.08);

  animation-delay:
    -.8s;
}

.orbCore {
  width: 60px;
  height: 60px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #e5b5ff 17%,
      #b735ff 45%,
      rgba(110,20,170,.15) 75%
    );

  box-shadow:
    0 0 35px rgba(224,161,255,.6);

  animation:
    corePulse 1.9s ease-in-out infinite;
}

.voiceMode.listening .asaOrb {
  animation:
    orbListening 1.15s ease-in-out infinite;
}

.voiceMode.speaking .asaOrb {
  animation:
    orbSpeaking .72s ease-in-out infinite;
}

@keyframes orbIdle {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.045);
  }

}

@keyframes orbListening {

  0%,100% {
    transform: scale(.97);
  }

  50% {
    transform: scale(1.1);
  }

}

@keyframes orbSpeaking {

  0%,100% {
    transform: scale(.94);
  }

  50% {
    transform: scale(1.13);
  }

}

@keyframes corePulse {

  0%,100% {
    transform: scale(.85);
    opacity: .82;
  }

  50% {
    transform: scale(1.12);
    opacity: 1;
  }

}

@keyframes orbRing {

  0%,100% {
    transform: scale(.96);
    opacity: .35;
  }

  50% {
    transform: scale(1.08);
    opacity: .8;
  }

}


/* =========================================================
   VOICE STATUS
========================================================= */

.voiceStatus {
  margin-top: 58px;

  min-height: 27px;

  color: #aaa6b4;

  font-size: 17px;

  font-weight: 500;

  text-align: center;
}

.voiceStatus strong {
  color: #f3eef7;
}


/* =========================================================
   VOICE CONTROL
========================================================= */

.voiceBottom {
  width: 100%;

  padding:
    0
    24px
    calc(30px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: center;
}

.voiceControl {
  width: 60px;
  height: 60px;

  border-radius: 21px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.10);

  align-items: center;
  justify-content: center;
}

.voiceControl.active {

  border-color:
    rgba(193,60,255,.40);

  background:
    rgba(163,49,255,.10);
}

.voiceControl .voiceIcon {
  transform:
    scale(.82);
}


/* =========================================================
   HIDDEN INPUTS
========================================================= */

.hiddenInput {
  position: fixed;

  width: 1px;
  height: 1px;

  opacity: 0;

  pointer-events: none;
}
