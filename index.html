<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>ASA</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #05040a;
  --panel: #0d0c16;
  --panel2: #12111d;
  --text: #f5f5fa;
  --muted: #858394;

  --purple: #9b35ff;
  --purple2: #c13cff;

  --border:
    rgba(255,255,255,.10);
}

html,
body {

  width: 100%;
  height: 100%;

  background: var(--bg);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow: hidden;
}

button,
input {

  font: inherit;
}

button {

  border: 0;
  color: inherit;
}


/* =====================================================
   APP
===================================================== */

.app {

  position: relative;

  width: 100%;
  height: 100dvh;

  overflow: hidden;

  background:

    radial-gradient(
      circle at 50% 10%,
      rgba(130,30,200,.20),
      transparent 35%
    ),

    radial-gradient(
      circle at 85% 70%,
      rgba(90,0,160,.14),
      transparent 35%
    ),

    #05040a;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 100px;

  padding:
    15px
    14px;

  display: flex;

  align-items: center;

  gap: 11px;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.99),
      rgba(5,4,10,.91)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  z-index: 30;
}

.menuButton,
.headerButton {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  background:
    rgba(18,17,29,.88);

  border:
    1px solid
    rgba(255,255,255,.10);

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition: .2s;
}

.menuButton {

  font-size: 25px;
}

.headerButton {

  font-size: 27px;
}

.menuButton:active,
.headerButton:active {

  transform:
    scale(.94);
}

.logo {

  width: 58px;
  height: 58px;

  flex-shrink: 0;

  border-radius: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8d2fff,
      #c53cff
    );

  box-shadow:
    0 0 30px
    rgba(163,45,255,.32);

  font-size: 31px;

  font-weight: 800;
}

.brand {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 6px;
}

.headerSpacer {

  flex: 1;
}

.headerActions {

  display: flex;

  gap: 7px;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat {

  position: absolute;

  top: 100px;
  left: 0;
  right: 0;
  bottom: 94px;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    38px
    18px
    35px;

  scroll-behavior: smooth;

  -webkit-overflow-scrolling: touch;
}

.chat::-webkit-scrollbar {

  width: 3px;
}

.chat::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);

  border-radius: 10px;
}


/* =====================================================
   MESSAGES
===================================================== */

.message {

  width: 100%;

  margin-bottom: 24px;

  display: flex;
}

.message.user {

  justify-content: flex-end;
}

.message.assistant {

  justify-content: flex-start;
}


/* USER */

.user .bubble {

  max-width: 88%;

  padding:
    14px
    18px;

  border-radius: 22px;

  border-bottom-right-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #8b36ed,
      #c33bd8
    );

  box-shadow:
    0 10px 30px
    rgba(130,45,255,.14);

  font-size: 18px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}


/* ASSISTANT */

.assistant .bubble {

  max-width: 94%;

  background: transparent;

  font-size: 18px;

  line-height: 1.65;

  word-break: break-word;
}

.assistantLabel {

  display: block;

  color:
    #b13cff;

  font-size: 13px;

  font-weight: 800;

  letter-spacing: 6px;

  margin-bottom: 9px;
}

.assistantText {

  color:
    #f2f1f7;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 30px;
}

.emptyLogo {

  width: 86px;
  height: 86px;

  border-radius: 27px;

  background:
    linear-gradient(
      135deg,
      #8e30ff,
      #c33cff
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 48px;

  font-weight: 800;

  box-shadow:
    0 0 65px
    rgba(159,44,255,.28);

  margin-bottom: 22px;
}

.empty h1 {

  font-size: 27px;

  margin-bottom: 9px;
}

.empty p {

  color:
    var(--muted);

  font-size: 17px;
}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea {

  position: absolute;

  left: 12px;
  right: 12px;

  bottom:
    calc(
      12px + env(safe-area-inset-bottom)
    );

  z-index: 25;

  transition:
    bottom .15s ease;
}


/* =====================================================
   INPUT BOX
===================================================== */

.inputBox {

  min-height: 66px;

  width: 100%;

  border-radius: 24px;

  background:
    rgba(15,14,25,.96);

  border:
    1px solid
    rgba(255,255,255,.11);

  display: flex;

  align-items: center;

  padding:
    6px 7px;

  box-shadow:
    0 12px 45px
    rgba(0,0,0,.40),

    0 0 30px
    rgba(135,35,255,.07);
}


/* =====================================================
   PLUS
===================================================== */

.plusButton {

  width: 50px;
  height: 50px;

  flex-shrink: 0;

  border-radius: 17px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 28px;

  font-weight: 300;

  cursor: pointer;

  transition: .2s;
}

.plusButton:active {

  transform:
    scale(.92);
}


/* =====================================================
   INPUT
===================================================== */

.input {

  flex: 1;

  min-width: 0;

  height: 50px;

  background: transparent;

  border: 0;

  outline: 0;

  color: white;

  padding:
    0 12px;

  font-size: 17px;
}

.input::placeholder {

  color:
    #777583;
}


/* =====================================================
   RIGHT ACTIONS
===================================================== */

.inputActions {

  display: flex;

  align-items: center;

  gap: 5px;
}

.voiceButton,
.sendButton {

  width: 50px;
  height: 50px;

  flex-shrink: 0;

  border-radius: 17px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition: .2s;
}

.voiceButton {

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  font-size: 21px;
}

.sendButton {

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );

  font-size: 25px;

  box-shadow:
    0 0 25px
    rgba(165,45,255,.20);
}

.voiceButton:active,
.sendButton:active {

  transform:
    scale(.92);
}

.sendButton:disabled {

  opacity: .4;
}


/* =====================================================
   ATTACHMENT MENU
===================================================== */

.attachMenu {

  position: absolute;

  left: 4px;

  bottom: 76px;

  width: 175px;

  padding: 7px;

  border-radius: 20px;

  background:
    rgba(20,18,31,.98);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

  opacity: 0;

  transform:
    translateY(8px)
    scale(.96);

  pointer-events: none;

  transition:
    .18s ease;

  z-index: 40;
}

.attachMenu.open {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.attachItem {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 12px;

  padding:
    12px;

  border-radius: 14px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 15px;
}

.attachItem:active {

  background:
    rgba(255,255,255,.06);
}

.attachIcon {

  width: 32px;

  text-align: center;

  font-size: 21px;
}


/* =====================================================
   HIDDEN FILE INPUT
===================================================== */

.hiddenFile {

  display: none;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.60);

  backdrop-filter:
    blur(8px);

  z-index: 50;

  opacity: 0;

  pointer-events: none;

  transition: .22s;
}

.overlay.open {

  opacity: 1;

  pointer-events: auto;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  width:
    min(560px,88vw);

  background:
    linear-gradient(
      180deg,
      #0e0d19,
      #080710
    );

  border-right:
    1px solid
    rgba(255,255,255,.09);

  z-index: 60;

  transform:
    translateX(-105%);

  transition:
    transform .30s
    cubic-bezier(.22,.8,.25,1);

  padding:
    22px;

  display: flex;

  flex-direction: column;

  overflow: hidden;
}

.sidebar.open {

  transform:
    translateX(0);
}


/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebarHeader {

  display: flex;

  align-items: center;

  gap: 15px;

  flex-shrink: 0;

  margin-bottom: 32px;
}

.sidebarLogo {

  width: 58px;
  height: 58px;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9130ff,
      #c33cff
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 31px;

  font-weight: 800;
}

.sidebarBrand {

  flex: 1;

  font-size: 25px;

  font-weight: 800;

  letter-spacing: 7px;
}

.closeButton {

  width: 55px;
  height: 55px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.05);

  font-size: 32px;

  cursor: pointer;
}


/* =====================================================
   SIDEBAR MENU
===================================================== */

.menuSectionTitle {

  flex-shrink: 0;

  font-size: 12px;

  letter-spacing: 5px;

  font-weight: 800;

  color:
    #858394;

  margin-bottom: 10px;
}

.menuItem {

  width: 100%;

  min-height: 64px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  gap: 18px;

  padding:
    9px 14px;

  border-radius: 20px;

  background: transparent;

  cursor: pointer;

  text-align: left;

  font-size: 19px;

  font-weight: 600;

  transition: .2s;
}

.menuItem.active {

  background:
    rgba(255,255,255,.065);
}

.menuItem:active {

  background:
    rgba(255,255,255,.08);
}

.menuIcon {

  width: 43px;

  text-align: center;

  font-size: 27px;
}

.menuDivider {

  height: 1px;

  flex-shrink: 0;

  background:
    rgba(255,255,255,.07);

  margin:
    18px 0;
}


/* =====================================================
   CHAT HISTORY PANEL
===================================================== */

.historyPanel {

  position: absolute;

  top: 108px;

  left: 16px;
  right: 16px;

  bottom: 16px;

  padding: 18px;

  border-radius: 25px;

  background:
    rgba(14,13,24,.98);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.50);

  z-index: 80;

  display: flex;

  flex-direction: column;

  opacity: 0;

  transform:
    translateY(10px)
    scale(.98);

  pointer-events: none;

  transition:
    .20s ease;
}

.historyPanel.open {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.historyPanelHeader {

  display: flex;

  align-items: center;

  margin-bottom: 15px;
}

.historyPanelTitle {

  flex: 1;

  font-size: 20px;

  font-weight: 750;
}

.historyClose {

  width: 40px;
  height: 40px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.05);

  font-size: 22px;

  cursor: pointer;
}

.chatList {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding-right: 3px;
}

.chatList::-webkit-scrollbar {

  width: 3px;
}

.chatList::-webkit-scrollbar-thumb {

  background:
    rgba(180,60,255,.35);

  border-radius: 10px;
}


/* =====================================================
   HISTORY ITEM
===================================================== */

.historyGroup {

  margin-bottom: 18px;
}

.historyDate {

  color:
    #747286;

  font-size: 11px;

  letter-spacing: 3px;

  font-weight: 800;

  margin:
    12px 7px 8px;
}

.historyItem {

  position: relative;

  width: 100%;

  min-height: 68px;

  padding:
    13px
    50px
    13px
    15px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.06);

  margin-bottom: 8px;

  cursor: pointer;

  transition: .18s;
}

.historyItem.active {

  background:
    linear-gradient(
      135deg,
      rgba(155,53,255,.20),
      rgba(193,60,255,.08)
    );

  border-color:
    rgba(180,60,255,.32);
}

.historyTitle {

  font-size: 16px;

  font-weight: 650;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.historyTime {

  color:
    #727181;

  font-size: 11px;

  margin-top: 4px;
}

.historyMore {

  position: absolute;

  right: 8px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 38px;
  height: 38px;

  border-radius: 13px;

  background:
    rgba(255,255,255,.045);

  color:
    #aaa8b6;

  font-size: 17px;

  cursor: pointer;
}

.noHistory {

  color:
    #666578;

  text-align: center;

  padding:
    35px 10px;

  font-size: 14px;
}


/* =====================================================
   CONTEXT MENU
===================================================== */

.contextMenu {

  position: fixed;

  z-index: 150;

  width: 210px;

  background:
    #151421;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 18px;

  padding: 8px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

  display: none;
}

.contextMenu.open {

  display: block;
}

.contextItem {

  width: 100%;

  padding:
    13px 15px;

  border-radius: 13px;

  background: transparent;

  text-align: left;

  cursor: pointer;

  font-size: 15px;
}

.contextItem:active {

  background:
    rgba(255,255,255,.06);
}

.contextItem.delete {

  color:
    #ff687c;
}


/* =====================================================
   MODALS
===================================================== */

.modalOverlay {

  position: fixed;

  inset: 0;

  z-index: 200;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(10px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 25px;
}

.modalOverlay.open {

  display: flex;
}

.modal {

  width:
    min(500px,100%);

  background:
    #12111d;

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius: 28px;

  padding: 28px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.60);
}

.modal h2 {

  font-size: 24px;

  margin-bottom: 20px;
}

.modalInput {

  width: 100%;

  padding: 17px;

  border-radius: 17px;

  background:
    #090811;

  border:
    1px solid
    rgba(255,255,255,.10);

  outline: none;

  color: white;

  font-size: 17px;
}

.modalButtons {

  display: flex;

  gap: 10px;

  margin-top: 20px;
}

.modalButton {

  flex: 1;

  padding: 15px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.06);

  cursor: pointer;
}

.modalButton.primary {

  background:
    linear-gradient(
      135deg,
      #9633ff,
      #c03cff
    );
}

.modalButton.danger {

  background:
    #a92843;
}


/* =====================================================
   TYPING
===================================================== */

.typing {

  display: flex;

  gap: 6px;

  padding: 8px 2px;
}

.typing span {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    #b43cff;

  animation:
    typing 1.1s infinite;
}

.typing span:nth-child(2) {

  animation-delay:
    .15s;
}

.typing span:nth-child(3) {

  animation-delay:
    .30s;
}

@keyframes typing {

  0%,60%,100% {

    opacity: .25;

    transform:
      translateY(0);
  }

  30% {

    opacity: 1;

    transform:
      translateY(-4px);
  }
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width:601px) {

  .header {

    height: 130px;

    padding:
      30px 22px 18px;

    gap: 18px;
  }

  .menuButton,
  .headerButton,
  .logo {

    width: 70px;
    height: 70px;

    border-radius: 22px;
  }

  .menuButton,
  .headerButton {

    font-size: 30px;
  }

  .logo {

    font-size: 38px;
  }

  .brand {

    font-size: 37px;

    letter-spacing: 7px;
  }

  .chat {

    top: 130px;

    bottom: 105px;

    padding:
      55px 25px 35px;
  }

  .user .bubble {

    font-size: 21px;

    padding:
      18px 24px;
  }

  .assistant .bubble {

    font-size: 21px;
  }

  .inputArea {

    left: 20px;
    right: 20px;

    bottom: 20px;
  }

  .inputBox {

    min-height: 78px;

    border-radius: 27px;
  }

  .plusButton,
  .voiceButton,
  .sendButton {

    width: 60px;
    height: 60px;

    border-radius: 19px;
  }

  .input {

    font-size: 19px;
  }
}

</style>
</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <button
    class="menuButton"
    id="menuButton"
    aria-label="Menü"
  >
    ☰
  </button>


  <div class="logo">
    A
  </div>


  <div class="brand">
    ASA
  </div>


  <div class="headerSpacer"></div>


  <div class="headerActions">

    <button
      class="headerButton"
      id="memoryButton"
    >
      🧠
    </button>


    <button
      class="headerButton"
      id="settingsButton"
    >
      ⚙️
    </button>

  </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<main
  class="chat"
  id="chat"
></main>


<!-- =====================================================
     INPUT
===================================================== -->

<div
  class="inputArea"
  id="inputArea"
>


  <!-- ATTACH MENU -->

  <div
    class="attachMenu"
    id="attachMenu"
  >

    <button
      class="attachItem"
      id="fileButton"
    >

      <span class="attachIcon">
        📎
      </span>

      <span>
        Dosya yükle
      </span>

    </button>


    <button
      class="attachItem"
      id="cameraButton"
    >

      <span class="attachIcon">
        📷
      </span>

      <span>
        Kamera
      </span>

    </button>

  </div>


  <div class="inputBox">


    <!-- PLUS -->

    <button
      class="plusButton"
      id="plusButton"
      aria-label="Ekle"
    >
      +
    </button>


    <!-- INPUT -->

    <input
      class="input"
      id="messageInput"
      type="text"
      autocomplete="off"
      placeholder="ASA'ya bir şey sor..."
    >


    <!-- RIGHT -->

    <div class="inputActions">


      <button
        class="voiceButton"
        id="voiceButton"
        aria-label="Sesli giriş"
      >
        🎙
      </button>


      <button
        class="sendButton"
        id="sendButton"
        aria-label="Gönder"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     FILE INPUTS
===================================================== -->

<input
  type="file"
  id="fileInput"
  class="hiddenFile"
  multiple
>

<input
  type="file"
  id="cameraInput"
  class="hiddenFile"
  accept="image/*"
  capture="environment"
>


</div>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
  class="overlay"
  id="overlay"
></div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  class="sidebar"
  id="sidebar"
>


  <div class="sidebarHeader">

    <div class="sidebarLogo">
      A
    </div>

    <div class="sidebarBrand">

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "/api/chat";


const STORAGE_KEY =
  "asa_conversations_v3";


const ACTIVE_KEY =
  "asa_active_conversation_v3";


/* =====================================================
   STORAGE
===================================================== */

function loadConversations() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(
  conversations
) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      conversations
    )
  );

}


function getActiveId() {

  return localStorage.getItem(
    ACTIVE_KEY
  );

}


function setActiveId(id) {

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

}


function createId() {

  return (
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}


/* =====================================================
   STATE
===================================================== */

let conversationId =
  getActiveId();

let messages = [];

let selectedConversationId =
  null;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById(
    "chat"
  );


const input =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const sidebar =
  document.getElementById(
    "sidebar"
  );


const overlay =
  document.getElementById(
    "overlay"
  );


const contextMenu =
  document.getElementById(
    "contextMenu"
  );


const historyPanel =
  document.getElementById(
    "historyPanel"
  );


const attachMenu =
  document.getElementById(
    "attachMenu"
  );


const inputArea =
  document.getElementById(
    "inputArea"
  );


/* =====================================================
   CONVERSATIONS
===================================================== */

function createConversation(
  firstMessage = ""
) {

  const conversation = {

    id:
      createId(),

    title:
      firstMessage
        ? generateTitle(
            firstMessage
          )
        : "Yeni Sohbet",

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages: []

  };


  const conversations =
    loadConversations();


  conversations.unshift(
    conversation
  );


  saveConversations(
    conversations
  );


  return conversation;

}


function getConversation(id) {

  return loadConversations()
    .find(
      item =>
        item.id === id
    );

}


function saveCurrentMessages() {

  if (!conversationId) {
    return;
  }


  const conversations =
    loadConversations();


  const item =
    conversations.find(
      x =>
        x.id === conversationId
    );


  if (!item) {
    return;
  }


  item.messages =
    messages;


  item.updatedAt =
    Date.now();


  saveConversations(
    conversations
  );

}


/* =====================================================
   TITLE
===================================================== */

function generateTitle(text) {

  let title =
    String(text)
      .replace(/\s+/g," ")
      .trim();


  if (!title) {
    return "Yeni Sohbet";
  }


  title =
    title
      .replace(/[?!.]+$/g,"")
      .trim();


  if (title.length > 42) {

    title =
      title.slice(0,42)
        .trim() +
      "…";

  }


  return (
    title.charAt(0)
      .toUpperCase() +
    title.slice(1)
  );

}


/* =====================================================
   MENU
===================================================== */

function openMenu() {

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

}


function closeMenu() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

  closeHistory();

  closeContextMenu();

}


document
  .getElementById(
    "menuButton"
  )
  .addEventListener(
    "click",
    openMenu
  );


document
  .getElementById(
    "closeMenu"
  )
  .addEventListener(
    "click",
    closeMenu
  );


overlay.addEventListener(
  "click",
  closeMenu
);


/* =====================================================
   CHAT PANEL
===================================================== */

function openHistory() {

  renderChatList();

  historyPanel.classList.add(
    "open"
  );


  document
    .getElementById(
      "showChatsButton"
    )
    .classList.add(
      "active"
    );

}


function closeHistory() {

  historyPanel.classList.remove(
    "open"
  );


  document
    .getElementById(
      "showChatsButton"
    )
    .classList.remove(
      "active"
    );

}


document
  .getElementById(
    "showChatsButton"
  )
  .addEventListener(
    "click",
    openHistory
  );


document
  .getElementById(
    "historyClose"
  )
  .addEventListener(
    "click",
    closeHistory
  );


/* =====================================================
   CHAT LIST
===================================================== */

function renderChatList() {

  const list =
    document.getElementById(
      "chatList"
    );


  const conversations =
    loadConversations()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


  list.innerHTML = "";


  if (!conversations.length) {

    list.innerHTML = `

      <div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>

    `;

    return;

  }


  const groups = {};


  conversations.forEach(
    item => {

      const date =
        new Date(
          item.updatedAt ||
          item.createdAt
        );


      const key =
        date.toDateString();


      if (!groups[key]) {

        groups[key] = [];

      }


      groups[key].push(
        item
      );

    }
  );


  Object.entries(groups)
    .forEach(
      ([key,items]) => {

        const group =
          document.createElement(
            "div"
          );


        group.className =
          "historyGroup";


        const dateTitle =
          document.createElement(
            "div"
          );


        dateTitle.className =
          "historyDate";


        dateTitle.textContent =
          getDateLabel(key);


        group.appendChild(
          dateTitle
        );


        items.forEach(
          item => {

            const element =
              document.createElement(
                "div"
              );


            element.className =
              "historyItem";


            if (
              item.id ===
              conversationId
            ) {

              element.classList.add(
                "active"
              );

            }


            const title =
              document.createElement(
                "div"
              );


            title.className =
              "historyTitle";


            title.textContent =
              item.title ||
              "Yeni Sohbet";


            const time =
              document.createElement(
                "div"
              );


            time.className =
              "historyTime";


            time.textContent =
              formatTime(
                item.updatedAt
              );


            const more =
              document.createElement(
                "button"
              );


            more.className =
              "historyMore";


            more.type =
              "button";


            more.textContent =
              "•••";


            element.appendChild(
              title
            );


            element.appendChild(
              time
            );


            element.appendChild(
              more
            );


            element.addEventListener(
              "click",
              () => {

                openConversation(
                  item.id
                );

              }
            );


            more.addEventListener(
              "click",
              event => {

                event.preventDefault();

                event.stopPropagation();

                showContextMenu(
                  item.id,
                  more
                );

              }
            );


            group.appendChild(
              element
            );

          }
        );


        list.appendChild(
          group
        );

      }
    );

}


/* =====================================================
   DATE
===================================================== */

function getDateLabel(
  dateString
) {

  const today =
    new Date();


  const date =
    new Date(
      dateString
    );


  const yesterday =
    new Date();


  yesterday.setDate(
    yesterday.getDate() - 1
  );


  if (
    date.toDateString() ===
    today.toDateString()
  ) {

    return "BUGÜN";

  }


  if (
    date.toDateString() ===
    yesterday.toDateString()
  ) {

    return "DÜN";

  }


  return date
    .toLocaleDateString(
      "tr-TR",
      {
        day: "numeric",
        month: "long"
      }
    )
    .toUpperCase();

}


function formatTime(
  timestamp
) {

  if (!timestamp) {
    return "";
  }


  return new Date(
    timestamp
  )
    .toLocaleTimeString(
      "tr-TR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
  id,
  element
) {

  selectedConversationId =
    id;


  const rect =
    element.getBoundingClientRect();


  let left =
    rect.left - 175;


  let top =
    rect.bottom + 5;


  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth - 220
      )
    );


  top =
    Math.min(
      top,
      window.innerHeight - 120
    );


  contextMenu.style.left =
    left + "px";


  contextMenu.style.top =
    top + "px";


  contextMenu.classList.add(
    "open"
  );

}


function closeContextMenu() {

  contextMenu.classList.remove(
    "open"
  );

}


document.addEventListener(
  "click",
  event => {

    if (
      !contextMenu.contains(
        event.target
      ) &&
      !event.target.closest(
        ".historyMore"
      )
    ) {

      closeContextMenu();

    }

  }
);


/* =====================================================
   RENAME
===================================================== */

document
  .getElementById(
    "renameButton"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        selectedConversationId;


      const item =
        getConversation(id);


      if (!item) {
        return;
      }


      document
        .getElementById(
          "renameInput"
        )
        .value =
        item.title ||
        "Yeni Sohbet";


      closeContextMenu();


      document
        .getElementById(
          "renameModal"
        )
        .classList.add(
          "open"
        );


      setTimeout(
        () => {

          const renameInput =
            document.getElementById(
              "renameInput"
            );

          renameInput.focus();

          renameInput.select();

        },
        100
      );

    }
  );


document
  .getElementById(
    "renameCancel"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "renameModal"
        )
        .classList.remove(
          "open"
        );

    }
  );


document
  .getElementById(
    "renameSave"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        selectedConversationId;


      const renameInput =
        document.getElementById(
          "renameInput"
        );


      const title =
        renameInput.value.trim();


      if (!id || !title) {
        return;
      }


      const conversations =
        loadConversations();


      const item =
        conversations.find(
          x =>
            x.id === id
        );


      if (!item) {
        return;
      }


      item.title =
        title;


      item.updatedAt =
        Date.now();


      saveConversations(
        conversations
      );


      document
        .getElementById(
          "renameModal"
        )
        .classList.remove(
          "open"
        );


      renderChatList();

    }
  );


/* =====================================================
   DELETE
===================================================== */

document
  .getElementById(
    "deleteButton"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        selectedConversationId;


      const item =
        getConversation(id);


      if (!item) {
        return;
      }


      document
        .getElementById(
          "deleteText"
        )
        .textContent =
        `"${item.title}" sohbeti silinecek.`;


      closeContextMenu();


      document
        .getElementById(
          "deleteModal"
        )
        .classList.add(
          "open"
        );

    }
  );


document
  .getElementById(
    "deleteCancel"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "deleteModal"
        )
        .classList.remove(
          "open"
        );

    }
  );


document
  .getElementById(
    "deleteConfirm"
  )
  .addEventListener(
    "click",
    () => {

      const id =
        selectedConversationId;


      if (!id) {
        return;
      }


      let conversations =
        loadConversations();


      conversations =
        conversations.filter(
          item =>
            item.id !== id
        );


      saveConversations(
        conversations
      );


      document
        .getElementById(
          "deleteModal"
        )
        .classList.remove(
          "open"
        );


      if (
        id === conversationId
      ) {

        conversationId =
          null;

        messages = [];

        localStorage.removeItem(
          ACTIVE_KEY
        );


        createNewConversation();

      }


      selectedConversationId =
        null;


      renderChatList();

    }
  );


/* =====================================================
   NEW CHAT
===================================================== */

document
  .getElementById(
    "newChatButton"
  )
  .addEventListener(
    "click",
    () => {

      createNewConversation();

      closeHistory();

      closeMenu();

    }
  );


function createNewConversation() {

  const conversation =
    createConversation();


  conversationId =
    conversation.id;


  messages = [];


  setActiveId(
    conversationId
  );


  showEmpty();

  renderChatList();

  input.focus();

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
  id
) {

  const item =
    getConversation(id);


  if (!item) {
    return;
  }


  conversationId =
    id;


  setActiveId(id);


  selectedConversationId =
    null;


  closeContextMenu();

  closeHistory();

  closeMenu();


  messages =
    Array.isArray(
      item.messages
    )
      ? item.messages
      : [];


  renderMessages();


  /*
    API'den geçmişi de kontrol et.
  */

  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId:
                id,

              getHistory:
                true

            })

        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;


      const conversations =
        loadConversations();


      const current =
        conversations.find(
          x =>
            x.id === id
        );


      if (current) {

        current.messages =
          messages;

        saveConversations(
          conversations
        );

      }


      if (
        conversationId === id
      ) {

        renderMessages();

      }

    }

  } catch {

    /*
      API ulaşılmazsa
      local mesajlar kullanılmaya
      devam eder.
    */

  }

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  if (!conversationId) {

    createNewConversation();

  }


  let item =
    getConversation(
      conversationId
    );


  if (!item) {

    const newConversation =
      createConversation(
        text
      );


    conversationId =
      newConversation.id;


    setActiveId(
      conversationId
    );


    item =
      newConversation;

  }


  if (
    item.title ===
    "Yeni Sohbet"
  ) {

    item.title =
      generateTitle(
        text
      );

  }


  input.value = "";

  sendButton.disabled =
    true;


  messages.push({

    role: "user",

    content: text

  });


  saveCurrentMessages();

  renderMessages();

  renderChatList();

  addTyping();


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId,

              messages: [

                {
                  role: "user",

                  content: text
                }

              ]

            })

        }
      );


    const data =
      await response.json();


    removeTyping();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "ASA cevap veremedi."
      );

    }


    const answer =
      data.answer ||
      "Şu anda cevap oluşturamadım.";


    messages.push({

      role: "assistant",

      content: answer

    });


    if (
      Array.isArray(
        data.history
      )
    ) {

      messages =
        data.history;

    }


    saveCurrentMessages();

    renderMessages();

    renderChatList();


  } catch(error) {

    removeTyping();


    messages.push({

      role: "assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    saveCurrentMessages();

    renderMessages();

    console.error(
      error
    );

  }


  sendButton.disabled =
    false;


  input.focus();

}


/* =====================================================
   SEND EVENTS
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   RENDER
===================================================== */

function renderMessages() {

  chat.innerHTML = "";


  if (!messages.length) {

    showEmpty();

    return;

  }


  messages.forEach(
    message => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      if (
        message.role ===
        "assistant"
      ) {

        const label =
          document.createElement(
            "span"
          );


        label.className =
          "assistantLabel";


        label.textContent =
          "ASA";


        const text =
          document.createElement(
            "div"
          );


        text.className =
          "assistantText";


        text.innerHTML =
          formatAnswer(
            message.content
          );


        bubble.appendChild(
          label
        );


        bubble.appendChild(
          text
        );

      } else {

        bubble.textContent =
          message.content;

      }


      row.appendChild(
        bubble
      );


      chat.appendChild(
        row
      );

    }
  );


  scrollToBottom();

}


/* =====================================================
   FORMAT
===================================================== */

function formatAnswer(
  text
) {

  let result =
    escapeHtml(
      String(text || "")
    );


  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  result =
    result.replace(
      /\n/g,
      "<br>"
    );


  return result;

}


function escapeHtml(
  text
) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   EMPTY
===================================================== */

function showEmpty() {

  chat.innerHTML = `

    <div class="empty">

      <div class="emptyLogo">
        A
      </div>

      <h1>
        Merhaba Alperen 👋
      </h1>

      <p>
        ASA burada. Ne yapmak istersin?
      </p>

    </div>

  `;

}


/* =====================================================
   TYPING
===================================================== */

function addTyping() {

  removeTyping();


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message assistant";


  row.id =
    "typingMessage";


  row.innerHTML = `

    <div class="bubble">

      <span class="assistantLabel">
        ASA
      </span>

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

  `;


  chat.appendChild(
    row
  );


  scrollToBottom();

}


function removeTyping() {

  const typing =
    document.getElementById(
      "typingMessage"
    );


  if (typing) {

    typing.remove();

  }

}

   VOICE
===================================================== */

document
  .getElementById(
    "voiceButton"
  )
  .addEventListener(
    "click",
    () => {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        alert(
          "Bu tarayıcı sesli girişi desteklemiyor."
        );

        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "tr-TR";


      recognition.continuous =
        false;


      recognition.interimResults =
        false;


      recognition.onresult =
        event => {

          input.value =
            event
              .results[0][0]
              .transcript;


          input.focus();

        };


      recognition.start();

    }
  );

/* =====================================================
   KEYBOARD / VISUAL VIEWPORT
===================================================== */

function updateKeyboardPosition() {

  if (!window.visualViewport) {
    return;
  }


  const viewport =
    window.visualViewport;


  const keyboardHeight =
    Math.max(
      0,
      window.innerHeight -
      viewport.height -
      viewport.offsetTop
    );


  if (
    keyboardHeight > 100
  ) {

    inputArea.style.bottom =
      (
        keyboardHeight +
        8
      ) + "px";

  } else {

    inputArea.style.bottom =
      "calc(12px + env(safe-area-inset-bottom))";

  }

}


if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    updateKeyboardPosition
  );


  window.visualViewport.addEventListener(
    "scroll",
    updateKeyboardPosition
  );

}


/* =====================================================
   START
===================================================== */

function startApp() {

  if (!conversationId) {

    const conversations =
      loadConversations();


    if (
      conversations.length
    ) {

      conversationId =
        conversations[0].id;


      setActiveId(
        conversationId
      );

    } else {

      createNewConversation();

      return;

    }

  }


  const item =
    getConversation(
      conversationId
    );


  if (!item) {

    createNewConversation();

    return;

  }


  messages =
    Array.isArray(
      item.messages
    )
      ? item.messages
      : [];


  renderMessages();

}


startApp();
