<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>ASA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#05040a;
  --panel:#11101a;
  --panel2:#171621;
  --text:#f7f5fb;
  --muted:#85818f;
  --muted2:#625f6c;

  --accent:#a331ff;
  --accent2:#c13cff;

  --border:rgba(255,255,255,.09);
  --border2:rgba(255,255,255,.14);

  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05040a;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

body{
  overscroll-behavior:none;
}

/* APP */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(143,35,225,.17),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 75%,
      rgba(100,20,180,.10),
      transparent 35%
    ),
    #05040a;
}

/* HEADER */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;

  height:100px;

  padding:
    calc(12px + var(--safe-top))
    14px
    10px;

  display:flex;
  align-items:center;
  gap:14px;

  z-index:30;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,10,.99),
      rgba(5,4,10,.88)
    );

  border-bottom:1px solid rgba(255,255,255,.06);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.menuButton{
  width:56px;
  height:56px;
  flex-shrink:0;

  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(20,19,30,.82);
  border:1px solid var(--border);
}

.menuLines{
  width:25px;
  height:19px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.menuLines span{
  width:25px;
  height:2px;
  border-radius:2px;
  background:#f5f2f8;
}

.brand{
  display:flex;
  align-items:center;
}

.brandText{
  font-size:29px;
  line-height:1;
  font-weight:700;
  letter-spacing:.29em;
}

/* CHAT */

.chat{
  position:absolute;

  top:100px;
  left:0;
  right:0;
  bottom:92px;

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    30px
    18px
    160px;

  overscroll-behavior:contain;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:3px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(180,50,255,.35);
  border-radius:10px;
}

/* EMPTY */

.empty{
  min-height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
  padding:30px;
}

.emptyOrb{
  width:76px;
  height:76px;
  border-radius:50%;
  margin-bottom:25px;

  background:
    radial-gradient(
      circle at 34% 28%,
      #fff,
      transparent 11%
    ),
    radial-gradient(
      circle,
      #c13cff,
      #711db6 60%,
      #1d092d
    );

  box-shadow:
    0 0 60px rgba(163,48,255,.3);
}

.empty h1{
  font-size:28px;
  margin-bottom:10px;
}

.empty p{
  color:var(--muted);
  font-size:17px;
}

/* MESSAGES */

.message{
  width:100%;
  display:flex;
  margin-bottom:28px;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.user .bubble{
  max-width:88%;

  padding:14px 17px;

  border-radius:
    23px
    23px
    7px
    23px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:white;

  font-size:17px;
  line-height:1.5;

  box-shadow:
    0 12px 35px rgba(126,37,235,.15);
}

.assistant .bubble{
  max-width:95%;

  padding:3px 0;

  color:#f4f1f7;

  font-size:17px;
  line-height:1.7;
}

.assistantLabel{
  display:block;

  margin-bottom:10px;

  color:var(--accent2);

  font-size:11px;
  font-weight:800;
  letter-spacing:.48em;
}

.assistantText a{
  color:var(--accent2);
  text-decoration:underline;
}

.messageImage{
  display:block;

  width:min(330px,78vw);
  max-height:420px;

  object-fit:cover;

  margin-bottom:9px;

  border-radius:20px;

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 15px 50px rgba(0,0,0,.3);
}

/* TYPING */

.typing{
  display:flex;
  gap:7px;
}

.typing span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--accent2);

  animation:
    typing 1.1s infinite ease-in-out;
}

.typing span:nth-child(2){
  animation-delay:.14s;
}

.typing span:nth-child(3){
  animation-delay:.28s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* INPUT */

.inputArea{
  position:absolute;

  left:12px;
  right:12px;

  bottom:
    calc(9px + var(--safe-bottom));

  z-index:40;
}

.inputBox{
  min-height:68px;

  display:flex;
  align-items:center;

  gap:3px;

  padding:6px;

  border-radius:24px;

  background:rgba(16,15,25,.96);

  border:1px solid rgba(255,255,255,.11);

  box-shadow:
    0 18px 55px rgba(0,0,0,.42),
    0 0 40px rgba(139,37,255,.07);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.input{
  flex:1;
  min-width:0;

  height:52px;

  padding:0 6px;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  font-size:16px;
}

.input::placeholder{
  color:#777483;
}

.plusButton,
.voiceButton,
.sendButton{
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;
}

.plusButton{
  width:50px;
  height:50px;

  border-radius:17px;

  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);

  font-size:29px;
  font-weight:300;
}

.voiceButton{
  width:48px;
  height:50px;
}

.sendButton{
  width:48px;
  height:50px;

  color:var(--accent2);

  font-size:31px;
  font-weight:300;
}

.sendButton:disabled{
  opacity:.3;
}

.voiceIcon{
  position:relative;

  width:20px;
  height:26px;

  border:2px solid currentColor;
  border-radius:12px;
}

.voiceIcon::before{
  content:"";

  position:absolute;

  left:50%;
  bottom:-9px;

  width:13px;
  height:8px;

  transform:translateX(-50%);

  border-bottom:2px solid currentColor;
  border-radius:0 0 10px 10px;
}

.voiceIcon::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-14px;

  width:2px;
  height:6px;

  transform:translateX(-50%);

  background:currentColor;
}

/* PREVIEW */

.selectedPreview{
  position:absolute;

  left:0;
  right:0;

  bottom:76px;

  display:flex;
  gap:8px;

  padding:8px;

  overflow-x:auto;

  border-radius:18px;

  background:rgba(16,15,25,.97);
  border:1px solid rgba(255,255,255,.09);

  backdrop-filter:blur(18px);
}

.previewItem{
  position:relative;

  width:60px;
  height:60px;

  flex-shrink:0;
}

.previewItem img{
  width:60px;
  height:60px;

  object-fit:cover;

  border-radius:13px;
}

.previewRemove{
  position:absolute;

  top:-5px;
  right:-5px;

  width:22px;
  height:22px;

  border-radius:50%;

  background:#111;
  border:1px solid rgba(255,255,255,.2);

  color:white;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  z-index:90;

  background:rgba(0,0,0,.6);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

/* SIDEBAR */

.sidebar{
  position:fixed;

  top:0;
  left:0;
  bottom:0;

  z-index:100;

  width:min(430px,88vw);

  padding:
    calc(23px + var(--safe-top))
    20px
    calc(18px + var(--safe-bottom));

  background:
    linear-gradient(
      180deg,
      #0d0c17,
      #080710
    );

  border-right:1px solid rgba(255,255,255,.09);

  transform:translateX(-105%);

  transition:
    transform .3s
    cubic-bezier(.22,.8,.25,1);

  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebarHeader{
  display:flex;
  align-items:center;
  margin-bottom:42px;
}

.sidebarBrand{
  flex:1;

  font-size:27px;
  font-weight:700;

  letter-spacing:.31em;
}

.closeButton{
  width:54px;
  height:54px;

  border-radius:18px;

  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);

  font-size:30px;
}

.menuSectionTitle{
  margin:
    0 8px
    14px;

  color:#777484;

  font-size:11px;
  font-weight:800;

  letter-spacing:.35em;
}

.menuItem{
  width:100%;
  min-height:59px;

  display:flex;
  align-items:center;

  gap:17px;

  padding:0 12px;

  border-radius:17px;

  background:transparent;

  text-align:left;

  font-size:17px;
}

.menuItem:active{
  background:rgba(255,255,255,.06);
}

.menuIcon{
  width:25px;

  display:flex;
  justify-content:center;

  color:#aaa6b5;

  font-size:22px;
}

.menuDivider{
  height:1px;

  margin:20px 8px;

  background:rgba(255,255,255,.075);
}

.chatList{
  flex:1;

  overflow-y:auto;

  padding:0 2px;
}

.historyGroup{
  margin-bottom:23px;
}

.historyDate{
  margin:10px 8px;

  color:#666372;

  font-size:10px;
  font-weight:800;

  letter-spacing:.25em;
}

.historyItem{
  position:relative;

  width:100%;
  min-height:70px;

  padding:
    13px
    52px
    13px
    15px;

  margin-bottom:8px;

  border-radius:17px;

  background:rgba(255,255,255,.025);

  border:1px solid rgba(255,255,255,.055);
}

.historyItem.active{
  background:
    linear-gradient(
      135deg,
      rgba(148,44,245,.18),
      rgba(81,21,130,.12)
    );

  border-color:rgba(169,51,255,.45);
}

.historyTitle{
  color:#f2eef6;

  font-size:16px;
  font-weight:550;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.historyTime{
  margin-top:5px;

  color:#706d7c;

  font-size:11px;
}

.historyMore{
  position:absolute;

  right:9px;
  top:50%;

  width:38px;
  height:38px;

  transform:translateY(-50%);

  border-radius:13px;

  background:rgba(255,255,255,.045);

  color:#aaa7b4;

  font-size:15px;
}

.noHistory{
  padding:30px 10px;

  text-align:center;

  color:#686574;

  font-size:14px;
}

.sidebarFooter{
  padding-top:15px;

  color:#555260;

  text-align:center;

  font-size:11px;
}

/* CONTEXT */

.contextMenu{
  position:fixed;

  z-index:150;

  width:205px;

  padding:7px;

  border-radius:18px;

  background:#161520;

  border:1px solid rgba(255,255,255,.1);

  box-shadow:0 25px 70px rgba(0,0,0,.55);

  display:none;
}

.contextMenu.open{
  display:block;
}

.contextItem{
  width:100%;

  padding:13px 14px;

  border-radius:13px;

  background:transparent;

  text-align:left;

  font-size:14px;
}

.contextItem.delete{
  color:#ff7183;
}

/* MODALS */

.modalOverlay{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  padding:22px;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(11px);
}

.modalOverlay.open{
  display:flex;
}

.modal{
  width:min(470px,100%);

  padding:27px;

  border-radius:27px;

  background:#12111d;

  border:1px solid rgba(255,255,255,.11);

  box-shadow:0 35px 100px rgba(0,0,0,.65);
}

.modal h2{
  margin-bottom:20px;

  font-size:24px;
}

.modalText{
  color:#898796;

  line-height:1.55;
}

.modalInput{
  width:100%;
  height:57px;

  padding:0 17px;

  border-radius:17px;

  background:#090811;

  border:1px solid rgba(255,255,255,.09);

  outline:0;

  color:white;

  font-size:17px;
}

.modalButtons{
  display:flex;
  gap:9px;

  margin-top:18px;
}

.modalButton{
  flex:1;

  height:53px;

  border-radius:16px;

  background:rgba(255,255,255,.055);
}

.modalButton.primary{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.modalButton.danger{
  background:#a72b45;
}

/* SETTINGS */

.settingsList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.settingOption{
  width:100%;
  min-height:64px;

  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-radius:17px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.06);

  text-align:left;
}

.settingOption.active{
  border-color:rgba(169,51,255,.55);
  background:rgba(148,44,245,.13);
}

.settingDescription{
  display:block;

  margin-top:3px;

  color:#777483;

  font-size:12px;
}

.settingCheck{
  color:var(--accent2);
}

/* ATTACHMENT SHEET */

.sheetOverlay{
  position:fixed;
  inset:0;

  z-index:180;

  display:flex;
  align-items:flex-end;

  padding:14px;

  background:rgba(0,0,0,.62);

  backdrop-filter:blur(8px);

  opacity:0;
  pointer-events:none;

  transition:.2s;
}

.sheetOverlay.open{
  opacity:1;
  pointer-events:auto;
}

.attachmentSheet{
  width:100%;

  padding:10px;

  border-radius:27px;

  background:#14131e;

  border:1px solid rgba(255,255,255,.1);

  transform:translateY(20px);

  transition:.25s;
}

.sheetOverlay.open .attachmentSheet{
  transform:translateY(0);
}

.sheetTitle{
  padding:13px 12px 10px;

  color:#777483;

  font-size:11px;
  font-weight:800;

  letter-spacing:.25em;
}

.sheetItem{
  width:100%;
  min-height:57px;

  padding:0 14px;

  display:flex;
  align-items:center;

  background:transparent;

  border-radius:16px;

  text-align:left;

  font-size:17px;
}

.sheetItem:active{
  background:rgba(255,255,255,.06);
}

.sheetCancel{
  width:100%;
  height:53px;

  margin-top:7px;

  border-radius:17px;

  background:rgba(255,255,255,.06);

  color:#aaa7b5;

  font-size:16px;
}

/* VOICE */

.voiceMode{
  position:fixed;
  inset:0;

  z-index:300;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(133,25,205,.18),
      transparent 32%
    ),
    #05040a;

  opacity:0;
  pointer-events:none;

  transform:scale(.97);

  transition:.3s;
}

.voiceMode.open{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}

.voiceTop{
  width:100%;

  padding:
    calc(20px + var(--safe-top))
    22px
    0;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.voiceTopTitle{
  font-size:17px;
  font-weight:700;
  letter-spacing:.28em;
}

.voiceClose{
  width:48px;
  height:48px;

  border-radius:16px;

  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);

  font-size:28px;
}

.voiceCenter{
  flex:1;

  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding-bottom:8vh;
}

.asaOrb{
  width:180px;
  height:180px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      rgba(255,255,255,.8),
      transparent 20%
    ),
    radial-gradient(
      circle,
      #d247ff,
      #9c2fe9 32%,
      #57138d 65%,
      #170a27
    );

  box-shadow:
    0 0 45px rgba(170,45,255,.32),
    0 0 120px rgba(128,27,208,.22);

  animation:
    orbIdle 3.6s infinite ease-in-out;
}

.orbCore{
  width:58px;
  height:58px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      white,
      #e5b5ff 20%,
      #b735ff 50%
    );

  box-shadow:
    0 0 35px rgba(224,161,255,.6);
}

.voiceMode.listening .asaOrb{
  animation:
    orbListen 1.15s infinite ease-in-out;
}

.voiceMode.speaking .asaOrb{
  animation:
    orbSpeak .72s infinite ease-in-out;
}

@keyframes orbIdle{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045)}
}

@keyframes orbListen{
  0%,100%{transform:scale(.97)}
  50%{transform:scale(1.1)}
}

@keyframes orbSpeak{
  0%,100%{transform:scale(.94)}
  50%{transform:scale(1.13)}
}

.voiceStatus{
  margin-top:55px;

  min-height:27px;

  color:#aaa6b4;

  font-size:17px;

  text-align:center;
}

.voiceBottom{
  width:100%;

  padding:
    0
    24px
    calc(30px + var(--safe-bottom));

  display:flex;
  justify-content:center;
}

.voiceControl{
  width:60px;
  height:60px;

  border-radius:21px;

  background:rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.1);

  display:flex;
  align-items:center;
  justify-content:center;
}

/* HIDDEN */

.hiddenInput{
  position:fixed;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;
}

/* RESPONSIVE */

@media(max-width:600px){

  .asaOrb{
    width:160px;
    height:160px;
  }

  .voiceStatus{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<button
  class="menuButton"
  id="menuButton"
  type="button"
  aria-label="Menü"
>
  <span class="menuLines">
    <span></span>
    <span></span>
    <span></span>
  </span>
</button>

<div class="brand">
  <span class="brandText">ASA</span>
</div>

</header>

<main
  class="chat"
  id="chat"
></main>

<div class="inputArea">

  <div
    class="selectedPreview"
    id="selectedPreview"
    hidden
  ></div>

  <div class="inputBox">

    <button
      class="plusButton"
      id="plusButton"
      type="button"
      aria-label="Ekle"
    >
      +
    </button>

    <input
      class="input"
      id="messageInput"
      type="text"
      autocomplete="off"
      enterkeyhint="send"
      placeholder="ASA'ya bir şey sor..."
    >

    <button
      class="voiceButton"
      id="voiceButton"
      type="button"
      aria-label="Sesli sohbet"
    >
      <span class="voiceIcon"></span>
    </button>

    <button
      class="sendButton"
      id="sendButton"
      type="button"
      aria-label="Gönder"
    >
      →
    </button>

  </div>

</div>

</div>

<!-- FILE INPUTS -->

<input
  class="hiddenInput"
  id="photoInput"
  type="file"
  accept="image/*"

/* =========================================================

========================================================= */

const STORAGE_KEY="asa_conversations_v4";
const ACTIVE_KEY="asa_active_v4";

    "marin",

  theme:

    "purple"
};

const THEMES={

  purple:{
    name:"Siyah · Mor",
    accent:"#a331ff",
    accent2:"#c13cff"
  },

  red:{
    name:"Siyah · Kırmızı",
    accent:"#ff315d",
    accent2:"#ff5578"
  },

  blue:{
    name:"Siyah · Mavi",
    accent:"#287cff",
    accent2:"#4e9aff"
  },

  green:{
    name:"Siyah · Yeşil",
    accent:"#19c985",
    accent2:"#39e8a0"
  },

  night:{
    name:"Gece",
    accent:"#7f8cff",
    accent2:"#9ca5ff"
  }

};

const VOICES=[
  ["marin","Marin","Doğal ve dengeli"],
  ["cedar","Cedar","Sakin ve güçlü"],
  ["coral","Coral","Sıcak ve samimi"],
  ["sage","Sage","Yumuşak ve sakin"],
  ["ash","Ash","Net ve doğal"],
  ["verse","Verse","Canlı ve enerjik"]
];

/* ELEMENTS */

/* =========================================================
   HELPERS
========================================================= */

function createId(){

  return "asa-"+Date.now()+"-"+Math.random()
    .toString(36)
    .slice(2,9);

}

function saveSettings(){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

  localStorage.setItem(
    "asa_voice_v4",
    settings.voice
  );

  localStorage.setItem(
    "asa_theme_v4",
    settings.theme
  );

}

function loadChats(){

  try{

    const value=
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(value)
      ? value
      : [];

  }catch{

    return [];

  }

}

function saveChats(chats){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );

}

function formatTime(timestamp){

  return new Date(timestamp)
    .toLocaleTimeString(
      "tr-TR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

function dateLabel(timestamp){

  const date=new Date(timestamp);

  const today=new Date();

  const yesterday=new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );

  if(
    date.toDateString()===
    today.toDateString()
  ){
    return "BUGÜN";
  }

  if(
    date.toDateString()===
    yesterday.toDateString()
  ){
    return "DÜN";
  }

  return date.toLocaleDateString(
    "tr-TR",
    {
      day:"numeric",
      month:"long"
    }
  ).toUpperCase();

}

function generateTitle(text){

  let title=
    String(text||"")
      .replace(/\s+/g," ")
      .trim();

  if(!title){
    return "Yeni Sohbet";
  }

  title=
    title.replace(/[?!.]+$/,"");

  if(title.length>38){
    title=
      title.slice(0,38).trim()+"…";
  }

  return title.charAt(0).toUpperCase()+
    title.slice(1);

}

/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  const theme=
    THEMES[settings.theme]||
    THEMES.purple;

  document.documentElement.style
    .setProperty(
      "--accent",
      theme.accent
    );

  document.documentElement.style
    .setProperty(
      "--accent2",
      theme.accent2
    );

  saveSettings();

}

/* =========================================================
   CHAT STORAGE
========================================================= */

function ensureChat(title){

  const chats=loadChats();

  let chatItem=
    chats.find(
      item=>
        item.id===conversationId
    );

  if(!chatItem){

    chatItem={
      id:conversationId,
      title:
        title||
        "Yeni Sohbet",
      createdAt:Date.now(),
      updatedAt:Date.now()
    };

    chats.unshift(chatItem);

  }else{

    chatItem.updatedAt=Date.now();

    if(
      title &&
      chatItem.title==="Yeni Sohbet"
    ){

      chatItem.title=
        generateTitle(title);

    }

  }

  saveChats(chats);

  return chatItem;

}

/* =========================================================
   RENDER CHAT LIST
========================================================= */

function renderChatList(){

  const chats=
    loadChats()
      .sort(
        (a,b)=>
          b.updatedAt-a.updatedAt
      );

  chatList.innerHTML="";

  if(!chats.length){

    chatList.innerHTML=
      `<div class="noHistory">
        Henüz kayıtlı sohbet yok.
      </div>`;

    return;

  }

  const groups={};

  chats.forEach(item=>{

    const key=
      new Date(item.updatedAt)
        .toDateString();

    if(!groups[key]){
      groups[key]=[];
    }

    groups[key].push(item);

  });

  Object.entries(groups)
    .forEach(([key,items])=>{

      const group=
        document.createElement("div");

      group.className="historyGroup";

      const date=
        document.createElement("div");

      date.className="historyDate";
      date.textContent=
        dateLabel(
          items[0].updatedAt
        );

      group.appendChild(date);

      items.forEach(item=>{

        const row=
          document.createElement("div");

        row.className=
          "historyItem"+
          (
            item.id===conversationId
              ? " active"
              : ""
          );

        const title=
          document.createElement("div");

        title.className="historyTitle";
        title.textContent=item.title;

        const time=
          document.createElement("div");

        time.className="historyTime";
        time.textContent=
          formatTime(
            item.updatedAt
          );

        const more=
          document.createElement("button");

        more.className="historyMore";
        more.type="button";
        more.textContent="•••";

        row.appendChild(title);
        row.appendChild(time);
        row.appendChild(more);

        row.addEventListener(
          "click",
          event=>{

            if(
              event.target.closest(
                ".historyMore"
              )
            ){
              return;
            }

            openConversation(item.id);

          }
        );

        more.addEventListener(
          "click",
          event=>{

            event.stopPropagation();

            selectedConversationId=
              item.id;

            const rect=
              more.getBoundingClientRect();

            contextMenu.style.left=
              Math.max(
                10,
                rect.left-175
              )+"px";

            contextMenu.style.top=
              Math.min(
                window.innerHeight-120,
                rect.bottom+6
              )+"px";

            contextMenu.classList.add("open");

          }
        );

        group.appendChild(row);

      });

      chatList.appendChild(group);

    });

}

/* =========================================================
   SIDEBAR
========================================================= */

function openMenu(){

  renderChatList();

  sidebar.classList.add("open");
  overlay.classList.add("open");

}

function closeMenu(){

  sidebar.classList.remove("open");
  overlay.classList.remove("open");

  contextMenu.classList.remove("open");

}

/* =========================================================
   NEW CHAT
========================================================= */

function newConversation(){

  conversationId=createId();

  localStorage.setItem(
    ACTIVE_KEY,
    conversationId
  );

  messages=[];

  selectedFiles=[];

  updatePreview();

  showEmpty();

  renderChatList();

  input.value="";
  input.focus();

}

document
  .getElementById("newChatButton")
  .onclick=()=>{

    newConversation();

  };

/* =========================================================
   OPEN CHAT
========================================================= */

async function openConversation(id){

  conversationId=id;

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

  closeMenu();

  chat.innerHTML="";

  addTyping();

  try{

    const response=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            conversationId:id,
            getHistory:true
          })
        }
      );

    const data=
      await response.json();

    removeTyping();

    if(
      !response.ok ||
      !data.success
    ){
      throw new Error(
        data.error||
        "Geçmiş alınamadı."
      );
    }

    messages=
      Array.isArray(data.history)
        ? data.history
        : [];

    renderMessages();

  }catch(error){

    removeTyping();

    messages=[];

    showEmpty();

    console.error(
      "ASA HISTORY:",
      error
    );

  }

  renderChatList();

}

========================================================= */

document.addEventListener(

/* =========================================================

========================================================= */

document
  .getElementById("deleteButton")

  .getElementById("deleteCancel")

document
  .getElementById("deleteConfirm")
  .onclick=async()=>{

    const id=
      selectedConversationId;

    try{

      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            conversationId:id,
            deleteConversation:true
          })
        }
      );

    }catch(error){

      console.error(
        "DELETE:",
        error
      );

    }

    saveChats(
      loadChats().filter(
        item=>item.id!==id
      )
    );

    deleteModal.classList.remove(
      "open"
    );

    if(id===conversationId){

      conversationId=createId();

      localStorage.setItem(
        ACTIVE_KEY,
        conversationId
      );

      messages=[];

      showEmpty();

    }

    renderChatList();

  };

/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  const text=
    input.value.trim();

  if(
    !text &&
    selectedFiles.length===0
  ){
    return;
  }

  sendButton.disabled=true;

  const files=
    await prepareFiles();

  input.value="";

  const title=
    text||
    files[0]?.name||
    "Görsel";

  ensureChat(title);

  const userMessage={
    role:"user",
    content:text,
    attachments:
      files.map(
        file=>({
          name:file.name,
          type:file.type,
          size:file.size,
          dataUrl:file.dataUrl
        })
      )
  };

  messages.push(userMessage);

  renderMessages();

  addTyping();

  try{

    const response=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            conversationId,

            messages:[
              userMessage
            ]

          })

        }
      );

    const data=
      await response.json();

    removeTyping();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error||
        "ASA cevap veremedi."
      );

    }

    messages=
      Array.isArray(data.history)
        ? data.history
        : [
            ...messages,
            {
              role:"assistant",
              content:
                data.answer||""
            }
          ];

    selectedFiles=[];

    updatePreview();

    ensureChat();

    renderMessages();
    renderChatList();

  }catch(error){

    removeTyping();

    console.error(
      "ASA CHAT:",
      error
    );

    messages.push({

      role:"assistant",

      content:
        "ASA'ya bağlanırken bir sorun oluştu. Birazdan tekrar deneyelim."

    });

    renderMessages();

  }finally{

    sendButton.disabled=false;

    input.focus();

  }

}

document
  .getElementById("sendButton")
  .onclick=sendMessage;

input.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

========================================================= */

function addFiles(files){

  if(!files.length){
    return;
  }

  selectedFiles.push(...files);

  updatePreview();

  input.focus();

}

function updatePreview(){

  selectedPreview.innerHTML="";

  if(
    selectedFiles.length===0
  ){

    selectedPreview.hidden=true;

    return;

  }

  selectedPreview.hidden=false;

  selectedFiles.forEach(
    (file,index)=>{

      const item=
        document.createElement("div");

      item.className="previewItem";

      if(
        file.type.startsWith("image/")
      ){

        const image=
          document.createElement("img");

        image.src=
          URL.createObjectURL(file);

        item.appendChild(image);

      }else{

        item.style.display="flex";
        item.style.alignItems="center";
        item.style.justifyContent="center";

        item.textContent="📄";

      }

      const remove=
        document.createElement("button");

      remove.className="previewRemove";
      remove.type="button";
      remove.textContent="×";

      remove.onclick=()=>{

        selectedFiles.splice(
          index,
          1
        );

        updatePreview();

      };

      item.appendChild(remove);

      selectedPreview.appendChild(item);

    }
  );

}

function fileToDataURL(file){

  return new Promise(
    resolve=>{

      const reader=
        new FileReader();

      reader.onload=()=>{
        resolve(
          reader.result
        );
      };

      reader.onerror=()=>{
        resolve(null);
      };

      reader.readAsDataURL(file);

    }
  );

}

async function prepareFiles(){

  const result=[];

  for(
    const file of selectedFiles
  ){

    const dataUrl=
      await fileToDataURL(file);

    result.push({

      name:file.name,
      type:file.type,
      size:file.size,
      dataUrl

    });

  }

  return result;

}

/* =========================================================
   RENDER
========================================================= */

function escapeHtml(text){

  return String(text||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function formatAnswer(text){

  let result=
    escapeHtml(text);

  result=
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  result=
    result.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );

  result=
    result.replace(
      /\n/g,
      "<br>"
    );

  return result;

}

function renderMessages(){

  chat.innerHTML="";

  if(!messages.length){

    showEmpty();

    return;

  }

  messages.forEach(message=>{

    if(
      message.role!=="user" &&
      message.role!=="assistant"
    ){
      return;
    }

    const row=
      document.createElement("div");

    row.className=
      "message "+
      (
        message.role==="user"
          ? "user"
          : "assistant"
      );

    const bubble=
      document.createElement("div");

    bubble.className="bubble";

    if(
      message.role==="assistant"
    ){

      bubble.innerHTML=`

        <span class="assistantLabel">
          ASA
        </span>

        <div class="assistantText">
          ${formatAnswer(
            message.content||""
          )}
        </div>

      `;

    }else{

      const attachments=
        Array.isArray(
          message.attachments
        )
          ? message.attachments
          : [];

      attachments.forEach(
        attachment=>{

          if(
            attachment?.dataUrl &&
            attachment?.type?.startsWith(
              "image/"
            )
          ){

            const image=
              document.createElement("img");

            image.className=
              "messageImage";

            image.src=
              attachment.dataUrl;

            image.alt=
              attachment.name||
              "Görsel";

            bubble.appendChild(image);

          }

        }
      );

      if(message.content){

        const text=
          document.createElement("div");

        text.textContent=
          message.content;

        bubble.appendChild(text);

      }

    }

    row.appendChild(bubble);

    chat.appendChild(row);

  });

  scrollBottom();

}

function showEmpty(){

  chat.innerHTML=`

    <div class="empty">

      <div class="emptyOrb"></div>

      <h1>
        Merhaba Alperen
      </h1>

      <p>
        ASA burada. Ne yapmak istersin?
      </p>

    </div>

  `;

}

function addTyping(){

  removeTyping();

  const row=
    document.createElement("div");

  row.className=
    "message assistant";

  row.id="typing";

  row.innerHTML=`

    <div class="bubble">

      <span class="assistantLabel">
        ASA
      </span>

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  `;

  chat.appendChild(row);

  scrollBottom();

}

function removeTyping(){

  document
    .getElementById("typing")
    ?.remove();

}

function scrollBottom(){

  requestAnimationFrame(
    ()=>{
      chat.scrollTop=
        chat.scrollHeight;
    }
  );

}

function renderVoiceOptions(){

  voiceOptions.innerHTML="";

  VOICES.forEach(
    ([id,name,description])=>{

      const button=
        document.createElement("button");

      button.className=
        "settingOption"+
        (
          settings.voice===id
            ? " active"
            : ""
        );

      button.type="button";

      button.innerHTML=`

        <span>
          ${name}
          <small class="settingDescription">
            ${description}
          </small>
        </span>

        <span class="settingCheck">
          ${
            settings.voice===id
              ? "✓"
              : ""
          }
        </span>

      `;

      button.onclick=()=>{

        settings.voice=id;

        saveSettings();

        renderVoiceOptions();

      };

      voiceOptions.appendChild(button);

    }
  );

}

function renderThemeOptions(){

  themeOptions.innerHTML="";

  Object.entries(THEMES)
    .forEach(
      ([id,theme])=>{

        const button=
          document.createElement("button");

        button.className=
          "settingOption"+
          (
            settings.theme===id
              ? " active"
              : ""
          );

        button.type="button";

        button.innerHTML=`

          <span>
            ${theme.name}
          </span>

          <span class="settingCheck">
            ${
              settings.theme===id
                ? "✓"
                : ""
            }
          </span>

        `;

        button.onclick=()=>{

          settings.theme=id;

          applyTheme();

          renderThemeOptions();

        };

        themeOptions.appendChild(button);

      }
    );

}
