<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>ASA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#05040a;
  --bg2:#090711;
  --panel:rgba(16,15,25,.94);
  --panel2:#12111d;
  --text:#f6f3fa;
  --muted:#8b8797;
  --muted2:#686473;
  --accent:#a331ff;
  --accent2:#c23cff;
  --accentSoft:rgba(163,49,255,.18);
  --border:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.48);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Avenir Next","Segoe UI",sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased
}

body{overscroll-behavior:none}

button,input{
  font:inherit
}

button{
  border:0;
  color:inherit
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 52% 8%,
      color-mix(in srgb,var(--accent) 16%,transparent),
      transparent 32%
    ),
    radial-gradient(
      circle at 95% 75%,
      color-mix(in srgb,var(--accent) 10%,transparent),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      var(--bg),
      var(--bg2)
    )
}


/* ================= HEADER ================= */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:104px;
  padding:
    calc(12px + env(safe-area-inset-top))
    16px
    10px;
  display:flex;
  align-items:center;
  gap:15px;
  z-index:30;
  background:rgba(5,4,10,.90);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px)
}

.menuButton{
  width:56px;
  height:56px;
  border-radius:18px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  display:grid;
  place-items:center
}

.hamb{
  width:25px;
  height:18px;
  position:relative
}

.hamb i{
  position:absolute;
  left:0;
  width:25px;
  height:2px;
  border-radius:2px;
  background:#f4f1f8
}

.hamb i:nth-child(1){top:0}
.hamb i:nth-child(2){top:8px}
.hamb i:nth-child(3){top:16px}

.brand{
  font-size:32px;
  font-weight:700;
  letter-spacing:.36em;
  line-height:1;
  padding-left:2px;
  font-family:
    "Avenir Next",
    "SF Pro Display",
    sans-serif
}


/* ================= CHAT ================= */

.chat{
  position:absolute;
  top:104px;
  left:0;
  right:0;
  bottom:92px;
  overflow:auto;
  padding:
    30px
    18px
    145px;
  scroll-behavior:smooth
}

.chat::-webkit-scrollbar{
  width:3px
}

.chat::-webkit-scrollbar-thumb{
  background:
    color-mix(
      in srgb,
      var(--accent) 38%,
      transparent
    );
  border-radius:10px
}


/* ================= EMPTY ================= */

.empty{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px
}

.emptyOrb{
  width:74px;
  height:74px;
  border-radius:50%;
  margin-bottom:24px;
  background:
    radial-gradient(
      circle at 35% 28%,
      #fff,
      transparent 14%
    ),
    radial-gradient(
      circle,
      #d348ff,
      var(--accent) 42%,
      #250b3b 100%
    );
  box-shadow:
    0 0 60px
    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    )
}

.empty h1{
  font-size:28px;
  letter-spacing:-.03em;
  margin-bottom:9px
}

.empty p{
  color:var(--muted);
  font-size:16px;
  line-height:1.5
}


/* ================= MESSAGES ================= */

.message{
  width:100%;
  display:flex;
  margin-bottom:28px
}

.message.user{
  justify-content:flex-end
}

.message.assistant{
  justify-content:flex-start
}

.user .bubble{
  max-width:88%;
  padding:14px 17px;
  border-radius:24px 24px 7px 24px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  font-size:17px;
  line-height:1.5;
  box-shadow:
    0 12px 35px
    color-mix(
      in srgb,
      var(--accent) 15%,
      transparent
    )
}

.assistant .bubble{
  max-width:94%;
  padding:2px 0;
  background:transparent;
  font-size:17px;
  line-height:1.7;
  color:var(--text)
}

.assistantLabel{
  display:block;
  margin-bottom:9px;
  color:var(--accent2);
  font-size:11px;
  font-weight:750;
  letter-spacing:.52em
}

.assistantText strong{
  font-weight:750
}

.assistantText a{
  color:var(--accent2)
}

.messageImage{
  display:block;
  width:min(330px,78vw);
  max-height:420px;
  object-fit:cover;
  border-radius:20px;
  border:1px solid var(--border);
  margin-bottom:8px;
  box-shadow:0 15px 45px var(--shadow)
}

.fileChip{
  display:block;
  padding:10px 12px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,255,255,.035);
  font-size:13px;
  color:var(--muted)
}


/* ================= TYPING ================= */

.typing{
  display:flex;
  gap:7px;
  padding-top:4px
}

.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent2);
  animation:dot 1.1s infinite
}

.typing i:nth-child(2){
  animation-delay:.14s
}

.typing i:nth-child(3){
  animation-delay:.28s
}

@keyframes dot{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0)
  }

  30%{
    opacity:1;
    transform:translateY(-4px)
  }
}


/* ================= INPUT ================= */

.inputArea{
  position:absolute;
  left:12px;
  right:12px;
  bottom:
    calc(
      9px +
      env(safe-area-inset-bottom)
    );
  z-index:40
}

.inputBox{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:6px 7px;
  border-radius:24px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:
    0 18px 55px var(--shadow),
    0 0 40px
    color-mix(
      in srgb,
      var(--accent) 8%,
      transparent
    );
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px)
}

.input{
  flex:1;
  min-width:0;
  height:50px;
  padding:0 7px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px
}

.input::placeholder{
  color:#777383
}

.iconBtn{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border-radius:17px;
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer
}

.iconBtn:active{
  transform:scale(.94)
}

.plus{
  font-size:30px;
  font-weight:250
}

.send{
  font-size:31px;
  font-weight:300;
  color:var(--accent2)
}

.send:disabled{
  opacity:.3
}


/* ================= MICROPHONE ================= */

.micSvg{
  width:24px;
  height:30px
}

.micSvg path,
.micSvg rect{
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round
}


/* ================= ATTACHMENT PREVIEW ================= */

.attachPreview{
  display:none;
  gap:8px;
  overflow:auto;
  padding:
    0
    4px
    7px
}

.attachPreview.open{
  display:flex
}

.preview{
  position:relative;
  flex:0 0 auto;
  width:58px;
  height:58px;
  border-radius:15px;
  overflow:hidden;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05)
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover
}

.previewName{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  padding:5px;
  text-align:center;
  font-size:9px;
  color:var(--muted)
}

.previewRemove{
  position:absolute;
  top:3px;
  right:3px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  font-size:13px;
  line-height:19px;
  text-align:center
}


/* ================= OVERLAYS ================= */

.sheetOverlay,
.overlay,
.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  opacity:0;
  pointer-events:none;
  transition:.22s
}

.sheetOverlay{
  z-index:80
}

.overlay{
  z-index:90
}

.modalOverlay{
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.sheetOverlay.open,
.overlay.open{
  opacity:1;
  pointer-events:auto
}

.modalOverlay.open{
  opacity:1;
  pointer-events:auto
}


/* ================= ATTACHMENT SHEET ================= */

.sheet{
  position:absolute;
  left:14px;
  right:14px;
  bottom:
    calc(
      14px +
      env(safe-area-inset-bottom)
    );
  padding:9px;
  border-radius:26px;
  background:var(--panel2);
  border:1px solid var(--border);
  box-shadow:0 30px 100px var(--shadow);
  transform:translateY(22px);
  transition:.24s
}

.sheetOverlay.open .sheet{
  transform:none
}

.sheetTitle{
  padding:12px;
  color:var(--muted2);
  font-size:10px;
  font-weight:750;
  letter-spacing:.28em
}

.sheetItem{
  width:100%;
  min-height:58px;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:13px;
  border-radius:16px;
  background:transparent;
  color:var(--text);
  font-size:17px;
  text-align:left
}

.sheetItem:active{
  background:rgba(255,255,255,.06)
}

.sheetIcon{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  color:var(--muted)
}

.sheetCancel{
  width:100%;
  height:51px;
  margin-top:7px;
  border-radius:16px;
  background:rgba(255,255,255,.055);
  color:var(--muted);
  font-size:16px
}


/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:min(430px,90vw);
  z-index:100;
  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      180deg,
      #0d0c17,
      #080710
    );
  border-right:1px solid var(--border);
  transform:translateX(-105%);
  transition:
    transform .3s
    cubic-bezier(.22,.8,.25,1);
  display:flex;
  flex-direction:column;
  box-shadow:30px 0 90px var(--shadow)
}

.sidebar.open{
  transform:none
}

.sidebarHeader{
  display:flex;
  align-items:center;
  margin-bottom:27px
}

.sidebarBrand{
  font-size:25px;
  font-weight:700;
  letter-spacing:.34em
}

.closeButton{
  margin-left:auto;
  width:52px;
  height:52px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  font-size:28px;
  font-weight:250
}

.menuSectionTitle{
  color:var(--muted2);
  font-size:10px;
  font-weight:750;
  letter-spacing:.32em;
  margin:
    0
    7px
    10px
}

.menuItem{
  width:100%;
  min-height:55px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 11px;
  border-radius:16px;
  background:transparent;
  text-align:left;
  color:var(--text);
  font-size:16px;
  font-weight:550
}

.menuItem:active{
  background:rgba(255,255,255,.06)
}

.menuIcon{
  width:23px;
  text-align:center;
  color:var(--muted);
  font-size:22px
}

.menuDivider{
  height:1px;
  margin:16px 7px;
  background:var(--border)
}

.chatSection{
  display:flex;
  flex-direction:column;
  min-height:0;
  flex:1
}

.chatList{
  overflow:auto;
  min-height:0;
  padding:2px
}

.historyGroup{
  margin-bottom:18px
}

.historyDate{
  color:var(--muted2);
  font-size:9px;
  font-weight:750;
  letter-spacing:.24em;
  margin:8px
}

.historyItem{
  position:relative;
  width:100%;
  min-height:64px;
  padding:
    11px
    48px
    11px
    13px;
  margin-bottom:7px;
  border-radius:16px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.055);
  text-align:left
}

.historyItem.active{
  background:var(--accentSoft);
  border-color:
    color-mix(
      in srgb,
      var(--accent) 50%,
      transparent
    )
}

.historyTitle{
  font-size:15px;
  font-weight:550;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.historyTime{
  margin-top:4px;
  color:var(--muted2);
  font-size:10px
}

.historyMore{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border-radius:12px;
  background:rgba(255,255,255,.045);
  color:var(--muted);
  font-size:12px
}

.sidebarBottom{
  margin-top:12px
}

.noHistory{
  padding:25px 8px;
  text-align:center;
  color:var(--muted2);
  font-size:13px
}


/* ================= CONTEXT ================= */

.contextMenu{
  position:fixed;
  z-index:250;
  width:200px;
  padding:7px;
  border-radius:18px;
  background:#171620;
  border:1px solid var(--border);
  box-shadow:0 25px 70px var(--shadow);
  display:none
}

.contextMenu.open{
  display:block
}

.contextItem{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:transparent;
  text-align:left;
  font-size:14px
}

.contextItem:active{
  background:rgba(255,255,255,.06)
}

.danger{
  color:#ff7082
}


/* ================= MODALS ================= */

.modal{
  width:min(480px,100%);
  padding:25px;
  border-radius:27px;
  background:var(--panel2);
  border:1px solid var(--border);
  box-shadow:0 35px 100px var(--shadow)
}

.modal h2{
  font-size:23px;
  letter-spacing:-.025em;
  margin-bottom:18px
}

.modal p{
  color:var(--muted);
  line-height:1.5
}

.modalInput{
  width:100%;
  height:55px;
  padding:0 16px;
  border-radius:16px;
  border:1px solid var(--border);
  outline:0;
  background:#090811;
  color:var(--text);
  font-size:16px
}

.modalButtons{
  display:flex;
  gap:9px;
  margin-top:18px
}

.modalButton{
  flex:1;
  height:51px;
  border-radius:16px;
  background:rgba(255,255,255,.055)
}

.modalButton.primary{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    )
}

.modalButton.danger{
  background:#a82b45
}


/* ================= SETTINGS ================= */

.settingsGroup{
  margin-top:22px
}

.settingsLabel{
  font-size:11px;
  font-weight:750;
  color:var(--muted2);
  letter-spacing:.2em;
  margin-bottom:10px
}

.choiceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.choice{
  min-height:52px;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(255,255,255,.035);
  text-align:left;
  padding:0 13px;
  color:var(--muted)
}

.choice.selected{
  border-color:
    color-mix(
      in srgb,
      var(--accent) 65%,
      transparent
    );
  background:var(--accentSoft);
  color:var(--text)
}

.themeGrid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px
}

.theme{
  height:64px;
  border-radius:16px;
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  padding:8px;
  text-align:left
}

.theme i{
  display:block;
  width:25px;
  height:25px;
  border-radius:50%;
  background:var(--swatch);
  margin-bottom:6px
}

.theme span{
  font-size:10px;
  color:var(--muted)
}

.theme.selected{
  border-color:
    color-mix(
      in srgb,
      var(--accent) 65%,
      transparent
    )
}


/* ================= VOICE ================= */

.voiceMode{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:
    radial-gradient(
      circle at 50% 45%,
      color-mix(
        in srgb,
        var(--accent) 18%,
        transparent
      ),
      transparent 34%
    ),
    var(--bg);
  opacity:0;
  pointer-events:none;
  transform:scale(.98);
  transition:.28s
}

.voiceMode.open{
  opacity:1;
  pointer-events:auto;
  transform:none
}

.voiceTop{
  width:100%;
  padding:
    calc(18px + env(safe-area-inset-top))
    20px
    0;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.voiceTopTitle{
  font-size:17px;
  font-weight:700;
  letter-spacing:.35em
}

.voiceClose{
  width:48px;
  height:48px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  font-size:27px;
  font-weight:250
}

.voiceCenter{
  flex:1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding-bottom:8vh
}

.asaOrb{
  width:185px;
  height:185px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle at 34% 26%,
      rgba(255,255,255,.85),
      transparent 10%
    ),
    radial-gradient(
      circle,
      #d54cff 0%,
      var(--accent) 34%,
      #4d117d 68%,
      #12081d 100%
    );
  box-shadow:
    0 0 55px
    color-mix(
      in srgb,
      var(--accent) 35%,
      transparent
    ),
    0 0 130px
    color-mix(
      in srgb,
      var(--accent) 20%,
      transparent
    );
  animation:
    orb 3.5s ease-in-out infinite
}

.asaOrb:before,
.asaOrb:after{
  content:"";
  position:absolute;
  inset:-20px;
  border:
    1px solid
    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    );
  border-radius:50%;
  animation:
    ring 3.3s ease-in-out infinite
}

.asaOrb:after{
  inset:-40px;
  opacity:.5;
  animation-delay:-.8s
}

.orbCore{
  width:57px;
  height:57px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #e8bcff 18%,
      var(--accent) 47%,
      transparent 78%
    );
  box-shadow:
    0 0 40px
    rgba(230,170,255,.65);
  animation:
    core 1.9s ease-in-out infinite
}

.voiceMode.listening .asaOrb{
  animation:
    listen 1.05s ease-in-out infinite
}

.voiceMode.speaking .asaOrb{
  animation:
    speak .7s ease-in-out infinite
}

.voiceStatus{
  margin-top:55px;
  min-height:25px;
  color:var(--muted);
  font-size:17px;
  text-align:center
}

.voiceStatus strong{
  color:var(--text)
}

@keyframes orb{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045)}
}

@keyframes listen{
  0%,100%{transform:scale(.96)}
  50%{transform:scale(1.1)}
}

@keyframes speak{
  0%,100%{transform:scale(.94)}
  50%{transform:scale(1.13)}
}

@keyframes core{
  0%,100%{
    transform:scale(.85);
    opacity:.82
  }
  50%{
    transform:scale(1.12);
    opacity:1
  }
}

@keyframes ring{
  0%,100%{
    transform:scale(.96);
    opacity:.35
  }
  50%{
    transform:scale(1.08);
    opacity:.8
  }
}

.voiceBottom{
  width:100%;
  padding:
    0
    24px

<script>

const API_URL="/api/chat";
const REALTIME_URL="/api/realtime";

const STORAGE_KEY="asa_conversations_v4";
const ACTIVE_KEY="asa_active_conversation_v4";
const SETTINGS_KEY="asa_settings_v2";


let conversationId =
  localStorage.getItem(ACTIVE_KEY) ||
  newConversationId();

let messages=[];
let selectedFiles=[];
let contextConversationId=null;


let realtime={
  pc:null,
  dc:null,
  stream:null,
  audio:null,
  connected:false
};


const $ =
  id =>
  document.getElementById(id);


const chat=$("chat");
const input=$("messageInput");
const sendButton=$("sendButton");
const sidebar=$("sidebar");
const overlay=$("overlay");
const chatList=$("chatList");
const sheetOverlay=$("sheetOverlay");
const attachPreview=$("attachPreview");


/* ================= STORAGE ================= */

function newConversationId(){

  const id=
    "asa-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,8);

  localStorage.setItem(
    ACTIVE_KEY,
    id
  );

  return id;
}


function loadConversations(){

  try{

    const x=
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(x)
      ? x
      : [];

  }catch{

    return [];

  }

}


function saveConversations(x){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(x)
  );

}


/* ================= SETTINGS ================= */

function getSettings(){

  try{

    return JSON.parse(
      localStorage.getItem(
        SETTINGS_KEY
      ) || "{}"
    );

  }catch{

    return {};

  }

}


function saveSettings(x){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(x)
  );

}


function settings(){

  return Object.assign(
    {
      voice:"marin",
      theme:"purple",
      mode:"dark"
    },
    getSettings()
  );

}


const themeMap={

  purple:[
    "#a331ff",
    "#c23cff"
  ],

  red:[
    "#ff3151",
    "#ff6478"
  ],

  blue:[
    "#2f8cff",
    "#58b0ff"
  ],

  green:[
    "#20c987",
    "#64e5ae"
  ]

};


function applySettings(){

  const s=settings();

  const t=
    themeMap[s.theme] ||
    themeMap.purple;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      t[0]
    );


  document.documentElement
    .style
    .setProperty(
      "--accent2",
      t[1]
    );


  document.body.dataset.mode=
    s.mode==="system"

      ? (
          matchMedia(
            "(prefers-color-scheme:dark)"
          ).matches
            ? "dark"
            : "light"
        )

      : s.mode;


  document
    .querySelectorAll(
      "[data-voice]"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "selected",
          b.dataset.voice ===
          s.voice
        )
    );


  document
    .querySelectorAll(
      "[data-theme]"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "selected",
          b.dataset.theme ===
          s.theme
        )
    );


  document
    .querySelectorAll(
      "[data-mode-choice]"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "selected",
          b.dataset.modeChoice ===
          s.mode
        )
    );

}


applySettings();


/* ================= CONVERSATIONS ================= */

function generateTitle(text){

  let x=
    String(text || "")
      .replace(/\s+/g," ")
      .trim()
      .replace(/[?!.]+$/g,"");


  if(!x)
    return "Yeni Sohbet";


  if(x.length>42)
    return (
      x.slice(0,42).trim() +
      "…"
    );


  return (
    x.charAt(0).toUpperCase() +
    x.slice(1)
  );

}


function ensureConversation(first=""){

  const list=
    loadConversations();

  let item=
    list.find(
      x =>
        x.id ===
        conversationId
    );


  if(!item){

    item={
      id:conversationId,

      title:
        first
          ? generateTitle(first)
          : "Yeni Sohbet",

      createdAt:Date.now(),

      updatedAt:Date.now()

    };

    list.unshift(item);

  }


  if(
    first &&
    item.title ===
    "Yeni Sohbet"
  ){

    item.title=
      generateTitle(first);

  }


  item.updatedAt=
    Date.now();


  saveConversations(list);

  renderChatList();

  return item;

}


/* ================= MENU ================= */

function openMenu(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

  renderChatList();

}


function closeMenu(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

  closeContextMenu();

}


$("menuButton").onclick=
  openMenu;

$("closeMenu").onclick=
  closeMenu;

overlay.onclick=
  closeMenu;


/* ================= CHAT LIST ================= */

function dateLabel(ts){

  const d=
    new Date(ts);

  const t=
    new Date();

  const y=
    new Date();

  y.setDate(
    t.getDate()-1
  );


  if(
    d.toDateString() ===
    t.toDateString()
  )
    return "BUGÜN";


  if(
    d.toDateString() ===
    y.toDateString()
  )
    return "DÜN";


  return d
    .toLocaleDateString(
      "tr-TR",
      {
        day:"numeric",
        month:"long"
      }
    )
    .toUpperCase();

}


function timeLabel(ts){

  return new Date(
    ts
  ).toLocaleTimeString(
    "tr-TR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function renderChatList(){

  const list=
    loadConversations()
      .sort(
        (a,b) =>
          (b.updatedAt||0) -
          (a.updatedAt||0)
      );


  chatList.innerHTML="";


  if(!list.length){

    chatList.innerHTML=
      '<div class="noHistory">Henüz kayıtlı sohbet yok.</div>';

    return;

  }


  const groups={};


  list.forEach(
    x => {

      const k=
        new Date(
          x.updatedAt ||
          x.createdAt
        ).toDateString();


      if(!groups[k])
        groups[k]=[];


      groups[k].push(x);

    }
  );


  Object.entries(groups)
    .forEach(
      ([k,items]) => {

        const g=
          document.createElement(
            "div"
          );

        g.className=
          "historyGroup";


        const d=
          document.createElement(
            "div"
          );

        d.className=
          "historyDate";

        d.textContent=
          dateLabel(
            new Date(k)
          );

        g.appendChild(d);


        items.forEach(
          item => {

            const el=
              document.createElement(
                "div"
              );


            el.className=
              "historyItem" +
              (
                item.id ===
                conversationId
                  ? " active"
                  : ""
              );


            el.innerHTML=`

              <div
                class="historyTitle"
              ></div>

              <div
                class="historyTime"
              ></div>

              <button
                class="historyMore"
              >
                •••
              </button>

            `;


            el.querySelector(
              ".historyTitle"
            ).textContent=
              item.title;


            el.querySelector(
              ".historyTime"
            ).textContent=
              timeLabel(
                item.updatedAt
              );


            el.onclick=
              e => {

                if(
                  e.target.closest(
                    ".historyMore"
                  )
                )
                  return;


                openConversation(
                  item.id
                );

              };


            el.querySelector(
              ".historyMore"
            ).onclick=
              e => {

                e.stopPropagation();

                showContextMenu(
                  item.id,
                  e.currentTarget
                );

              };


            g.appendChild(el);

          }
        );


        chatList.appendChild(g);

      }
    );

}


/* ================= CONTEXT ================= */

function showContextMenu(
  id,
  el
){

  contextConversationId=id;


  const r=
    el.getBoundingClientRect();


  const m=
    $("contextMenu");


  m.style.left=
    Math.max(
      10,
      r.left-170
    ) + "px";


  m.style.top=
    Math.min(
      innerHeight-120,
      r.bottom+6
    ) + "px";


  m.classList.add(
    "open"
  );

}


function closeContextMenu(){

  contextConversationId=
    null;

  $("contextMenu")
    .classList
    .remove("open");

}


document.addEventListener(
  "click",
  e => {

    if(
      !$("contextMenu")
        .contains(e.target) &&
      !e.target.closest(
        ".historyMore"
      )
    ){

      closeContextMenu();

    }

  }
);


/* ================= NEW CHAT ================= */

$("newChatButton").onclick=
  () => {

    createNewConversation();

    closeMenu();

  };


$("showChatsButton").onclick=
  () =>
    renderChatList();


function createNewConversation(){

  conversationId=
    newConversationId();

  messages=[];

  selectedFiles=[];

  renderAttachments();

  showEmpty();

  input.value="";

  renderChatList();

  input.focus();

}


/* ================= RENAME ================= */

$("renameButton").onclick=
  () => {

    const item=
      loadConversations()
        .find(
          x =>
            x.id ===
            contextConversationId
        );


    if(!item)
      return;


    $("renameInput").value=
      item.title;


    $("renameModal")
      .classList
      .add("open");


    closeContextMenu();


    setTimeout(
      () =>
        $("renameInput")
          .focus(),
      80
    );

  };


$("renameCancel").onclick=
  () =>
    $("renameModal")
      .classList
      .remove("open");


$("renameSave").onclick=
  () => {

    const title=
      $("renameInput")
        .value
        .trim();


    if(!title)
      return;


    const list=
      loadConversations();


    const item=
      list.find(
        x =>
          x.id ===
          contextConversationId
      );


    if(item){

      item.title=
        title;

      item.updatedAt=
        Date.now();

      saveConversations(
        list
      );

    }


    $("renameModal")
      .classList
      .remove("open");


    renderChatList();

  };


/* ================= DELETE ================= */

$("deleteButton").onclick=
  () => {

    const item=
      loadConversations()
        .find(
          x =>
            x.id ===
            contextConversationId
        );


    if(!item)
      return;


    $("deleteText")
      .textContent=
      `"${item.title}" sohbeti silinecek.`;


    $("deleteModal")
      .classList
      .add("open");


    closeContextMenu();

  };


$("deleteCancel").onclick=
  () =>
    $("deleteModal")
      .classList
      .remove("open");


$("deleteConfirm").onclick=
  async () => {

    const id=
      contextConversationId;


    saveConversations(
      loadConversations()
        .filter(
          x =>
            x.id !== id
        )
    );


    $("deleteModal")
      .classList
      .remove("open");


    try{

      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              conversationId:id,
              deleteConversation:true
            })
        }
      );

    }catch{}


    if(
      id ===
      conversationId
    ){

      createNewConversation();

    }


    renderChatList();

  };


/* ================= OPEN CHAT ================= */

async function openConversation(id){

  conversationId=id;


  localStorage.setItem(
    ACTIVE_KEY,
    id
  );


  closeMenu();

  chat.innerHTML="";

  addTyping();


  try{

    const r=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              conversationId:id,
              getHistory:true
            })

        }
      );


    const d=
      await r.json();


    removeTyping();


    messages=
      Array.isArray(
        d.history
      )
        ? d.history
        : [];


    renderMessages();

  }catch{

    removeTyping();

    showEmpty();

  }


  renderChatList();

}

/* ================= FORMAT ================= */

function escapeHtml(x){

  return String(
    x || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function formatAnswer(x){

  let s=
    escapeHtml(x);


  s=
    s.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  s=
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );


  return s.replace(
    /\n/g,
    "<br>"
  );

}


/* ================= RENDER ================= */

function renderMessages(){

  chat.innerHTML="";


  if(!messages.length){

    showEmpty();

    return;

  }


  messages.forEach(
    m => {

      const row=
        document.createElement(
          "div"
        );


      row.className=
        "message " +
        (
          m.role === "user"
            ? "user"
            : "assistant"
        );


      const b=
        document.createElement(
          "div"
        );


      b.className=
        "bubble";


      if(
        m.role ===
        "assistant"
      ){

        b.innerHTML=`

          <span
            class="assistantLabel"
          >
            ASA
          </span>

          <div
            class="assistantText"
          >
            ${formatAnswer(
              m.content
            )}
          </div>

        `;

      }else{

        (
          m.attachments ||
          []
        ).forEach(
          a => {

            if(
              a.dataUrl &&
              a.type?.startsWith(
                "image/"
              )
            ){

              const im=
                document.createElement(
                  "img"
                );


              im.className=
                "messageImage";


              im.src=
                a.dataUrl;


              im.alt=
                a.name ||
                "Görsel";


              b.appendChild(im);

            }

            else if(
              a.name
            ){

              const c=
                document.createElement(
                  "div"
                );


              c.className=
                "fileChip";


              c.textContent=
                a.name;


              b.appendChild(c);

            }

          }
        );


        if(m.content){

          const t=
            document.createElement(
              "div"
            );


          t.textContent=
            m.content;


          b.appendChild(t);

        }

      }


      row.appendChild(b);

      chat.appendChild(row);

    }
  );


  scrollBottom();

}


/* ================= SEND ================= */

async function sendMessage(){

  const text=
    input.value.trim();


  if(
    !text &&
    !selectedFiles.length
  )
    return;


  input.value="";

  sendButton.disabled=
    true;


  const attachments=
    await prepareAttachments();


  ensureConversation(
    text ||
    attachments[0]?.name ||
    "Dosya"
  );


  messages.push({

    role:"user",

    content:text,

    attachments

  });


  renderMessages();

  addTyping();


  try{

    const apiContent=[];


    if(text){

      apiContent.push({
        type:"input_text",
        text
      });

    }


    for(
      const a of attachments
    ){

      if(
        a.type?.startsWith(
          "image/"
        ) &&
        a.dataUrl
      ){

        apiContent.push({

          type:"input_image",

          image_url:
            a.dataUrl,

          detail:"auto"

        });

      }else{

        apiContent.push({

          type:"input_text",

          text:
            `Dosya: ${a.name}`

        });

      }

    }


    const r=
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              conversationId,

              messages:[
                {
                  role:"user",
                  content:apiContent
                }
              ]

            })

        }
      );


    const d=
      await r.json();


    removeTyping();


    if(
      !r.ok ||
      !d.success
    ){

      throw new Error(
        d.error ||
        "ASA cevap veremedi."
      );

    }


    messages.push({

      role:"assistant",

      content:
        d.answer ||
        "Şu anda cevap oluşturamadım."

    });


    selectedFiles=[];

    renderAttachments();

    ensureConversation();

    renderMessages();

  }catch(e){

    removeTyping();


    messages.push({

      role:"assistant",

      content:
        "Bir bağlantı sorunu oluştu. Birazdan tekrar deneyelim."

    });


    renderMessages();

    console.error(e);

  }


  sendButton.disabled=
    false;

  input.focus();

}

    if(

/* ================= IMAGE ================= */

async function compressImage(file){

  if(
    !file.type.startsWith(
      "image/"
    )
  )
    return null;


  const url=
    URL.createObjectURL(file);


  const img=
    new Image();


  await new Promise(
    resolve => {

      img.onload=
        resolve;

      img.onerror=
        resolve;

      img.src=
        url;

    }
  );


  const max=1600;


  const scale=
    Math.min(
      1,
      max /
      Math.max(
        img.width,
        img.height
      )
    );


  const c=
    document.createElement(
      "canvas"
    );


  c.width=
    Math.max(
      1,
      Math.round(
        img.width *
        scale
      )
    );


  c.height=
    Math.max(
      1,
      Math.round(
        img.height *
        scale
      )
    );


  c.getContext("2d")
    .drawImage(
      img,
      0,
      0,
      c.width,
      c.height
    );


  URL.revokeObjectURL(url);


  return c.toDataURL(
    "image/jpeg",
    .82
  );

}


async function prepareAttachments(){

  const out=[];


  for(
    const f of selectedFiles
  ){

    if(
      f.type.startsWith(
        "image/"
      )
    ){

      out.push({

        name:f.name,

        type:"image/jpeg",

        size:f.size,

        dataUrl:
          await compressImage(f)

      });

    }else{

      out.push({

        name:f.name,

        type:f.type,

        size:f.size,

        dataUrl:null

      });

    }

  }


  return out;

}

async function openVoiceMode(){

  $("voiceMode")
    .classList
    .add("open");


  $("voiceMode")
    .setAttribute(
      "aria-hidden",
      "false"
    );


  setVoiceStatus(
    "Bağlanıyor..."
  );


  try{

    await connectRealtime();

  }catch(e){

    console.error(e);

    setVoiceStatus(
      "<strong>Sesli bağlantı kurulamadı.</strong>"
    );

  }

}


function setVoiceStatus(text){

  $("voiceStatus")
    .innerHTML=
    text;

}


async function connectRealtime(){

  if(
    realtime.connected
  )
    return;


  const stream=
    await navigator
      .mediaDevices
      .getUserMedia({
        audio:true
      });


  realtime.stream=
    stream;


  const pc=
    new RTCPeerConnection();


  realtime.pc=
    pc;


  const audio=
    new Audio();


  audio.autoplay=
    true;


  realtime.audio=
    audio;


  pc.ontrack=
    e => {

      audio.srcObject=
        e.streams[0];

      audio
        .play()
        .catch(
          () => {}
        );

    };


  stream
    .getTracks()
    .forEach(
      t =>
        pc.addTrack(
          t,
          stream
        )
    );


  const dc=
    pc.createDataChannel(
      "oai-events"
    );


  realtime.dc=
    dc;


  dc.onopen=
    () => {

      realtime.connected=
        true;


      setVoiceStatus(
        "Dinliyorum..."
      );


      $("voiceMode")
        .classList
        .add("listening");


      dc.send(
        JSON.stringify({

          type:
            "session.update",

          session:{

            type:
              "realtime",

            model:
              "gpt-realtime-2.1",

            instructions:
              "Sen ASA'sın. Kullanıcının adı Alperen. Türkçe konuş. Samimi, doğal, kısa ve akıcı cevaplar ver. Günlük konuşmada arkadaşça ol. Gereksiz uzun konuşma.",

            audio:{

              input:{

                turn_detection:{
                  type:
                    "server_vad"
                },

                transcription:{

                  model:
                    "gpt-4o-transcribe",

                  language:
                    "tr"

                }

              },

              output:{

                voice:
                  settings().voice

              }

            }

          }

        })
      );

    };


  dc.onmessage=
    e =>
      handleRealtimeEvent(
        JSON.parse(
          e.data
        )
      );


  dc.onerror=
    () =>
      setVoiceStatus(
        "<strong>Ses bağlantısında hata oluştu.</strong>"
      );


  const offer=
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  const r=
    await fetch(
      REALTIME_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain",

          "X-ASA-Voice":
            settings().voice
        },

        body:
          offer.sdp

      }
    );


  if(!r.ok){

    throw new Error(
      await r.text()
    );

  }


  await pc.setRemoteDescription({

    type:"answer",

    sdp:
      await r.text()

  });

}


let voiceUserText="";
let voiceAssistantText="";


function handleRealtimeEvent(ev){

  switch(ev.type){

    case
      "input_audio_buffer.speech_started":

      $("voiceMode")
        .classList
        .add("listening");

      $("voiceMode")
        .classList
        .remove("speaking");

      setVoiceStatus(
        "Dinliyorum..."
      );

      break;


    case
      "input_audio_buffer.speech_stopped":

      setVoiceStatus(
        "ASA düşünüyor..."
      );

      break;


    case
      "conversation.item.input_audio_transcription.completed":

      voiceUserText=
        ev.transcript ||
        "";

      break;


    case
      "response.audio_transcript.delta":

      voiceAssistantText +=
        ev.delta ||
        "";


      $("voiceMode")
        .classList
        .add("speaking");


      $("voiceMode")
        .classList
        .remove("listening");


      setVoiceStatus(
        "ASA konuşuyor..."
      );

      break;


    case
      "response.audio_transcript.done":

      voiceAssistantText=
        ev.transcript ||
        voiceAssistantText;


      if(
        voiceAssistantText
      ){

        messages.push({

          role:"assistant",

          content:
            voiceAssistantText

        });


        renderMessages();


        ensureConversation(
          voiceUserText ||
          "Sesli sohbet"
        );

      }


      voiceAssistantText="";
      voiceUserText="";

      break;


    case
      "response.done":

      $("voiceMode")
        .classList
        .remove("speaking");


      $("voiceMode")
        .classList
        .add("listening");


      setVoiceStatus(
        "Dinliyorum..."
      );

      break;


    case "error":

      console.error(ev);

      setVoiceStatus(
        "<strong>ASA sesli oturumunda bir hata oluştu.</strong>"
      );

      break;

  }

}


function toggleVoiceMic(){

  if(
    !realtime.stream ||
    !realtime.connected
  )
    return;


  const tracks=
    realtime.stream
      .getAudioTracks();


  if(!tracks.length)
    return;


  tracks[0].enabled=
    !tracks[0].enabled;


  $("voiceControl")
    .classList
    .toggle(
      "off",
      !tracks[0].enabled
    );


  setVoiceStatus(
    tracks[0].enabled
      ? "Dinliyorum..."
      : "Mikrofon kapalı"
  );

}


function closeVoiceMode(){

  realtime.dc?.close();

  realtime.pc?.close();

  realtime.stream
    ?.getTracks()
    .forEach(
      t =>
        t.stop()
    );

  realtime.audio?.pause();


  realtime={
    pc:null,
    dc:null,
    stream:null,
    audio:null,
    connected:false
  };


  $("voiceMode")
    .classList
    .remove(
      "open",
      "listening",
      "speaking"
    );


  $("voiceMode")
    .setAttribute(
      "aria-hidden",
      "true"
    );

}
